/* ==================================================

/* ==================================================
   HTML 安全处理
================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==================================================
   Storage URL
================================================== */

function getStorageUrl(path){

  if(!path){

    return "";

  }


  const value =
    String(path).trim();


  if(
    value.startsWith(
      "http://"
    ) ||

    value.startsWith(
      "https://"
    )
  ){

    return value;

  }


  return (

    SUPABASE_URL +

    "/storage/v1/object/public/women-photos/" +

    value.replace(
      /^\/+/,
      ""
    )

  );

}


/* ==================================================
   媒体数组转换
================================================== */

function normalizeArray(value){

  if(!value){

    return [];

  }


  if(Array.isArray(value)){

    return value
      .flat(Infinity)
      .filter(Boolean)
      .map(
        item =>
          String(item).trim()
      )
      .filter(Boolean);

  }


  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){

      return [];

    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed
          .flat(Infinity)
          .filter(Boolean)
          .map(
            item =>
              String(item).trim()
          )
          .filter(Boolean);

      }

    }catch(error){}


    if(
      text.includes(",")
    ){

      return text
        .split(",")
        .map(
          item =>
            item.trim()
        )
        .filter(Boolean);

    }


    return [text];

  }


  return [];

}


/* ==================================================
   显示消息
================================================== */

function showMessage(
  text,
  type="success"
){

  messageBox.textContent =
    text;

  messageBox.className =
    "message " +
    type;

  setTimeout(
    () => {

      messageBox.className =
        "message hidden";

    },
    5000
  );

}


/* ==================================================
   登录
================================================== */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    loginError.classList.add(
      "hidden"
    );


    const email =
      document
        .getElementById(
          "loginEmail"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "loginPassword"
        )
        .value;


    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email,
          password

        });


      if(error){

        throw error;

      }


      currentUser =
        data.user;


      showAdmin();

    }catch(error){

      console.error(
        error
      );


      loginError.textContent =
        "登录失败：" +
        error.message;


      loginError.classList.remove(
        "hidden"
      );

    }

  }
);


/* ==================================================
   检查登录状态
================================================== */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if(
    data &&
    data.session &&
    data.session.user
  ){

    currentUser =

async function loadWomen(){

  womenList.innerHTML = `

    <div class="loading-page">
      正在加载资料……
    </div>

  `;


  try{

    const {
      data,
      error
    } =
      await supabaseClient

        .from(
          "women"
        )

        .select(
          "*"
        )

        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    women =
      data || [];


    renderWomenList();

  }catch(error){

    console.error(
      error
    );


    womenList.innerHTML = `

      <div class="loading-page">

        加载失败：

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}

/* ==================================================
   上传文件到 Storage
================================================== */

async function uploadFile(
  file,
  folder
){

  if(!file){

    throw new Error(
      "没有选择文件"
    );

  }


  /*
    生成唯一文件名

    防止不同女士使用
    相同文件名导致覆盖
  */

  const extension =
    file.name.includes(".")
    ?
    "." +
    file.name
      .split(".")
      .pop()
      .toLowerCase()
    :
    "";


  const uniqueName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,10) +
    extension;


  const path =
    folder +
    "/" +
    uniqueName;


  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        "women-photos"
      )
      .upload(
        path,
        file,
        {

          cacheControl:
            "3600",

          upsert:false,

          contentType:
            file.type || undefined

        }
      );


  if(error){

    throw error;

  }


  return data.path;

}


/* ==================================================
   上传全部照片
================================================== */

async function uploadPhotos(){

  const uploaded =
    [];


  if(
    pendingPhotos.length === 0
  ){

    return uploaded;

  }


  for(
    let i = 0;
    i < pendingPhotos.length;
    i++
  ){

    const file =
      pendingPhotos[i];


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      throw new Error(
        "文件不是图片：" +
        file.name
      );

    }


    const path =
      await uploadFile(
        file,
        "photos"
      );


    uploaded.push(
      path
    );

  }


  return uploaded;

}


/* ==================================================
   上传全部视频
================================================== */

async function uploadVideos(){

  const uploaded =
    [];


  if(
    pendingVideos.length === 0
  ){

    return uploaded;

  }


  for(
    let i = 0;
    i < pendingVideos.length;
    i++
  ){

    const file =
      pendingVideos[i];


    if(
      !file.type.startsWith(
        "video/"
      )
    ){

      throw new Error(
        "文件不是视频：" +
        file.name
      );

    }


    const path =
      await uploadFile(
        file,
        "videos"
      );


    uploaded.push(
      path
    );

  }


  return uploaded;

}


/* ==================================================
   保存女士
================================================== */

womanForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const saveButton =
      document.getElementById(
        "saveButton"
      );


    saveButton.disabled =
      true;


    saveButton.textContent =
      "正在保存……";


    try{


      /* ----------------------
         上传照片
      ---------------------- */

      const newPhotos =
        await uploadPhotos();


      /* ----------------------
         上传视频
      ---------------------- */

      const newVideos =
        await uploadVideos();


      /*
        把新上传的媒体
        加到现有数组后面
      */

      const finalPhotos =
        [
          ...currentPhotos,
          ...newPhotos
        ];


      const finalVideos =
        [
          ...currentVideos,
          ...newVideos
        ];


      /* ----------------------
         表单数据
      ---------------------- */

      const name =
        document
          .getElementById(
            "womanName"
          )
          .value
          .trim();


      const age =
        Number(
          document
            .getElementById(
              "womanAge"
            )
            .value
        );


      const city =
        document
          .getElementById(
            "womanCity"
          )
          .value
          .trim();


      const occupation =
        document
          .getElementById(
            "womanOccupation"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "womanDescription"
          )
          .value
          .trim();


      const whatsapp =
        document
          .getElementById(
            "womanWhatsapp"
          )
          .value
          .trim();


      const telegram =
        document
          .getElementById(
            "womanTelegram"
          )
          .value
          .trim();


      const isPublished =
        document
          .getElementById(
            "womanPublished"
          )
          .value ===
          "true";


      /*
        image_url：

        为了兼容你原来的主页，
        第一张照片同时保存到 image_url。
      */

      const firstPhoto =
        finalPhotos.length > 0
        ?
        finalPhotos[0]
        :
        "";


      const record = {

        name,

        age,

        city,

        occupation,

        description,

        image_url:
          firstPhoto,

        whatsapp,

        telegram,

        is_published:
          isPublished,

        photos:
          finalPhotos,

        videos:
          finalVideos

      };


      /* =====================
         新增
      ===================== */

      if(
        !editingWoman
      ){

        const {
          error
        } =
          await supabaseClient
            .from(
              "women"
            )
            .insert(
              record
            );


        if(error){

          throw error;

        }


        showMessage(
          "女士资料添加成功，照片和视频也已保存。",
          "success"
        );

      }


      /* =====================
         修改
      ===================== */

      else{

        const {
          error
        } =
          await supabaseClient
            .from(
              "women"
            )
            .update(
              record
            )
            .eq(
              "id",
              editingWoman.id
            );


        if(error){

          throw error;

        }


        showMessage(
          "女士资料修改成功，照片和视频也已保存。",
          "success"
        );

      }


      closeModal();


      await loadWomen();


      /*
        清空临时文件
      */

      pendingPhotos =
        [];

      pendingVideos =
        [];


    }catch(error){

      console.error(
        error
      );


      showMessage(
        "保存失败：" +
        error.message,
        "error"
      );

    }finally{

      saveButton.disabled =
        false;

      saveButton.textContent =
        "保存资料";

    }

  }
);


/* ==================================================
   删除女士
================================================== */

async function deleteWoman(
  woman
){

  const confirmed =
    confirm(
      "确定要删除「" +
      (
        woman.name ||
        "这位女士"
      ) +
      "」吗？\n\n删除数据库资料后，该女士将不会再显示在网站。"
    );


  if(!confirmed){

    return;

  }


  try{


    /*
      先删除数据库记录
    */

    const {
      error
    } =
      await supabaseClient

        .from(
          "women"
        )

        .delete()

        .eq(
          "id",
          woman.id
        );


    if(error){

      throw error;

    }


    /*
      尝试删除 Storage 文件

      即使 Storage 删除失败，
      数据库记录也已经删除。
    */

    const paths = [

      ...normalizeArray(
        woman.photos
      ),

      ...normalizeArray(
        woman.videos
      )

    ];


    if(paths.length > 0){

      await supabaseClient
        .storage
        .from(
          "women-photos"
        )
        .remove(
          paths
        );

    }


    showMessage(
      "删除成功。",
      "success"
    );


    await loadWomen();


  }catch(error){

    console.error(
      error
    );


    showMessage(
      "删除失败：" +
      error.message,
      "error"
    );

  }

}
