<script>

/* =========================================
   Supabase
========================================= */

const SUPABASE_URL =
"https://yutraouosffjteivvlfx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   全局变量
========================================= */

let editingId = null;

let currentWoman = null;


/* =========================================
   元素
========================================= */

const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const loginForm =
document.getElementById("loginForm");

const loginError =
document.getElementById("loginError");

const loginButton =
document.getElementById("loginButton");

const logoutButton =

const notice =
document.getElementById("notice");


/* =========================================
   HTML 安全
========================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================================
   提示
========================================= */

function showNotice(
  message,
  type = "success"
) {

  notice.textContent =
    message;

  notice.className =
    "notice " +
    (
      type === "error"
      ? "notice-error"
      : "notice-success"
    );

  notice.style.display =
    "block";


  setTimeout(
    function() {

      notice.style.display =
        "none";

    },
    3500
  );

}


/* =========================================
   Storage URL
========================================= */

function getStorageUrl(
  bucket,
  path
) {

  if (!path) {

    return "";

  }


  if (
    path.startsWith("http://") ||
    path.startsWith("https://")
  ) {

    return path;

  }


  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    bucket +
    "/" +
    path
  );

}


/* =========================================
   登录状态
========================================= */

async function checkLogin() {

  const {
    data,
    error
  } =
  await supabaseClient
    .auth
    .getSession();


  if (
    error ||
    !data.session
  ) {

    showLogin();

    return;

  }


  showAdmin(
    data.session.user
  );

}


/* =========================================
   显示登录
========================================= */

function showLogin() {

  loginPage.style.display =
    "flex";

  adminPage.style.display =
    "none";

}


/* =========================================
   显示后台
========================================= */

function showAdmin(user) {

  loginPage.style.display =
    "none";

  adminPage.style.display =
    "block";


  if (user) {

    userEmail.textContent =
      user.email || "";

  }


  loadWomen();

}


/* =========================================
   登录
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    loginError.style.display =
      "none";

    loginButton.disabled =
      true;

    loginButton.textContent =
      "登录中……";


    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .signInWithPassword({

        email:
          email,

        password:
          password

      });


    if (error) {

      loginError.textContent =
        "登录失败：" +
        error.message;

      loginError.style.display =
        "block";

      loginButton.disabled =
        false;

      loginButton.textContent =
        "登录后台";

      return;

    }


    showAdmin(
      data.user
    );


    loginButton.disabled =
      false;

    loginButton.textContent =
      "登录后台";

  }
);


/* =========================================
   退出
========================================= */

logoutButton.addEventListener(
  "click",
  async function() {

    await supabaseClient
      .auth
      .signOut();


    editingId = null;

    currentWoman = null;

    resetEditor();

    showLogin();

  }
);


/* =========================================
   新增 / 修改
========================================= */

womanForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const payload = {

      name:
        document
          .getElementById("name")
          .value
          .trim(),

      age:
        Number(
          document
            .getElementById("age")
            .value
        ),

      city:
        document
          .getElementById("city")
          .value
          .trim(),

      occupation:
        document
          .getElementById("occupation")
          .value
          .trim(),

      description:
        document
          .getElementById("description")
          .value
          .trim(),

      whatsapp:
        document
          .getElementById("whatsapp")
          .value
          .trim(),

      telegram:
        document
          .getElementById("telegram")
          .value
          .trim(),

      is_published:
        currentWoman
        ? currentWoman.is_published
        : true

    };


    saveButton.disabled =
      true;

    saveButton.textContent =
      "保存中……";


    let result;


    if (editingId) {

      result =
        await supabaseClient
          .from("women")
          .update(payload)
          .eq("id", editingId);

    } else {

      result =
        await supabaseClient
          .from("women")
          .insert(payload)
          .select()
          .single();

    }


    if (result.error) {

      showNotice(
        "保存失败：" +
        result.error.message,
        "error"
      );

      saveButton.disabled =
        false;

      saveButton.textContent =
        editingId
        ? "保存修改"
        : "添加女士";

      return;

    }


    showNotice(
      editingId
      ? "女士资料修改成功"
      : "女士资料添加成功"
    );


    if (!editingId) {

      if (result.data) {

        editingId =
          result.data.id;

        currentWoman =
          result.data;

        mediaManager
          .classList
          .remove("hidden");

        editorTitle.textContent =
          "编辑女士";

        saveButton.textContent =
          "保存修改";

        cancelEditButton
          .classList
          .remove("hidden");

      }

    } else {

      await loadCurrentWoman();

    }


    saveButton.disabled =
      false;

    loadWomen();

  }
);


/* =========================================
   加载所有女士
========================================= */

async function loadWomen() {

  womenList.innerHTML = `
    <div style="
      padding:30px;
      background:#fff;
      border-radius:12px;
      color:#777;
    ">
      正在读取女士资料……
    </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("women")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if (error) {

    womenList.innerHTML = `
      <div style="
        padding:25px;
        background:#fff1f1;
        color:#c33;
        border-radius:12px;
      ">
        读取失败：
        ${escapeHtml(error.message)}
      </div>
    `;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    womenList.innerHTML = `
      <div style="
        padding:40px;
        background:#fff;
        border-radius:12px;
        text-align:center;
        color:#888;
      ">
        目前没有女士资料。
      </div>
    `;

    return;

  }


  womenList.innerHTML = "";


  data.forEach(
    function(woman) {

      const card =
        document.createElement("div");


      card.className =
        "woman-admin-card";


      let image =
        woman.image_url || "";


      if (
        !image &&
        Array.isArray(woman.photos) &&
        woman.photos.length > 0
      ) {

        image =
          getStorageUrl(
            "women-photos",
            woman.photos[0]
          );

      }


      if (!image) {

        image =
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(`
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="300"
              height="400"
            >
              <rect
                width="300"
                height="400"
                fill="#eee"
              />

              <text
                x="150"
                y="200"
                text-anchor="middle"
                fill="#999"
              >
                暂无照片
              </text>
            </svg>
          `);

      }


      const photoCount =
        Array.isArray(woman.photos)
        ? woman.photos.length
        : 0;


      const videoCount =
        Array.isArray(woman.videos)
        ? woman.videos.length
        : 0;


      card.innerHTML = `

        <div class="woman-info">

          <div class="woman-photo">

            <img
              src="${escapeHtml(image)}"
              alt=""
            >

          </div>


          <div class="woman-text">

            <h3>

              ${escapeHtml(
                woman.name ||
                "未填写姓名"
              )}

              ${
                woman.age
                ? " · " +
                  escapeHtml(woman.age) +
                  "岁"
                : ""
              }

            </h3>


            <p>

              ${escapeHtml(
                woman.city || ""
              )}

              ${
                woman.occupation
                ? " · " +
                  escapeHtml(
                    woman.occupation
                  )
                : ""
              }

            </p>


            <p style="
              margin-top:5px;
              color:#999;
              font-size:12px;
            ">

              📷 ${photoCount} 张照片

              &nbsp;&nbsp;

              🎬 ${videoCount} 个视频

            </p>


            <span
              class="
                status
                ${
                  woman.is_published
                  ? "status-on"
                  : "status-off"
                }
              "
            >

              ${
                woman.is_published
                ? "已发布"
                : "未发布"
              }

            </span>

          </div>

        </div>


        <div class="card-actions">

          <button
            class="action-button"
            data-edit="${escapeHtml(woman.id)}"
          >
            编辑
          </button>


          <button
            class="action-button publish-button"
            data-publish="${escapeHtml(woman.id)}"
          >

            ${
              woman.is_published
              ? "隐藏"
              : "发布"
            }

          </button>


          <button
            class="action-button delete-button"
            data-delete="${escapeHtml(woman.id)}"
          >
            删除
          </button>

        </div>

      `;


      card
        .querySelector(
          "[data-edit]"
        )
        .addEventListener(
          "click",
          function() {

            editWoman(
              woman.id
            );

          }
        );


      card
        .querySelector(
          "[data-publish]"
        )
        .addEventListener(
          "click",
          function() {

            togglePublish(
              woman.id,
              woman.is_published
            );

          }
        );


      card
        .querySelector(
          "[data-delete]"
        )
        .addEventListener(
          "click",
          function() {

            deleteWoman(
              woman.id,
              woman.name
            );

          }
        );


      womenList.appendChild(
        card
      );

    }
  );

}


/* =========================================
   编辑女士
========================================= */

async function editWoman(id) {

  const {
    data,
    error
  } =
  await supabaseClient
    .from("women")
    .select("*")
    .eq("id", id)
    .single();


  if (error) {

    showNotice(
      "读取资料失败：" +
      error.message,
      "error"
    );

    return;

  }


  editingId =
    id;

  currentWoman =
    data;


  document
    .getElementById("name")
    .value =
    data.name || "";


  document
    .getElementById("age")
    .value =
    data.age || "";


  document
    .getElementById("city")
    .value =
    data.city || "";


  document
    .getElementById("occupation")
    .value =
    data.occupation || "";


  document
    .getElementById("description")
    .value =
    data.description || "";


  document
    .getElementById("whatsapp")
    .value =
    data.whatsapp || "";


  document
    .getElementById("telegram")
    .value =
    data.telegram || "";


  editorTitle.textContent =
    "编辑女士";


  saveButton.textContent =
    "保存修改";


  cancelEditButton
    .classList
    .remove("hidden");


  mediaManager
    .classList
    .remove("hidden");


  renderPhotos(
    data.photos
  );


  renderVideos(
    data.videos
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

async function loadCurrentWoman() {

  if (!editingId) {

    return;

  }


  const {

/* =========================================
   上传照片
========================================= */

photoInput.addEventListener(
  "change",
  async function() {

    if (!editingId) {

      alert(
        "请先保存女士资料，再上传照片。"
      );

      photoInput.value =
        "";

      return;

    }


    const files =
      Array.from(
        photoInput.files || []
      );


    if (
      files.length === 0
    ) {

      return;

    }


    photoUploadStatus.textContent =
      "正在上传照片……";


    let photos =
      Array.isArray(
        currentWoman.photos
      )
      ? [...currentWoman.photos]
      : [];


    try {

      for (
        let i = 0;
        i < files.length;
        i++
      ) {

        const file =
          files[i];


        const extension =
          file.name
            .split(".")
            .pop()
            .toLowerCase();


        const path =
          editingId +
          "/" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2) +
          "." +
          extension;


        const {
          error
        } =
        await supabaseClient
          .storage
          .from("women-photos")
          .upload(
            path,
            file,
            {
              cacheControl:
                "3600",

              upsert:
                false
            }
          );


        if (error) {

          throw error;

        }


        photos.push(
          path
        );


        photoUploadStatus.textContent =
          "正在上传第 " +
          (i + 1) +
          " / " +
          files.length +
          " 张……";

      }


      const {
        error:updateError
      } =
      await supabaseClient
        .from("women")
        .update({
          photos:
            photos
        })
        .eq(
          "id",
          editingId
        );


      if (updateError) {

        throw updateError;

      }


      currentWoman.photos =
        photos;


      renderPhotos(
        photos
      );


      photoUploadStatus.textContent =
        "照片上传成功";


      showNotice(
        "照片上传成功"
      );

    }

    catch(error) {

      console.error(
        error
      );


      photoUploadStatus.textContent =
        "上传失败";


      showNotice(
        "照片上传失败：" +
        error.message,
        "error"
      );

    }


    photoInput.value =
      "";

  }
);


/* =========================================
   显示照片
========================================= */

function renderPhotos(
  photos
) {

  photoGrid.innerHTML =
    "";


  if (
    !Array.isArray(photos) ||
    photos.length === 0
  ) {

    return;

  }


  photos.forEach(
    function(path,index) {

      const url =
        getStorageUrl(
          "women-photos",
          path
        );


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "media-item";


      item.innerHTML = `

        <img
          src="${escapeHtml(url)}"
          alt="照片"
        >


        <button
          class="media-delete"
          type="button"
        >
          ×
        </button>


        <div class="media-name">

          ${index + 1}.
          ${escapeHtml(
            String(path).split("/").pop()
          )}

        </div>

      `;


      item
        .querySelector(
          ".media-delete"
        )
        .addEventListener(
          "click",
          function() {

            deletePhoto(
              path
            );

          }
        );


      photoGrid.appendChild(
        item
      );

    }
  );

}


/* =========================================
   删除照片
========================================= */

async function deletePhoto(
  path
) {

  if (
    !confirm(
      "确定删除这张照片吗？"
    )
  ) {

    return;

  }


  const {
    error:storageError
  } =
  await supabaseClient
    .storage
    .from("women-photos")
    .remove([
      path
    ]);


  if (storageError) {

    showNotice(
      "删除照片失败：" +
      storageError.message,
      "error"
    );

    return;

  }


  const photos =
    (
      Array.isArray(
        currentWoman.photos
      )
      ? currentWoman.photos
      : []
    ).filter(
      function(item) {

        return item !== path;

      }
    );


  const {
    error
  } =
  await supabaseClient
    .from("women")
    .update({
      photos:
        photos
    })
    .eq(
      "id",
      editingId
    );


  if (error) {

    showNotice(
      "更新照片列表失败：" +
      error.message,
      "error"
    );

    return;

  }


  currentWoman.photos =
    photos;


  renderPhotos(
    photos
  );


  showNotice(
    "照片已删除"
  );

}

/* =========================================
   发布 / 隐藏
========================================= */

async function togglePublish(
  id,
  currentStatus
) {

  const {
    error
  } =
  await supabaseClient
    .from("women")
    .update({

      is_published:
        !currentStatus

    })
    .eq(
      "id",
      id
    );


  if (error) {

    showNotice(
      "修改发布状态失败：" +
      error.message,
      "error"
    );

    return;

  }


  showNotice(
    currentStatus
    ? "女士资料已隐藏"
    : "女士资料已发布"
  );


  loadWomen();

}


/* =========================================
   删除女士
========================================= */

async function deleteWoman(
  id,
  name
) {

  if (
    !confirm(
      "确定删除「" +
      name +
      "」吗？\n\n" +
      "删除女士资料后，数据库记录会被删除。"
    )
  ) {

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("women")
    .delete()
    .eq(
      "id",
      id
    );


  if (error) {

    showNotice(
      "删除失败：" +
      error.message,
      "error"
    );

    return;

  }


  if (
    editingId === id
  ) {

    resetEditor();

  }


  showNotice(
    "女士资料已删除"
  );


  loadWomen();

}
