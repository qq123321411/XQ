<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>缘分 · 相遇｜管理后台</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background: #f6f6f4;

  color: #292725;
}


/* =========================
   Header
========================= */

.header {

  height: 70px;

  background: #fff;

  border-bottom: 1px solid #e8e8e8;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 30px;

  position: sticky;

  top: 0;

  z-index: 100;

}

.logo {

  font-size: 21px;

  font-weight: 700;

}

.logo span {

  color: #b58b63;

  margin: 0 3px;

}

.view-site {

  text-decoration: none;

  color: #666;

  border: 1px solid #ddd;

  border-radius: 20px;

  padding: 8px 15px;

  font-size: 14px;

}


/* =========================
   Container
========================= */

.container {

  width: min(1100px, 94%);

  margin: 35px auto 70px;

}


/* =========================
   Top
========================= */

.top {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  margin-bottom: 25px;

}

.top h1 {

  font-size: 28px;

}

.add-button {

  border: 0;

  background: #292725;

  color: #fff;

  border-radius: 8px;

  padding: 12px 20px;

  cursor: pointer;

  font-size: 14px;

}


/* =========================
   Notice
========================= */

.notice {

  display: none;

  background: #fff;

  border: 1px solid #ddd;

  padding: 15px 18px;

  border-radius: 10px;

  margin-bottom: 20px;

  white-space: pre-wrap;

}

.notice.success {

  display: block;

  color: #168a43;

  background: #eefaf2;

}

.notice.error {

  display: block;

  color: #b42318;

  background: #fff1f0;

}


/* =========================
   List
========================= */

.list {

  display: grid;

  gap: 15px;

}

.person {

  background: #fff;

  border: 1px solid #e7e7e7;

  border-radius: 12px;

  padding: 18px;

  display: flex;

  align-items: center;

  gap: 18px;

}

.person-photo {

  width: 90px;

  height: 110px;

  background: #eee;

  border-radius: 8px;

  overflow: hidden;

  flex-shrink: 0;

}

.person-photo img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.person-info {

  flex: 1;

}

.person-info h2 {

  font-size: 19px;

  margin-bottom: 4px;

}

.person-info p {

  color: #777;

  font-size: 13px;

  margin-top: 3px;

}

.status {

  display: inline-block;

  margin-top: 8px;

  padding: 4px 9px;

  border-radius: 20px;

  font-size: 12px;

}

.status.on {

  color: #168a43;

  background: #e8f7ed;

}

.status.off {

  color: #999;

  background: #eee;

}

.actions {

  display: flex;

  gap: 8px;

}

.action {

  border: 1px solid #ddd;

  background: #fff;

  border-radius: 7px;

  padding: 8px 12px;

  cursor: pointer;

}

.action.delete {

  color: #c62828;

}


/* =========================
   Form
========================= */

.form-box {

  display: none;

  background: #fff;

  border: 1px solid #e5e5e5;

  border-radius: 14px;

  padding: 25px;

  margin-bottom: 30px;

}

.form-box.active {

  display: block;

}

.form-title {

  font-size: 22px;

  margin-bottom: 25px;

}

.form-grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 18px;

}

.field {

  display: flex;

  flex-direction: column;

  gap: 7px;

}

.field.full {

  grid-column: 1 / -1;

}

.field label {

  font-size: 14px;

  font-weight: 600;

}

.field input,

.field textarea {

  width: 100%;

  border: 1px solid #ddd;

  border-radius: 7px;

  padding: 11px;

  font-family: inherit;

  outline: none;

}

.field textarea {

  min-height: 110px;

  resize: vertical;

}

.field input:focus,

.field textarea:focus {

  border-color: #999;

}


/* =========================
   Upload
========================= */

.upload-box {

  border: 1px dashed #ccc;

  border-radius: 10px;

  padding: 20px;

  background: #fafafa;

}

.upload-box input {

  border: 0;

  padding: 0;

}

.preview-grid {

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 10px;

  margin-top: 15px;

}

.preview {

  position: relative;

  border-radius: 8px;

  overflow: hidden;

  background: #eee;

  aspect-ratio: 1 / 1;

}

.preview img,

.preview video {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.preview button {

  position: absolute;

  top: 5px;

  right: 5px;

  border: 0;

  background: rgba(0,0,0,.65);

  color: #fff;

  width: 25px;

  height: 25px;

  border-radius: 50%;

  cursor: pointer;

}


/* =========================
   Checkbox
========================= */

.publish {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 20px;

}

.publish input {

  width: 18px;

  height: 18px;

}


/* =========================
   Buttons
========================= */

.form-buttons {

  display: flex;

  gap: 10px;

  margin-top: 25px;

}

.save {

  background: #292725;

  color: #fff;

  border: 0;

  border-radius: 8px;

  padding: 12px 25px;

  cursor: pointer;

}

.cancel {

  background: #fff;

  color: #555;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 12px 25px;

  cursor: pointer;

}


/* =========================
   Loading
========================= */

.loading {

  text-align: center;

  color: #999;

  padding: 60px;

}


/* =========================
   Mobile
========================= */

@media(max-width:700px) {

  .header {

    padding: 0 15px;

  }

  .container {

    width: calc(100% - 24px);

    margin-top: 20px;

  }

  .top {

    align-items: flex-start;

  }

  .top h1 {

    font-size: 23px;

  }

  .person {

    align-items: flex-start;

  }

  .actions {

    flex-direction: column;

  }

  .form-box {

    padding: 18px;

  }

  .form-grid {

    grid-template-columns: 1fr;

  }

  .field.full {

    grid-column: auto;

  }

  .preview-grid {

    grid-template-columns:
      repeat(3, 1fr);

  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="logo">

    缘分<span>·</span>相遇

  </div>

  <a
    href="../"
    class="view-site"
  >

    查看网站

  </a>

</header>


<main class="container">


<!-- =========================
     TOP
========================= -->

<div class="top">

  <h1>
    女士资料管理
  </h1>

  <button
    class="add-button"
    onclick="openNew()"
  >

    ＋ 新增女士

  </button>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div
  id="notice"
  class="notice"
></div>


<!-- =========================
     FORM
========================= -->

<section
  id="formBox"
  class="form-box"
>

  <h2
    id="formTitle"
    class="form-title"
  >
    新增女士
  </h2>


  <div class="form-grid">


    <!-- 姓名 -->

    <div class="field">

      <label>
        姓名
      </label>

      <input
        id="name"
        type="text"
        placeholder="请输入姓名"
      >

    </div>


    <!-- 年龄 -->

    <div class="field">

      <label>
        年龄
      </label>

      <input
        id="age"
        type="number"
        min="18"
        max="100"
        placeholder="请输入年龄"
      >

    </div>


    <!-- 城市 -->

    <div class="field">

      <label>
        城市
      </label>

      <input
        id="city"
        type="text"
        placeholder="例如：Mexico City"
      >

    </div>


    <!-- 职业 -->

    <div class="field">

      <label>
        职业
      </label>

      <input
        id="occupation"
        type="text"
        placeholder="请输入职业"
      >

    </div>


    <!-- WhatsApp -->

    <div class="field">

      <label>
        WhatsApp
      </label>

      <input
        id="whatsapp"
        type="text"
        placeholder="例如：5215512345678"
      >

    </div>


    <!-- Telegram -->

    <div class="field">

      <label>
        Telegram
      </label>

      <input
        id="telegram"
        type="text"
        placeholder="例如：@username"
      >

    </div>


    <!-- 简介 -->

    <div class="field full">

      <label>
        简介
      </label>

      <textarea
        id="description"
        placeholder="请输入女士简介"
      ></textarea>

    </div>


    <!-- 照片 -->

    <div class="field full">

      <label>
        照片
      </label>

      <div class="upload-box">

        <input
          id="photoInput"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          multiple
        >

        <div
          id="photoPreview"
          class="preview-grid"
        ></div>

      </div>

    </div>


    <!-- 视频 -->

    <div class="field full">

      <label>
        短视频
      </label>

      <div class="upload-box">

        <input
          id="videoInput"
          type="file"
          accept="video/mp4,video/webm,video/quicktime"
          multiple
        >

        <div
          id="videoPreview"
          class="preview-grid"
        ></div>

      </div>

    </div>


  </div>


  <!-- 发布 -->

  <label class="publish">

    <input
      id="isPublished"
      type="checkbox"
      checked
    >

    发布到网站首页

  </label>


  <!-- Buttons -->

  <div class="form-buttons">

    <button
      class="save"
      onclick="savePerson()"
    >

      保存资料

    </button>

    <button
      class="cancel"
      onclick="closeForm()"
    >

      取消

    </button>

  </div>

</section>


<!-- =========================
     LIST
========================= -->

<section
  id="list"
  class="list"
>

  <div class="loading">

    正在加载……

  </div>

</section>


</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://yutraouosffjteivvlfx.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


/* =====================================================
   状态
===================================================== */

let people = [];

let editingId = null;

let selectedPhotos = [];

let selectedVideos = [];

let existingPhotos = [];

let existingVideos = [];


/* =====================================================
   API
===================================================== */

async function supabaseRequest(
  endpoint,
  options = {}
) {

  const response =
    await fetch(
      SUPABASE_URL +
      endpoint,
      {

        ...options,

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      text ||
      `HTTP ${response.status}`
    );

  }


  if (!text) {

    return null;

  }


  return JSON.parse(
    text
  );

}


/* =====================================================
   Storage 上传
===================================================== */

async function uploadFile(
  bucket,
  file
) {

  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  const filename =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8) +
    "_" +
    safeName;


  const path =
    filename;


  const response =
    await fetch(

      SUPABASE_URL +
      "/storage/v1/object/" +
      bucket +
      "/" +
      path,

      {

        method: "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "x-upsert":
            "false"

        },

        body: file

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "文件上传失败：\n" +
      text
    );

  }


  return (

    SUPABASE_URL +
    "/storage/v1/object/public/" +
    bucket +
    "/" +
    path

  );

}


/* =====================================================
   Notice
===================================================== */

function showNotice(
  message,
  type
) {

  const box =
    document.getElementById(
      "notice"
    );


  box.textContent =
    message;


  box.className =
    "notice " +
    type;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   加载女士
===================================================== */

async function loadPeople() {

  const list =
    document.getElementById(
      "list"
    );


  list.innerHTML = `

    <div class="loading">

      正在加载女士资料……

    </div>

  `;


  try {

    people =
      await supabaseRequest(
        "/rest/v1/women" +
        "?select=*" +
        "&order=created_at.desc"
      );


    renderList();

  }

  catch(error) {

    console.error(
      error
    );


    list.innerHTML = `

      <div class="loading">

        加载失败

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   渲染列表
===================================================== */

function renderList() {

  const list =
    document.getElementById(
      "list"
    );


  if (
    !people ||
    people.length === 0
  ) {

    list.innerHTML = `

      <div class="loading">

        暂时没有女士资料。

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  people.forEach(
    person => {


      const photos =
        Array.isArray(
          person.photos
        )
        ? person.photos
        : [];


      let image =
        person.image_url ||
        photos[0] ||
        "";


      if (
        image &&
        !image.startsWith(
          "http"
        )
      ) {

        image =
          SUPABASE_URL +
          "/storage/v1/object/public/women-photos/" +
          encodeURIComponent(
            image
          );

      }


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "person";


      card.innerHTML = `

        <div class="person-photo">

          ${
            image
            ? `

              <img
                src="${escapeHtml(image)}"
              >

            `
            : ""
          }

        </div>


        <div class="person-info">

          <h2>

            ${escapeHtml(
              person.name ||
              "未填写姓名"
            )}

            ${
              person.age
              ? " · " +
                person.age +
                "岁"
              : ""
            }

          </h2>


          <p>

            ${
              escapeHtml(
                person.city ||
                ""
              )
            }

            ${
              person.occupation
              ? " · " +
                escapeHtml(
                  person.occupation
                )
              : ""
            }

          </p>


          <p>

            照片：
            ${photos.length}

            张

           　

            视频：
            ${
              Array.isArray(
                person.videos
              )
              ? person.videos.length
              : 0
            }

            个

          </p>


          <span
            class="status ${
              person.is_published
              ? "on"
              : "off"
            }"
          >

            ${
              person.is_published
              ? "已发布"
              : "已下架"
            }

          </span>

        </div>


        <div class="actions">

          <button
            class="action"
            onclick="editPerson('${person.id}')"
          >

            编辑

          </button>


          <button
            class="action"
            onclick="togglePublish('${person.id}', ${!person.is_published})"
          >

            ${
              person.is_published
              ? "下架"
              : "发布"
            }

          </button>


          <button
            class="action delete"
            onclick="deletePerson('${person.id}')"
          >

            删除

          </button>

        </div>

      `;


      list.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   新增
===================================================== */

function openNew() {

  editingId =
    null;

  existingPhotos =
    [];

  existingVideos =
    [];

  selectedPhotos =
    [];

  selectedVideos =
    [];


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "新增女士";


  clearForm();


  document
    .getElementById(
      "formBox"
    )
    .classList
    .add(
      "active"
    );


  renderPreviews();

}


/* =====================================================
   编辑
===================================================== */

function editPerson(
  id
) {

  const person =
    people.find(
      p =>
        p.id === id
    );


  if (!person) {

    return;

  }


  editingId =
    id;


  existingPhotos =
    Array.isArray(
      person.photos
    )
    ? [...person.photos]
    : [];


  existingVideos =
    Array.isArray(
      person.videos
    )
    ? [...person.videos]
    : [];


  selectedPhotos =
    [];

  selectedVideos =
    [];


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "编辑女士";


  document
    .getElementById(
      "name"
    )
    .value =
    person.name ||
    "";


  document
    .getElementById(
      "age"
    )
    .value =
    person.age ||
    "";


  document
    .getElementById(
      "city"
    )
    .value =
    person.city ||
    "";


  document
    .getElementById(
      "occupation"
    )
    .value =
    person.occupation ||
    "";


  document
    .getElementById(
      "description"
    )
    .value =
    person.description ||
    "";


  document
    .getElementById(
      "whatsapp"
    )
    .value =
    person.whatsapp ||
    "";


  document
    .getElementById(
      "telegram"
    )
    .value =
    person.telegram ||
    "";


  document
    .getElementById(
      "isPublished"
    )
    .checked =
    !!person.is_published;


  document
    .getElementById(
      "formBox"
    )
    .classList
    .add(
      "active"
    );


  renderPreviews();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   清空
===================================================== */

function clearForm() {

  document
    .getElementById(
      "name"
    )
    .value =
    "";


  document
    .getElementById(
      "age"
    )
    .value =
    "";


  document
    .getElementById(
      "city"
    )
    .value =
    "";


  document
    .getElementById(
      "occupation"
    )
    .value =
    "";


  document
    .getElementById(
      "description"
    )
    .value =
    "";


  document
    .getElementById(
      "whatsapp"
    )
    .value =
    "";


  document
    .getElementById(
      "telegram"
    )
    .value =
    "";


  document
    .getElementById(
      "isPublished"
    )
    .checked =
    true;


  document
    .getElementById(
      "photoInput"
    )
    .value =
    "";


  document
    .getElementById(
      "videoInput"
    )
    .value =
    "";

}


/* =====================================================
   关闭
===================================================== */

function closeForm() {

  document
    .getElementById(
      "formBox"
    )
    .classList
    .remove(
      "active"
    );

}


/* =====================================================
   选择照片
===================================================== */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    function() {

      selectedPhotos =
        [
          ...selectedPhotos,
          ...Array.from(
            this.files
          )
        ];

      renderPreviews();

      this.value =
        "";

    }
  );


/* =====================================================
   选择视频
===================================================== */

document
  .getElementById(
    "videoInput"
  )
  .addEventListener(
    "change",
    function() {

      selectedVideos =
        [
          ...selectedVideos,
          ...Array.from(
            this.files
          )
        ];

      renderPreviews();

      this.value =
        "";

    }
  );


/* =====================================================
   预览
===================================================== */

function renderPreviews() {

  const photoBox =
    document.getElementById(
      "photoPreview"
    );


  const videoBox =
    document.getElementById(
      "videoPreview"
    );


  photoBox.innerHTML =
    "";


  videoBox.innerHTML =
    "";


  /* 旧照片 */

  existingPhotos.forEach(
    (
      photo,
      index
    ) => {

      let url =
        photo;


      if (
        !url.startsWith(
          "http"
        )
      ) {

        url =
          SUPABASE_URL +
          "/storage/v1/object/public/women-photos/" +
          encodeURIComponent(
            photo
          );

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview";


      item.innerHTML = `

        <img
          src="${escapeHtml(url)}"
        >

        <button
          type="button"
        >
          ×
        </button>

      `;


      item
        .querySelector(
          "button"
        )
        .onclick =
        function() {

          existingPhotos
            .splice(
              index,
              1
            );

          renderPreviews();

        };


      photoBox.appendChild(
        item
      );

    }
  );


  /* 新照片 */

  selectedPhotos.forEach(
    (
      file,
      index
    ) => {

      const url =
        URL.createObjectURL(
          file
        );


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview";


      item.innerHTML = `

        <img
          src="${url}"
        >

        <button
          type="button"
        >
          ×
        </button>

      `;


      item
        .querySelector(
          "button"
        )
        .onclick =
        function() {

          selectedPhotos
            .splice(
              index,
              1
            );

          renderPreviews();

        };


      photoBox.appendChild(
        item
      );

    }
  );


  /* 旧视频 */

  existingVideos.forEach(
    (
      video,
      index
    ) => {

      let url =
        video;


      if (
        !url.startsWith(
          "http"
        )
      ) {

        url =
          SUPABASE_URL +
          "/storage/v1/object/public/women-videos/" +
          encodeURIComponent(
            video
          );

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview";


      item.innerHTML = `

        <video
          src="${escapeHtml(url)}"
          controls
        ></video>

        <button
          type="button"
        >
          ×
        </button>

      `;


      item
        .querySelector(
          "button"
        )
        .onclick =
        function() {

          existingVideos
            .splice(
              index,
              1
            );

          renderPreviews();

        };


      videoBox.appendChild(
        item
      );

    }
  );


  /* 新视频 */

  selectedVideos.forEach(
    (
      file,
      index
    ) => {

      const url =
        URL.createObjectURL(
          file
        );


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview";


      item.innerHTML = `

        <video
          src="${url}"
          controls
        ></video>

        <button
          type="button"
        >
          ×
        </button>

      `;


      item
        .querySelector(
          "button"
        )
        .onclick =
        function() {

          selectedVideos
            .splice(
              index,
              1
            );

          renderPreviews();

        };


      videoBox.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   保存
===================================================== */

async function savePerson() {

  const name =
    document
      .getElementById(
        "name"
      )
      .value
      .trim();


  const age =
    Number(
      document
        .getElementById(
          "age"
        )
        .value
    );


  const city =
    document
      .getElementById(
        "city"
      )
      .value
      .trim();


  const occupation =
    document
      .getElementById(
        "occupation"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "description"
      )
      .value
      .trim();


  const whatsapp =
    document
      .getElementById(
        "whatsapp"
      )
      .value
      .trim();


  const telegram =
    document
      .getElementById(
        "telegram"
      )
      .value
      .trim();


  const isPublished =
    document
      .getElementById(
        "isPublished"
      )
      .checked;


  if (!name) {

    alert(
      "请输入姓名"
    );

    return;

  }


  if (
    !age ||
    age < 18 ||
    age > 100
  ) {

    alert(
      "请输入正确年龄"
    );

    return;

  }


  try {

    showNotice(
      "正在保存，请稍候……",
      "success"
    );


    /* =====================
       上传新照片
    ===================== */

    for (
      const file
      of selectedPhotos
    ) {

      const url =
        await uploadFile(
          "women-photos",
          file
        );


      existingPhotos.push(
        url
      );

    }


    /* =====================
       上传新视频
    ===================== */

    for (
      const file
      of selectedVideos
    ) {

      const url =
        await uploadFile(
          "women-videos",
          file
        );


      existingVideos.push(
        url
      );

    }


    /* =====================
       主照片
    ===================== */

    let imageUrl =
      "";


    if (
      existingPhotos.length
      > 0
    ) {

      imageUrl =
        existingPhotos[0];

    }


    /* =====================
       数据
    ===================== */

    const data = {

      name,

      age,

      city,

      occupation,

      description,

      image_url:
        imageUrl,

      whatsapp,

      telegram,

      photos:
        existingPhotos,

      videos:
        existingVideos,

      is_published:
        isPublished

    };


    /* =====================
       新增
    ===================== */

    if (!editingId) {

      await supabaseRequest(
        "/rest/v1/women",
        {

          method:
            "POST",

          headers: {

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              data
            )

        }
      );

    }


    /* =====================
       编辑
    ===================== */

    else {

      await supabaseRequest(

        "/rest/v1/women" +
        "?id=eq." +
        encodeURIComponent(
          editingId
        ),

        {

          method:
            "PATCH",

          headers: {

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              data
            )

        }

      );

    }


    showNotice(
      "保存成功！",
      "success"
    );


    closeForm();


    await loadPeople();

  }

  catch(error) {

    console.error(
      error
    );


    showNotice(
      "保存失败：\n" +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   发布 / 下架
===================================================== */

async function togglePublish(
  id,
  value
) {

  try {

    await supabaseRequest(

      "/rest/v1/women" +
      "?id=eq." +
      encodeURIComponent(
        id
      ),

      {

        method:
          "PATCH",

        headers: {

          "Prefer":
            "return=minimal"

        },

        body:
          JSON.stringify({

            is_published:
              value

          })

      }

    );


    await loadPeople();

  }

  catch(error) {

    alert(
      "操作失败：\n" +
      error.message
    );

  }

}


/* =====================================================
   删除
===================================================== */

async function deletePerson(
  id
) {

  const person =
    people.find(
      p =>
        p.id === id
    );


  if (!person) {

    return;

  }


  const ok =
    confirm(
      "确定删除 " +
      (
        person.name ||
        "这位女士"
      ) +
      " 吗？\n\n删除后数据库资料也会删除。"
    );


  if (!ok) {

    return;

  }


  try {

    await supabaseRequest(

      "/rest/v1/women" +
      "?id=eq." +
      encodeURIComponent(
        id
      ),

      {

        method:
          "DELETE"

      }

    );


    await loadPeople();


    showNotice(
      "删除成功。",
      "success"
    );

  }

  catch(error) {

    alert(
      "删除失败：\n" +
      error.message
    );

  }

}


/* =====================================================
   开始
===================================================== */

loadPeople();
