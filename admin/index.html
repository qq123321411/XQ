/* ==================================================

/* ==================================================

/* ==================================================
   HTML 安全
================================================== */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* ==================================================
   Storage URL
================================================== */

function getStorageUrl(path){

  if(!path){
    return "";
  }

  const value =
    String(path).trim();

  if(
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ){

    return value;

  }

  return (

    SUPABASE_URL +

    "/storage/v1/object/public/" +

    STORAGE_BUCKET +

    "/" +

    value.replace(/^\/+/,"")

  );

}


/* ==================================================
   获取 Storage 路径
================================================== */

function getStoragePath(value){

  if(!value){
    return "";
  }

  const text =
    String(value).trim();

  if(
    text.startsWith(
      SUPABASE_URL +
      "/storage/v1/object/public/" +
      STORAGE_BUCKET +
      "/"
    )
  ){

    return text.replace(
      SUPABASE_URL +
      "/storage/v1/object/public/" +
      STORAGE_BUCKET +
      "/",
      ""
    );

  }

  return text.replace(/^\/+/,"");

}


/* ==================================================
   数组转换
================================================== */

function normalizeArray(value){

  if(!value){
    return [];
  }

  if(Array.isArray(value)){

    return value
      .flat(Infinity)
      .filter(Boolean)
      .map(
        item => String(item).trim()
      )
      .filter(Boolean);

  }

  if(typeof value === "string"){

    const text =
      value.trim();

    if(!text){
      return [];
    }

    try{

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){

        return parsed
          .flat(Infinity)
          .filter(Boolean)
          .map(
            item => String(item).trim()
          )
          .filter(Boolean);

      }

    }catch(error){}

    if(text.includes(",")){

      return text
        .split(",")
        .map(
          item => item.trim()
        )
        .filter(Boolean);

    }

    return [text];

  }

  return [];

}

  messageTimer =

}

    const email =

        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;

    loginButton.disabled =
      true;

    loginButton.textContent =
      "正在登录……";

    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email,
          password

        });

      if(error){
        throw error;
      }

      currentUser =
        data.user;

      showAdmin();

    }catch(error){

      console.error(error);

      loginError.textContent =
        "登录失败：" +
        (
          error.message ||
          "邮箱或密码错误"
        );

      loginError.classList.remove(
        "hidden"
      );

    }finally{

      loginButton.disabled =
        false;

      loginButton.textContent =
        "登录后台";

    }

  }
);

================================================== */

async function checkSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if(error){
      throw error;
    }

    if(
      data?.session?.user
    ){

      currentUser =
        data.session.user;

      showAdmin();

    }else{

      showLogin();

    }

  }catch(error){

    console.error(error);

    showLogin();

  }

}

async function loadWomen(){

  womenList.innerHTML = `

    <div class="loading-page">
      正在加载资料……
    </div>

  `;

  try{

    const {
      data,
      error
    } =
      await supabaseClient

        .from("women")

        .select("*")

        .order(
          "created_at",
          {
            ascending:false
          }
        );

    if(error){
      throw error;
    }

    women =
      data || [];

    renderWomenList();

  }catch(error){

    console.error(error);

    womenList.innerHTML = `

      <div class="loading-page">

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}

            }

            ${

              " · " +

  editingWoman =
    woman;

  currentPhotos =
    normalizeArray(
      woman.photos
    );

  currentVideos =
    normalizeArray(
      woman.videos
    );

  /*
    兼容旧 image_url

    如果旧数据只有 image_url，
    自动加入照片数组。

    woman.image_url &&
    !currentPhotos.includes(
      woman.image_url

      woman.image_url
    );

  pendingPhotos =
    [];

  pendingVideos =

    .getElementById("modalTitle")
    .textContent =

  document
    .getElementById("womanId")
    .value =
    woman.id || "";

  document
    .getElementById("womanName")
    .value =
    woman.name || "";

  document
    .getElementById("womanAge")
    .value =
    woman.age || "";

  document
    .getElementById("womanCity")
    .value =
    woman.city || "";

  document
    .getElementById("womanOccupation")
    .value =
    woman.occupation || "";

  document
    .getElementById("womanDescription")
    .value =
    woman.description || "";

  document
    .getElementById("womanWhatsapp")
    .value =
    woman.whatsapp || "";

  document
    .getElementById("womanTelegram")
    .value =

/* ==================================================
   上传文件
================================================== */

async function uploadFile(
  file,
  folder
){

  if(!file){
    throw new Error(
      "没有选择文件"
    );
  }

  if(
    !file.name
  ){

    throw new Error(
      "文件名称无效"
    );

  }

  const extension =
    file.name.includes(".")
    ?
    "." +
    file.name
      .split(".")
      .pop()
      .toLowerCase()
    :
    "";

  const uniqueName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,10) +
    extension;

  const path =
    folder +
    "/" +
    uniqueName;

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:
            file.type ||
            undefined
        }
      );

  if(error){
    throw error;
  }

  return data.path;

}


/* ==================================================
   上传照片
================================================== */

async function uploadPhotos(){

  const uploaded = [];

  for(
    const file of pendingPhotos
  ){

    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      throw new Error(
        "文件不是图片：" +
        file.name
      );

    }

    const path =
      await uploadFile(
        file,
        "photos"
      );

    uploaded.push(path);

  }

  return uploaded;

}


/* ==================================================
   上传视频
================================================== */

async function uploadVideos(){

  const uploaded = [];

  for(
    const file of pendingVideos
  ){

    if(
      !file.type.startsWith(
        "video/"
      )
    ){

      throw new Error(
        "文件不是视频：" +
        file.name
      );

    }

    const path =
      await uploadFile(
        file,
        "videos"
      );

    uploaded.push(path);

  }

  return uploaded;

}


/* ==================================================
   删除 Storage 文件
================================================== */

async function removeStorageFiles(
  paths
){

  const cleanPaths =
    paths
      .filter(Boolean)
      .map(
        getStoragePath
      )
      .filter(Boolean);

  if(
    cleanPaths.length === 0
  ){

    return;

  }

  const {
    error
  } =
    await supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .remove(
        cleanPaths
      );

  if(error){

    console.warn(
      "Storage 删除失败：",
      error
    );

  }

}


/* ==================================================
   保存女士
================================================== */

womanForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const saveButton =
      document.getElementById(
        "saveButton"
      );

    saveButton.disabled =
      true;

    saveButton.textContent =
      "正在保存……";


    let uploadedFiles = [];


    try{

      /* ----------------------
         基础资料
      ---------------------- */

      const name =
        document
          .getElementById("womanName")
          .value
          .trim();

      const age =
        Number(
          document
            .getElementById("womanAge")
            .value
        );

      const city =
        document
          .getElementById("womanCity")
          .value
          .trim();

      const occupation =
        document
          .getElementById(
            "womanOccupation"
          )
          .value
          .trim();

      const description =
        document
          .getElementById(
            "womanDescription"
          )
          .value
          .trim();

      const whatsapp =
        document
          .getElementById(
            "womanWhatsapp"
          )
          .value
          .trim();

      const telegram =
        document
          .getElementById(
            "womanTelegram"
          )
          .value
          .trim();

      const isPublished =
        document
          .getElementById(
            "womanPublished"
          )
          .value ===
          "true";


      if(!name){

        throw new Error(
          "请输入姓名"
        );

      }

      if(
        !age ||
        age < 18 ||
        age > 100
      ){

        throw new Error(
          "年龄必须在 18–100 岁之间"
        );

      }


      /* ----------------------
         上传照片
      ---------------------- */

      const newPhotos =
        await uploadPhotos();

      uploadedFiles =
        uploadedFiles.concat(
          newPhotos
        );


      /* ----------------------
         上传视频
      ---------------------- */

      const newVideos =
        await uploadVideos();

      uploadedFiles =
        uploadedFiles.concat(
          newVideos
        );


      /* ----------------------
         最终媒体
      ---------------------- */

      const finalPhotos =
        [
          ...currentPhotos,
          ...newPhotos
        ];

      const finalVideos =
        [
          ...currentVideos,
          ...newVideos
        ];


      /*
        第一张图片同时保存到
        image_url，兼容主页。
      */

      const firstPhoto =
        finalPhotos.length > 0
        ?
        finalPhotos[0]
        :
        "";


      const record = {

        name,

        age,

        city,

        occupation,

        description,

        image_url:
          firstPhoto,

        whatsapp,

        telegram,

        is_published:
          isPublished,

        photos:
          finalPhotos,

        videos:
          finalVideos

      };


      /* =====================
         新增
      ===================== */

      if(!editingWoman){

        const {
          error
        } =
          await supabaseClient
            .from("women")
            .insert(
              record
            );

        if(error){

          throw error;

        }

        showMessage(
          "女士资料添加成功。",
          "success"
        );

      }


      /* =====================
         修改
      ===================== */

      else{

        const {
          error
        } =
          await supabaseClient
            .from("women")
            .update(
              record
            )
            .eq(
              "id",
              editingWoman.id
            );

        if(error){

          throw error;

        }

        showMessage(
          "女士资料修改成功。",
          "success"
        );

      }


      closeModal();

      await loadWomen();


      pendingPhotos =
        [];

      pendingVideos =
        [];


    }catch(error){

      console.error(
        error
      );


      /*
        如果数据库保存失败，
        尝试删除本次刚刚上传的文件，
        防止产生孤儿文件。
      */

      if(
        uploadedFiles.length > 0
      ){

        await removeStorageFiles(
          uploadedFiles
        );

      }


      showMessage(
        "保存失败：" +
        (
          error.message ||
          "未知错误"
        ),
        "error"
      );

    }finally{

      saveButton.disabled =
        false;

      saveButton.textContent =
        "保存资料";

    }

  }
);


/* ==================================================
   删除女士
================================================== */

async function deleteWoman(
  woman
){

  const confirmed =
    confirm(
      "确定要删除「" +
      (
        woman.name ||
        "这位女士"
      ) +
      "」吗？\n\n数据库资料和相关照片/视频都会删除。"
    );

  if(!confirmed){
    return;
  }


  try{

    /*
      收集所有媒体
    */

    const mediaPaths = [

      woman.image_url,

      ...normalizeArray(
        woman.photos
      ),

      ...normalizeArray(
        woman.videos
      )

    ];


    /*
      删除数据库
    */

    const {
      error
    } =
      await supabaseClient
        .from("women")
        .delete()
        .eq(
          "id",
          woman.id
        );

    if(error){
      throw error;
    }


    /*
      删除 Storage
    */

    await removeStorageFiles(
      mediaPaths
    );


    showMessage(
      "删除成功。",
      "success"
    );


    await loadWomen();


  }catch(error){

    console.error(
      error
    );

    showMessage(
      "删除失败：" +
      (
        error.message ||
        "未知错误"
      ),
      "error"
    );

  }

}

================================================== */

supabaseClient

    (event,session) => {

      if(
        session?.user

        /*

        if(
          adminPage.classList.contains(

        ){

        }

      }else if(
        event === "SIGNED_OUT"
      ){

        currentUser =
          null;

        showLogin();

      }

    }
  );


/* ==================================================
   启动
================================================== */

checkSession();

</script>
