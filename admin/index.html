<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>后台管理</title><link rel="stylesheet" href="../css/style.css"><style>.admin{max-width:1100px;margin:auto;padding:35px 20px}.panel{background:#fff;border:1px solid var(--line);padding:24px;margin-bottom:20px;border-radius:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px}.btn{border:0;border-radius:7px;padding:11px 16px;background:#272321;color:#fff;cursor:pointer}.btn.secondary{background:#eee;color:#272321}.btn.danger{background:#9b3d46}.login{max-width:420px;margin:80px auto}.field{margin:14px 0}.field label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}input,textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:11px;font:inherit}textarea{min-height:100px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:14px}.mini{width:55px;height:70px;object-fit:cover}.actions{display:flex;gap:7px;flex-wrap:wrap}</style></head><body><header class="site-header"><a class="brand" href="../index.html">缘分<span>·</span>相遇</a><button id="logout" class="btn secondary" style="display:none">退出</button></header><main class="admin"><section id="loginBox" class="panel login"><h1>管理员登录</h1><div class="field"><label>邮箱</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" class="btn">登录后台</button><p id="loginMsg" class="muted"></p></section><section id="app" style="display:none"><div class="panel row"><div><h1 style="margin:0">女士资料</h1><p class="muted">添加、编辑、上下架资料</p></div><button id="addBtn" class="btn">＋ 添加女士</button></div><div class="panel"><div style="overflow:auto"><table class="table"><thead><tr><th>照片</th><th>姓名</th><th>年龄</th><th>城市</th><th>状态</th><th>操作</th></tr></thead><tbody id="list"></tbody></table></div></div><section id="editor" class="panel" style="display:none"><h2 id="editorTitle">添加女士</h2><form id="form"><input id="id" type="hidden"><div class="field"><label>姓名 *</label><input id="name" required></div><div class="field"><label>年龄 *</label><input id="age" type="number" min="18" max="100" required></div><div class="field"><label>城市</label><input id="city"></div><div class="field"><label>职业</label><input id="occupation"></div><div class="field"><label>身高（cm）</label><input id="height_cm" type="number"></div><div class="field"><label>婚姻状态</label><input id="marital_status" placeholder="单身 / 离异 / 丧偶"></div><div class="field"><label>一句话介绍</label><input id="short_intro"></div><div class="field"><label>详细介绍</label><textarea id="bio"></textarea></div><div class="field"><label>兴趣爱好</label><textarea id="hobbies"></textarea></div><div class="field"><label>WhatsApp 国际号码（只填数字）*</label><input id="whatsapp" placeholder="例如 521XXXXXXXXXX" required></div><div class="field"><label>上传照片（可多选）</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><p class="muted">建议每张不超过 5MB。</p><div id="preview" class="thumbs"></div></div><div class="field"><label><input id="is_published" type="checkbox" checked style="width:auto"> 发布到首页</label></div><div class="actions"><button class="btn" type="submit">保存</button><button class="btn secondary" type="button" id="cancel">取消</button></div><p id="formMsg" class="muted"></p></form></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="admin.js"></script></body></html>
