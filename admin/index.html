.header {

/* =========================

.container {

/* =========================

.top {

/* =========================

/* =========================

.cancel {

<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
  "https://yutraouosffjteivvlfx.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   状态
===================================================== */

let people = [];

let editingId = null;

let selectedPhotos = [];

let selectedVideos = [];

let existingPhotos = [];

let existingVideos = [];


/* =====================================================
   页面启动
===================================================== */

async function init() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (session) {

    showAdmin(
      session
    );

  }

  else {

    showLogin();

  }


  supabaseClient
    .auth
    .onAuthStateChange(
      (
        event,
        session
      ) => {

        if (session) {

          showAdmin(
            session
          );

        }

        else {

          showLogin();

        }

      }
    );

}


/* =====================================================
   登录页面
===================================================== */

function showLogin() {

  document
    .getElementById(
      "loginPage"
    )
    .style
    .display =
    "flex";


  document
    .getElementById(
      "adminPage"
    )
    .style
    .display =
    "none";

}


/* =====================================================
   后台
===================================================== */

async function showAdmin(
  session
) {

  document
    .getElementById(
      "loginPage"
    )
    .style
    .display =
    "none";


  document
    .getElementById(
      "adminPage"
    )
    .style
    .display =
    "block";


  document
    .getElementById(
      "userEmail"
    )
    .textContent =
    session.user.email || "";


  await loadPeople();

}


/* =====================================================
   登录
===================================================== */

async function login() {

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  const errorBox =
    document
      .getElementById(
        "loginError"
      );


  const button =
    document
      .getElementById(
        "loginButton"
      );


  errorBox.style.display =
    "none";


  if (!email) {

    errorBox.textContent =
      "请输入管理员邮箱";

    errorBox.style.display =
      "block";

    return;

  }


  if (!password) {

    errorBox.textContent =
      "请输入密码";

    errorBox.style.display =
      "block";

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "登录中……";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({

          email,

          password

        });


    if (error) {

      throw error;

    }


    if (!data.session) {

      throw new Error(
        "登录失败，请检查邮箱和密码。"
      );

    }

  }

  catch(error) {

    console.error(
      error
    );


    errorBox.textContent =
      "登录失败：\n" +
      error.message;


    errorBox.style.display =
      "block";

  }


  finally {

    button.disabled =
      false;


    button.textContent =
      "登录后台";

  }

}


/* =====================================================
   退出
===================================================== */

async function logout() {

  await supabaseClient
    .auth
    .signOut();

}


/* =====================================================
   数据请求
===================================================== */

async function supabaseRequest(
  endpoint,
  options = {}
) {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) {

    throw new Error(
      "登录已失效，请重新登录。"
    );

  }


  const response =
    await fetch(

      SUPABASE_URL +
      endpoint,

      {

        ...options,

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      text ||
      `HTTP ${response.status}`
    );

  }


  if (!text) {

    return null;

  }


  return JSON.parse(
    text
  );

}


/* =====================================================
   Storage 上传
===================================================== */

async function uploadFile(
  bucket,
  file
) {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (!session) {

    throw new Error(
      "登录已失效。"
    );

  }


  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  const filename =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8) +
    "_" +
    safeName;


  const response =
    await fetch(

      SUPABASE_URL +
      "/storage/v1/object/" +
      bucket +
      "/" +
      filename,

      {

        method: "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            session.access_token,

          "x-upsert":
            "false"

        },

        body: file

      }

    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "文件上传失败：\n" +
      text
    );

  }


  return (

    SUPABASE_URL +
    "/storage/v1/object/public/" +
    bucket +
    "/" +
    filename

  );

}


/* =====================================================
   Notice
===================================================== */

function showNotice(
  message,
  type
) {

  const box =
    document.getElementById(
      "notice"
    );


  box.textContent =
    message;


  box.className =
    "notice " +
    type;

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   加载资料
===================================================== */

async function loadPeople() {

  const list =
    document.getElementById(
      "list"
    );


  list.innerHTML = `

    <div class="loading">

      正在加载女士资料……

    </div>

  `;


  try {

    people =
      await supabaseRequest(

        "/rest/v1/women" +
        "?select=*" +
        "&order=created_at.desc"

      );


    renderList();

  }

  catch(error) {

    console.error(
      error
    );


    list.innerHTML = `

      <div class="loading">

        加载失败

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   列表
===================================================== */

function renderList() {

  const list =
    document.getElementById(
      "list"
    );


  if (
    !people ||
    people.length === 0
  ) {

    list.innerHTML = `

      <div class="loading">

        暂时没有女士资料。

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  people.forEach(
    person => {

      const photos =
        Array.isArray(
          person.photos
        )
        ? person.photos
        : [];


      let image =
        person.image_url ||
        photos[0] ||
        "";


      if (
        image &&
        !image.startsWith(
          "http"
        )
      ) {

        image =
          SUPABASE_URL +
          "/storage/v1/object/public/women-photos/" +
          encodeURIComponent(
            image
          );

      }


      const videos =
        Array.isArray(
          person.videos
        )
        ? person.videos
        : [];


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "person";


      card.innerHTML = `

        <div class="person-photo">

          ${
            image
            ? `

              <img
                src="${escapeHtml(image)}"
              >

            `
            : ""
          }

        </div>


        <div class="person-info">

          <h2>

            ${escapeHtml(
              person.name ||
              "未填写姓名"
            )}

            ${
              person.age
              ? " · " +
                person.age +
                "岁"
              : ""
            }

          </h2>


          <p>

            ${escapeHtml(
              person.city ||
              ""
            )}

            ${
              person.occupation
              ? " · " +
                escapeHtml(
                  person.occupation
                )
              : ""
            }

          </p>


          <p>

            照片：
            ${photos.length}

            张

            　 视频：
            ${videos.length}

            个

          </p>


          <span
            class="status ${
              person.is_published
              ? "on"
              : "off"
            }"
          >

            ${
              person.is_published
              ? "已发布"
              : "已下架"
            }

          </span>

        </div>


        <div class="actions">

          <button
            class="action"
            onclick="editPerson('${person.id}')"
          >

            编辑

          </button>


          <button
            class="action"
            onclick="togglePublish(
              '${person.id}',
              ${!person.is_published}
            )"
          >

            ${
              person.is_published
              ? "下架"
              : "发布"
            }

          </button>


          <button
            class="action delete"
            onclick="deletePerson('${person.id}')"
          >

            删除

          </button>

        </div>

      `;


      list.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   新增
===================================================== */

function openNew() {

  editingId =
    null;

  existingPhotos =
    [];

  existingVideos =
    [];

  selectedPhotos =
    [];

  selectedVideos =
    [];


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "新增女士";


  clearForm();


  document
    .getElementById(
      "formBox"
    )
    .classList
    .add(
      "active"
    );


  renderPreviews();

}


/* =====================================================
   编辑
===================================================== */

function editPerson(
  id
) {

  const person =
    people.find(
      p =>
        p.id === id
    );


  if (!person) {

    return;

  }


  editingId =
    id;


  existingPhotos =
    Array.isArray(
      person.photos
    )
    ? [...person.photos]
    : [];


  existingVideos =
    Array.isArray(
      person.videos
    )
    ? [...person.videos]
    : [];


  selectedPhotos =
    [];

  selectedVideos =
    [];


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "编辑女士";


  document
    .getElementById(
      "name"
    )
    .value =
    person.name ||
    "";


  document
    .getElementById(
      "age"
    )
    .value =
    person.age ||
    "";


  document
    .getElementById(
      "city"
    )
    .value =
    person.city ||
    "";


  document
    .getElementById(
      "occupation"
    )
    .value =
    person.occupation ||
    "";


  document
    .getElementById(
      "description"
    )
    .value =
    person.description ||
    "";


  document
    .getElementById(
      "whatsapp"
    )
    .value =
    person.whatsapp ||
    "";


  document
    .getElementById(
      "telegram"
    )
    .value =
    person.telegram ||
    "";


  document
    .getElementById(
      "isPublished"
    )
    .checked =
    !!person.is_published;


  document
    .getElementById(
      "formBox"
    )
    .classList
    .add(
      "active"
    );


  renderPreviews();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   清空
===================================================== */

function clearForm() {

  [
    "name",
    "age",
    "city",
    "occupation",
    "description",
    "whatsapp",
    "telegram"
  ]
  .forEach(
    id => {

      document
        .getElementById(
          id
        )
        .value = "";

    }
  );


  document
    .getElementById(
      "isPublished"
    )
    .checked =
    true;


  document
    .getElementById(
      "photoInput"
    )
    .value =
    "";


  document
    .getElementById(
      "videoInput"
    )
    .value =
    "";

}


/* =====================================================
   关闭
===================================================== */

function closeForm() {

  document
    .getElementById(
      "formBox"
    )
    .classList
    .remove(
      "active"
    );

}


/* =====================================================
   照片选择
===================================================== */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    function() {

      selectedPhotos =
        [
          ...selectedPhotos,
          ...Array.from(
            this.files
          )
        ];


      renderPreviews();


      this.value =
        "";

    }
  );


/* =====================================================
   视频选择
===================================================== */

document
  .getElementById(
    "videoInput"
  )
  .addEventListener(
    "change",
    function() {

      selectedVideos =
        [
          ...selectedVideos,
          ...Array.from(
            this.files
          )
        ];


      renderPreviews();


      this.value =
        "";

    }
  );


/* =====================================================
   预览
===================================================== */

function renderPreviews() {

  const photoBox =
    document.getElementById(
      "photoPreview"
    );


  const videoBox =
    document.getElementById(
      "videoPreview"
    );


  photoBox.innerHTML =
    "";


  videoBox.innerHTML =
    "";


  existingPhotos.forEach(
    (
      photo,
      index
    ) => {

      let url =
        photo;


      if (
        !url.startsWith(
          "http"
        )
      ) {

        url =
          SUPABASE_URL +
          "/storage/v1/object/public/women-photos/" +
          encodeURIComponent(
            photo
          );

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview";


      item.innerHTML = `

        <img
          src="${escapeHtml(url)}"
        >

        <button
          type="button"
        >
          ×
        </button>

      `;


      item
        .querySelector(
          "button"
        )
        .onclick =
        function() {

          existingPhotos
            .splice(
              index,
              1
            );


          renderPreviews();

        };


      photoBox.appendChild(
        item
      );

    }
  );


  selectedPhotos.forEach(
    (
      file,
      index
    ) => {

      const url =
        URL.createObjectURL(
          file
        );


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview";


      item.innerHTML = `

        <img
          src="${url}"
        >

        <button
          type="button"
        >
          ×
        </button>

      `;


      item
        .querySelector(
          "button"
        )
        .onclick =
        function() {

          selectedPhotos
            .splice(
              index,
              1
            );


          renderPreviews();

        };


      photoBox.appendChild(
        item
      );

    }
  );


  existingVideos.forEach(
    (
      video,
      index
    ) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview";


      item.innerHTML = `

        <video
          src="${escapeHtml(video)}"
          controls
        ></video>

        <button
          type="button"
        >
          ×
        </button>

      `;


      item
        .querySelector(
          "button"
        )
        .onclick =
        function() {

          existingVideos
            .splice(
              index,
              1
            );


          renderPreviews();

        };


      videoBox.appendChild(
        item
      );

    }
  );


  selectedVideos.forEach(
    (
      file,
      index
    ) => {

      const url =
        URL.createObjectURL(
          file
        );


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "preview";


      item.innerHTML = `

        <video
          src="${url}"
          controls
        ></video>

        <button
          type="button"
        >
          ×
        </button>

      `;


      item
        .querySelector(
          "button"
        )
        .onclick =
        function() {

          selectedVideos
            .splice(
              index,
              1
            );


          renderPreviews();

        };


      videoBox.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   保存
===================================================== */

async function savePerson() {

  const name =
    document
      .getElementById(
        "name"
      )
      .value
      .trim();


  const age =
    Number(
      document
        .getElementById(
          "age"
        )
        .value
    );


  const city =
    document
      .getElementById(
        "city"
      )
      .value
      .trim();


  const occupation =
    document
      .getElementById(
        "occupation"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "description"
      )
      .value
      .trim();


  const whatsapp =
    document
      .getElementById(
        "whatsapp"
      )
      .value
      .trim();


  const telegram =
    document
      .getElementById(
        "telegram"
      )
      .value
      .trim();


  const isPublished =
    document
      .getElementById(
        "isPublished"
      )
      .checked;


  if (!name) {

    alert(
      "请输入姓名"
    );

    return;

  }


  if (
    !age ||
    age < 18 ||
    age > 100
  ) {

    alert(
      "请输入正确年龄"
    );

    return;

  }


  try {

    showNotice(
      "正在保存，请稍候……",
      "success"
    );


    /* 上传照片 */

    for (
      const file of selectedPhotos
    ) {

      const url =
        await uploadFile(
          "women-photos",
          file
        );


      existingPhotos.push(
        url
      );

    }


    /* 上传视频 */

    for (
      const file of selectedVideos
    ) {

      const url =
        await uploadFile(
          "women-videos",
          file
        );


      existingVideos.push(
        url
      );

    }


    const imageUrl =
      existingPhotos[0] ||
      "";


    const data = {

      name,

      age,

      city,

      occupation,

      description,

      image_url:
        imageUrl,

      whatsapp,

      telegram,

      photos:
        existingPhotos,

      videos:
        existingVideos,

      is_published:
        isPublished

    };


    if (!editingId) {

      await supabaseRequest(
        "/rest/v1/women",
        {

          method:
            "POST",

          headers: {

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              data
            )

        }
      );

    }

    else {

      await supabaseRequest(

        "/rest/v1/women" +
        "?id=eq." +
        encodeURIComponent(
          editingId
        ),

        {

          method:
            "PATCH",

          headers: {

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              data
            )

        }

      );

    }


    showNotice(
      "保存成功！",
      "success"
    );


    closeForm();


    await loadPeople();

  }

  catch(error) {

    console.error(
      error
    );


    showNotice(
      "保存失败：\n" +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   发布 / 下架
===================================================== */

async function togglePublish(
  id,
  value
) {

  try {

    await supabaseRequest(

      "/rest/v1/women" +
      "?id=eq." +
      encodeURIComponent(
        id
      ),

      {

        method:
          "PATCH",

        headers: {

          "Prefer":
            "return=minimal"

        },

        body:
          JSON.stringify({

            is_published:
              value

          })

      }

    );


    await loadPeople();

  }

  catch(error) {

    alert(
      "操作失败：\n" +
      error.message
    );

  }

}


/* =====================================================
   删除
===================================================== */

async function deletePerson(
  id
) {

  const person =
    people.find(
      p =>
        p.id === id
    );


  if (!person) {

    return;

  }


  if (
    !confirm(
      "确定删除 " +
      (
        person.name ||
        "这位女士"
      ) +
      " 吗？"
    )
  ) {

    return;

  }


  try {

    await supabaseRequest(

      "/rest/v1/women" +
      "?id=eq." +
      encodeURIComponent(
        id
      ),

      {

        method:
          "DELETE"

      }

    );


    await loadPeople();


    showNotice(
      "删除成功。",
      "success"
    );

  }

  catch(error) {

    alert(
      "删除失败：\n" +
      error.message
    );

  }

}


/* =====================================================
   启动
===================================================== */

init();

</script>
