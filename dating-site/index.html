<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>缘分 · 相遇</title>

  <meta name="description" content="寻找适合你的缘分">

  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="site-header">

  <a class="brand" href="index.html">
    缘分<span>·</span>相遇
  </a>

  <a class="admin-link" href="admin/">
    管理
  </a>

</header>


<main>

  <!-- 首屏 -->
  <section class="hero">

    <div>

      <p class="eyebrow">
        MEET SOMEONE SPECIAL
      </p>

      <h1>
        认真认识一个人，<br>
        从一次相遇开始。
      </h1>

      <p>
        浏览真实资料，了解彼此，再决定是否联系。
      </p>

    </div>

  </section>


  <!-- 筛选 -->
  <section class="toolbar">

    <div>

      <strong>女士资料</strong>

      <span id="count">
        加载中…
      </span>

    </div>


    <div class="filters">

      <select id="cityFilter">

        <option value="">
          全部城市
        </option>

      </select>


      <select id="ageFilter">

        <option value="">
          全部年龄
        </option>

        <option value="18-25">
          18–25
        </option>

        <option value="26-35">
          26–35
        </option>

        <option value="36-45">
          36–45
        </option>

        <option value="46+">
          46+
        </option>

      </select>

    </div>

  </section>


  <!-- 女士资料 -->
  <section
    id="womenGrid"
    class="women-grid"
  >

    <div class="loading">
      正在加载资料…
    </div>

  </section>

</main>


<footer>

  © <span id="year"></span> 缘分·相遇

</footer>


<script>

/* =====================================================
   Supabase 配置
   ===================================================== */

const SUPABASE_URL = "你的 Project URL";

const SUPABASE_KEY = "你的 Publishable / anon key";


/* 创建 Supabase 客户端 */

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   页面基础设置
   ===================================================== */

document.getElementById("year").textContent =
  new Date().getFullYear();


/* =====================================================
   数据
   ===================================================== */

let women = [];


/* =====================================================
   获取女士资料
   ===================================================== */

async function loadWomen() {

  const grid = document.getElementById("womenGrid");

  const count = document.getElementById("count");


  try {

    const { data, error } = await supabaseClient

      .from("women")

      .select("*")

      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error("Supabase错误：", error);

      grid.innerHTML = `
        <div class="loading">
          暂时无法加载资料
          <br><br>
          <small>
            ${error.message}
          </small>
        </div>
      `;

      count.textContent = "加载失败";

      return;

    }


    women = data || [];


    count.textContent =
      `共 ${women.length} 位`;


    createCityFilter();

    renderWomen(women);

  }

  catch (error) {

    console.error(error);

    grid.innerHTML = `
      <div class="loading">
        暂时无法加载资料，请稍后再试。
      </div>
    `;

    count.textContent = "加载失败";

  }

}


/* =====================================================
   城市筛选
   ===================================================== */

function createCityFilter() {

  const cityFilter =
    document.getElementById("cityFilter");


  const cities = [

    ...new Set(

      women

        .map(woman => woman.city)

        .filter(city => city)

    )

  ];


  cityFilter.innerHTML = `
    <option value="">
      全部城市
    </option>
  `;


  cities.forEach(city => {

    const option =
      document.createElement("option");

    option.value = city;

    option.textContent = city;

    cityFilter.appendChild(option);

  });

}


/* =====================================================
   显示女士资料
   ===================================================== */

function renderWomen(list) {

  const grid =
    document.getElementById("womenGrid");


  if (!list.length) {

    grid.innerHTML = `
      <div class="loading">
        暂时没有符合条件的资料。
      </div>
    `;

    return;

  }


  grid.innerHTML = "";


  list.forEach(woman => {

    const card =
      document.createElement("article");


    card.className =
      "woman-card";


    const image =
      woman.image_url ||
      "https://via.placeholder.com/600x800?text=Photo";


    card.innerHTML = `

      <div class="woman-image">

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(woman.name || "女士")}"
          loading="lazy"
        >

      </div>


      <div class="woman-info">

        <h2>
          ${escapeHtml(woman.name || "未填写")}
          ${woman.age ? `，${woman.age}岁` : ""}
        </h2>


        ${
          woman.city
            ? `<p class="city">${escapeHtml(woman.city)}</p>`
            : ""
        }


        ${
          woman.occupation
            ? `<p>${escapeHtml(woman.occupation)}</p>`
            : ""
        }


        ${
          woman.description
            ? `<p class="description">
                ${escapeHtml(
                  woman.description.substring(0, 80)
                )}
              </p>`
            : ""
        }


        <button
          class="contact-btn"
          onclick="contactWhatsApp('${encodeURIComponent(woman.whatsapp || "")}')"
        >
          联系她
        </button>

      </div>

    `;


    grid.appendChild(card);

  });

}


/* =====================================================
   年龄 + 城市筛选
   ===================================================== */

function filterWomen() {

  const city =
    document.getElementById("cityFilter").value;


  const age =
    document.getElementById("ageFilter").value;


  let filtered =
    [...women];


  /* 城市 */

  if (city) {

    filtered =
      filtered.filter(
        woman => woman.city === city
      );

  }


  /* 年龄 */

  if (age) {

    filtered =
      filtered.filter(woman => {

        const womanAge =
          Number(woman.age);


        if (isNaN(womanAge)) {
          return false;
        }


        if (age === "18-25") {
          return womanAge >= 18 && womanAge <= 25;
        }


        if (age === "26-35") {
          return womanAge >= 26 && womanAge <= 35;
        }


        if (age === "36-45") {
          return womanAge >= 36 && womanAge <= 45;
        }


        if (age === "46+") {
          return womanAge >= 46;
        }


        return true;

      });

  }


  renderWomen(filtered);

}


/* =====================================================
   WhatsApp
   ===================================================== */

function contactWhatsApp(phone) {

  if (!phone) {

    alert("暂时没有提供联系方式。");

    return;

  }


  const cleanPhone =
    decodeURIComponent(phone)
      .replace(/[^\d+]/g, "");


  if (!cleanPhone) {

    alert("联系方式格式不正确。");

    return;

  }


  const url =
    `https://wa.me/${cleanPhone.replace("+", "")}`;


  window.location.href = url;

}


/* =====================================================
   防止 HTML 注入
   ===================================================== */

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =====================================================
   筛选事件
   ===================================================== */

document
  .getElementById("cityFilter")
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById("ageFilter")
  .addEventListener(
    "change",
    filterWomen
  );


/* =====================================================
   启动
   ===================================================== */

loadWomen();

</script>


</body>
</html>
