<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分 · 相遇</title>

<meta
  name="description"
  content="寻找适合你的缘分"
>

<style>

/* ==================================================
   基础
================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background:#faf9f7;

  color:#2b2927;

  line-height:1.6;
}

body.modal-open{
  overflow:hidden;
}

button,
select,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

.hidden{
  display:none !important;
}


/* ==================================================
   Header
================================================== */

.site-header{

  height:72px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 6%;

  background:rgba(255,255,255,.97);

  border-bottom:1px solid #eee;

  position:sticky;

  top:0;

  z-index:100;
}

.brand{

  font-size:22px;

  font-weight:700;

  letter-spacing:1px;
}

.brand span{

  color:#b58b63;

  margin:0 3px;
}

.admin-link{

  padding:8px 16px;

  border:1px solid #ddd;

  border-radius:20px;

  font-size:14px;

  color:#666;

  transition:.2s;
}

.admin-link:hover{

  background:#2b2927;

  color:#fff;
}


/* ==================================================
   Hero
================================================== */

.hero{

  min-height:420px;

  display:flex;

  align-items:center;

  padding:70px 8%;

  background:
    linear-gradient(
      90deg,
      #faf9f7 0%,
      rgba(250,249,247,.94) 55%,
      rgba(250,249,247,.65) 100%
    );
}

.hero > div{

  max-width:700px;
}

.eyebrow{

  font-size:13px;

  letter-spacing:4px;

  color:#b58b63;

  margin-bottom:18px;

  font-weight:600;
}

.hero h1{

  font-size:
    clamp(
      38px,
      6vw,
      70px
    );

  line-height:1.2;

  font-weight:600;

  letter-spacing:1px;

  margin-bottom:24px;
}

.hero p:not(.eyebrow){

  color:#777;

  font-size:17px;

  max-width:520px;
}


/* ==================================================
   Toolbar
================================================== */

.toolbar{

  width:88%;

  max-width:1400px;

  margin:40px auto 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  flex-wrap:wrap;
}

.toolbar strong{

  font-size:22px;

  margin-right:12px;
}

#count{

  color:#999;

  font-size:14px;
}

.filters{

  display:flex;

  gap:10px;
}

.filters select{

  appearance:none;

  border:1px solid #ddd;

  background:#fff;

  padding:
    11px
    36px
    11px
    14px;

  border-radius:8px;

  color:#444;

  cursor:pointer;

  outline:none;
}

.filters select:focus{

  border-color:#b58b63;
}


/* ==================================================
   女士 Grid
================================================== */

.women-grid{

  width:88%;

  max-width:1400px;

  margin:0 auto 70px;

  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:24px;
}


/* ==================================================
   女士卡片
================================================== */

.woman-card{

  background:#fff;

  border-radius:14px;

  overflow:hidden;

  border:1px solid #eee;

  transition:
    transform .25s ease,
    box-shadow .25s ease;

  cursor:pointer;
}

.woman-card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.08);
}


/* ==================================================
   Media
================================================== */

.media-gallery{

  background:#eee;

  overflow:hidden;
}

.woman-image{

  width:100%;

  aspect-ratio:3 / 4;

  background:#eee;

  overflow:hidden;
}

.woman-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:
    transform .5s ease;
}

.woman-card:hover
.woman-image img{

  transform:scale(1.03);
}


/* ==================================================
   Card Info
================================================== */

.woman-info{

  padding:18px;
}

.woman-info h2{

  font-size:20px;

  font-weight:600;

  margin-bottom:5px;
}

.city{

  color:#b58b63;

  font-size:14px;

  margin-bottom:7px;
}

.woman-info > p:not(.city){

  color:#777;

  font-size:13px;

  margin-bottom:5px;
}

.description{

  margin-top:9px;

  line-height:1.7;

  display:
    -webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.media-count{

  margin-top:12px;

  color:#999;

  font-size:12px;
}

.view-profile{

  margin-top:14px;

  padding-top:12px;

  border-top:1px solid #eee;

  color:#b58b63;

  font-size:13px;

  font-weight:600;
}


/* ==================================================
   更多女士卡片
================================================== */

.more-women-card{

  position:relative;

  min-height:520px;

  border-radius:14px;

  overflow:hidden;

  background-image:

    linear-gradient(
      180deg,
      rgba(0,0,0,.05) 0%,
      rgba(0,0,0,.18) 35%,
      rgba(0,0,0,.78) 100%
    ),

    url("./images/more-women.jpg");

  background-size:cover;

  background-position:center;

  display:flex;

  align-items:flex-end;

  cursor:pointer;

  border:1px solid #eee;

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.more-women-card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.15);
}

.more-women-content{

  width:100%;

  padding:28px 22px;

  color:#fff;

  text-align:center;
}

.more-icon{

  width:58px;

  height:58px;

  margin:
    0 auto
    15px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    rgba(255,255,255,.18);

  border:
    1px solid
    rgba(255,255,255,.45);

  backdrop-filter:blur(5px);

  font-size:27px;
}

.more-women-content h2{

  font-size:24px;

  font-weight:600;

  margin-bottom:8px;

  text-shadow:
    0 2px 8px
    rgba(0,0,0,.35);
}

.more-women-content p{

  font-size:14px;

  line-height:1.7;

  margin-bottom:18px;

  color:
    rgba(255,255,255,.92);
}

.more-women-button{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-width:150px;

  padding:
    11px 22px;

  border-radius:30px;

  background:#fff;

  color:#2b2927;

  font-size:14px;

  font-weight:600;

  transition:.2s;
}

.more-women-button:hover{

  background:#b58b63;

  color:#fff;

  transform:translateY(-2px);
}


/* ==================================================
   Loading
================================================== */

.loading{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

  color:#888;
}

.loading h3{

  font-size:22px;

  color:#444;

  margin-bottom:10px;
}

.loading p{

  color:#999;

  font-size:14px;
}


/* ==================================================
   Footer
================================================== */

footer{

  text-align:center;

  padding:35px 20px;

  border-top:1px solid #eee;

  color:#aaa;

  font-size:13px;

  background:#fff;
}


/* ==================================================
   女士详情 Modal
================================================== */

.profile-modal{

  position:fixed;

  inset:0;

  z-index:800;

  background:
    rgba(0,0,0,.72);

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  backdrop-filter:blur(5px);
}

.profile-modal-box{

  width:100%;

  max-width:1050px;

  max-height:
    calc(100vh - 40px);

  background:#fff;

  border-radius:18px;

  overflow:hidden;

  position:relative;

  display:grid;

  grid-template-columns:
    minmax(0,1.1fr)
    minmax(320px,.9fr);
}

.profile-close{

  position:absolute;

  top:14px;

  right:14px;

  z-index:20;

  width:40px;

  height:40px;

  border:0;

  border-radius:50%;

  background:
    rgba(0,0,0,.55);

  color:#fff;

  font-size:25px;

  line-height:40px;
}

.profile-close:hover{

  background:#222;
}


/* ==================================================
   Slider
================================================== */

.profile-media{

  min-width:0;

  background:#111;

  position:relative;

  overflow:hidden;
}

.slider-viewport{

  width:100%;

  height:100%;

  min-height:650px;

  overflow:hidden;

  touch-action:pan-y;
}

.slider-track{

  height:100%;

  display:flex;

  transition:
    transform .35s ease;
}

.slider-slide{

  min-width:100%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#111;

  position:relative;
}

.slider-slide img{

  width:100%;

  height:100%;

  object-fit:contain;

  display:block;
}

.slider-slide video{

  width:100%;

  height:100%;

  object-fit:contain;

  background:#000;

  display:block;
}


/* ==================================================
   Slider Buttons
================================================== */

.slider-button{

  position:absolute;

  top:50%;

  transform:
    translateY(-50%);

  z-index:10;

  width:44px;

  height:44px;

  border:0;

  border-radius:50%;

  background:
    rgba(0,0,0,.45);

  color:#fff;

  font-size:27px;

  display:flex;

  align-items:center;

  justify-content:center;
}

.slider-button:hover{

  background:
    rgba(0,0,0,.75);
}

.slider-prev{

  left:15px;
}

.slider-next{

  right:15px;
}

.slider-counter{

  position:absolute;

  left:50%;

  bottom:15px;

  transform:
    translateX(-50%);

  z-index:10;

  background:
    rgba(0,0,0,.55);

  color:#fff;

  padding:
    5px 12px;

  border-radius:20px;

  font-size:12px;
}


/* ==================================================
   Profile Info
================================================== */

.profile-info{

  padding:38px;

  overflow-y:auto;

  background:#fff;
}

.profile-info h2{

  font-size:30px;

  line-height:1.3;

  margin-bottom:8px;
}

.profile-city{

  color:#b58b63;

  font-size:15px;

  margin-bottom:20px;
}

.profile-meta{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-bottom:25px;
}

.profile-meta-item{

  padding:13px;

  border-radius:9px;

  background:#f7f7f7;
}

.profile-meta-item span{

  display:block;

  color:#999;

  font-size:11px;

  margin-bottom:3px;
}

.profile-meta-item strong{

  font-size:14px;

  font-weight:600;
}

.profile-description-title{

  font-size:16px;

  font-weight:600;

  margin-bottom:8px;
}

.profile-description{

  color:#666;

  font-size:14px;

  line-height:1.9;

  white-space:pre-wrap;

  margin-bottom:25px;
}


/* ==================================================
   Profile Contact
================================================== */

.profile-contact-buttons{

  display:flex;

  flex-direction:column;

  gap:10px;

  padding-top:20px;

  border-top:1px solid #eee;
}

.profile-contact-btn{

  width:100%;

  border:0;

  border-radius:9px;

  padding:13px;

  font-size:14px;

  font-weight:600;

  transition:.2s;
}

.profile-whatsapp{

  background:#e8f7ed;

  color:#168a43;
}

.profile-whatsapp:hover{

  background:#168a43;

  color:#fff;
}

.profile-telegram{

  background:#e8f2fb;

  color:#2481c7;
}

.profile-telegram:hover{

  background:#2481c7;

  color:#fff;
}


/* ==================================================
   申请加入 Modal
================================================== */

.join-modal{

  position:fixed;

  inset:0;

  z-index:1000;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:blur(5px);
}

.join-modal-box{

  width:100%;

  max-width:430px;

  position:relative;

  background:#fff;

  border-radius:18px;

  padding:
    35px
    25px
    30px;

  text-align:center;

  box-shadow:
    0 25px 80px
    rgba(0,0,0,.25);

  animation:
    joinModalIn
    .25s ease;
}

@keyframes joinModalIn{

  from{

    opacity:0;

    transform:
      translateY(20px)
      scale(.96);
  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}

.join-close{

  position:absolute;

  top:12px;

  right:12px;

  width:34px;

  height:34px;

  border:0;

  border-radius:50%;

  background:#f1f1f1;

  color:#555;

  font-size:22px;

  cursor:pointer;

  line-height:34px;
}

.join-close:hover{

  background:#222;

  color:#fff;
}

.join-icon{

  width:58px;

  height:58px;

  margin:
    0 auto
    15px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#f5eee7;

  color:#b58b63;

  font-size:28px;
}

.join-modal-box h2{

  font-size:24px;

  margin-bottom:8px;
}

.join-modal-box > p{

  color:#888;

  font-size:14px;

  line-height:1.7;

  margin-bottom:25px;
}

.join-buttons{

  display:flex;

  flex-direction:column;

  gap:12px;
}

.join-contact-btn{

  width:100%;

  border:0;

  border-radius:10px;

  padding:
    13px 18px;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:space-between;

  transition:.2s;
}

.join-contact-btn span{

  font-size:15px;

  font-weight:600;
}

.join-contact-btn small{

  font-size:12px;

  opacity:.75;
}

.join-contact-btn.whatsapp{

  background:#e8f7ed;

  color:#168a43;
}

.join-contact-btn.whatsapp:hover{

  background:#168a43;

  color:#fff;

  transform:
    translateY(-2px);
}

.join-contact-btn.telegram{

  background:#e8f2fb;

  color:#2481c7;
}

.join-contact-btn.telegram:hover{

  background:#2481c7;

  color:#fff;

  transform:
    translateY(-2px);
}


/* ==================================================
   Tablet
================================================== */

@media(max-width:1000px){

  .women-grid{

    grid-template-columns:
      repeat(
        3,
        minmax(0,1fr)
      );
  }

  .profile-modal-box{

    grid-template-columns:
      1fr;

    max-height:
      calc(100vh - 20px);

    overflow-y:auto;
  }

  .slider-viewport{

    min-height:55vh;

    max-height:65vh;
  }

  .profile-info{

    max-height:none;

    padding:25px;
  }

}


/* ==================================================
   Mobile
================================================== */

@media(max-width:700px){

  .site-header{

    height:62px;

    padding:0 20px;
  }

  .brand{

    font-size:19px;
  }

  .admin-link{

    font-size:12px;

    padding:
      6px 12px;
  }

  .hero{

    min-height:360px;

    padding:
      55px 25px;
  }

  .hero h1{

    font-size:39px;
  }

  .hero p:not(.eyebrow){

    font-size:15px;
  }

  .toolbar{

    width:
      calc(100% - 40px);

    margin-top:30px;

    align-items:flex-start;
  }

  .toolbar strong{

    font-size:20px;
  }

  .filters{

    width:100%;
  }

  .filters select{

    flex:1;

    width:50%;
  }

  .women-grid{

    width:
      calc(100% - 30px);

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

    gap:12px;

    margin-bottom:50px;
  }

  .woman-info{

    padding:14px;
  }

  .woman-info h2{

    font-size:17px;
  }

  .woman-info > p{

    font-size:12px;
  }

  .description{

    font-size:12px !important;
  }

  .view-profile{

    font-size:12px;

    margin-top:10px;

    padding-top:9px;
  }

  .more-women-card{

    min-height:430px;
  }

  .more-women-content{

    padding:
      22px 16px;
  }

  .more-women-content h2{

    font-size:20px;
  }

  .profile-modal{

    padding:0;
  }

  .profile-modal-box{

    width:100%;

    height:100%;

    max-height:none;

    border-radius:0;

    display:flex;

    flex-direction:column;
  }

  .profile-media{

    flex:none;

    height:56vh;

    min-height:0;
  }

  .slider-viewport{

    height:100%;

    min-height:0;

    max-height:none;
  }

  .profile-info{

    flex:1;

    padding:22px;

    overflow-y:auto;
  }

  .profile-info h2{

    font-size:25px;
  }

  .profile-meta{

    grid-template-columns:
      repeat(2,1fr);
  }

  .profile-close{

    top:10px;

    right:10px;
  }

}


/* ==================================================
   Small Phone
================================================== */

@media(max-width:400px){

  .women-grid{

    grid-template-columns:1fr;
  }

  .woman-image{

    aspect-ratio:4 / 5;
  }

  .more-women-card{

    min-height:450px;
  }

}

</style>

</head>


<body>


<!-- ==================================================
     Header
================================================== -->

<header class="site-header">

  <a
    class="brand"
    href="./"
  >
    缘分<span>·</span>相遇
  </a>

  <a
    class="admin-link"
    href="admin/"
  >
    管理
  </a>

</header>


<!-- ==================================================
     Main
================================================== -->

<main>


<section class="hero">

  <div>

    <p class="eyebrow">
      MEET SOMEONE SPECIAL
    </p>

    <h1>
      认真认识一个人，<br>
      从一次相遇开始。
    </h1>

    <p>
      浏览真实资料，了解彼此，再决定是否联系。
    </p>

  </div>

</section>


<!-- ==================================================
     Toolbar
================================================== -->

<section class="toolbar">

  <div>

    <strong>
      女士资料
    </strong>

    <span id="count">
      加载中…
    </span>

  </div>


  <div class="filters">

    <select id="cityFilter">

      <option value="">
        全部城市
      </option>

    </select>


    <select id="ageFilter">

      <option value="">
        全部年龄
      </option>

      <option value="18-25">
        18–25
      </option>

      <option value="26-35">
        26–35
      </option>

      <option value="36-45">
        36–45
      </option>

      <option value="46+">
        46+
      </option>

    </select>

  </div>

</section>


<!-- ==================================================
     女士 Grid
================================================== -->

<section
  id="womenGrid"
  class="women-grid"
>

  <div class="loading">

    <h3>
      正在加载资料…
    </h3>

    <p>
      请稍候。
    </p>

  </div>

</section>


</main>


<!-- ==================================================
     Footer
================================================== -->

<footer>

  ©
  <span id="year"></span>
  缘分·相遇

</footer>


<!-- ==================================================
     女士详情 Modal
================================================== -->

<div
  id="profileModal"
  class="profile-modal hidden"
>

  <div class="profile-modal-box">

    <button
      id="profileClose"
      class="profile-close"
      type="button"
    >
      ×
    </button>


    <!-- =========================
         Media
    ========================== -->

    <div class="profile-media">

      <div
        id="sliderViewport"
        class="slider-viewport"
      >

        <div
          id="sliderTrack"
          class="slider-track"
        ></div>

      </div>


      <button
        id="sliderPrev"
        class="slider-button slider-prev"
        type="button"
      >
        ‹
      </button>


      <button
        id="sliderNext"
        class="slider-button slider-next"
        type="button"
      >
        ›
      </button>


      <div
        id="sliderCounter"
        class="slider-counter"
      >
        1 / 1
      </div>

    </div>


    <!-- =========================
         Info
    ========================== -->

    <div class="profile-info">

      <h2 id="profileName">
        -
      </h2>

      <div
        id="profileCity"
        class="profile-city"
      >
        -
      </div>


      <div class="profile-meta">

        <div class="profile-meta-item">

          <span>
            年龄
          </span>

          <strong id="profileAge">
            -
          </strong>

        </div>


        <div class="profile-meta-item">

          <span>
            职业
          </span>

          <strong id="profileOccupation">
            -
          </strong>

/* ==================================================
   HTML 安全处理
================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==================================================
   Supabase URL
================================================== */

function convertStorageUrl(path){

  if(!path){

    return "";

  }


  const value =
    String(path).trim();


  if(

    value.startsWith("http://") ||

    value.startsWith("https://") ||

    value.startsWith("data:")

  ){

    return value;

  }


  return (

    SUPABASE_URL +

    "/storage/v1/object/public/women-photos/" +

    value.replace(
      /^\/+/,
      ""
    )

  );

}


/* ==================================================
   Media 数组
================================================== */

function normalizeMedia(value){

  if(!value){

    return [];

  }


  if(Array.isArray(value)){

    return value

      .flat(Infinity)

      .filter(Boolean)

      .map(
        item =>
          String(item).trim()
      )

      .filter(Boolean);

  }


  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){

      return [];

    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed

          .flat(Infinity)

          .filter(Boolean)

          .map(
            item =>
              String(item).trim()
          )

          .filter(Boolean);

      }

    }catch(error){}


    if(
      text.includes(",")
    ){

      return text

        .split(",")

        .map(
          item =>
            item.trim()
        )

        .filter(Boolean);

    }


    return [text];

  }


  return [];

}


/* ==================================================
   获取照片
================================================== */

function getPhotos(woman){

  let photos = [];


  /*
    兼容旧的 image_url
  */

  if(
    woman.image_url
  ){

    photos.push(
      woman.image_url
    );

  }


  /*
    新 photos 字段
  */

  photos =
    photos.concat(
      normalizeMedia(
        woman.photos
      )
    );


  /*
    去重
  */

  photos =
    [
      ...new Set(
        photos
          .filter(Boolean)
          .map(
            convertStorageUrl
          )
      )
    ];


  return photos;

}


/* ==================================================
   获取视频
================================================== */

function getVideos(woman){

  return [

    ...new Set(

      normalizeMedia(
        woman.videos
      )

      .filter(Boolean)

      .map(
        convertStorageUrl
      )

    )

  ];

}

/* ==================================================
   Slider Position
================================================== */

function updateSlider(){

  const track =
    document.getElementById(
      "sliderTrack"
    );


  track.style.transform =
    "translateX(-" +
    (
      currentSlideIndex *
      100
    ) +
    "%)";


  const counter =
    document.getElementById(
      "sliderCounter"
    );


  counter.textContent =

    (
      currentSlideIndex + 1
    ) +

    " / " +

    currentSlides.length;


  const prev =
    document.getElementById(
      "sliderPrev"
    );


  const next =
    document.getElementById(
      "sliderNext"
    );


  if(
    currentSlides.length <= 1
  ){

    prev.style.display =
      "none";

    next.style.display =
      "none";

  }else{

    prev.style.display =
      "flex";

    next.style.display =
      "flex";

  }

}


/* ==================================================
   下一张
================================================== */

function nextSlide(){

  if(
    currentSlides.length <= 1
  ){

    return;

  }


  /*
    循环播放
  */

  currentSlideIndex =

    (
      currentSlideIndex + 1
    ) %

    currentSlides.length;


  pauseAllVideos();

  updateSlider();

}


/* ==================================================
   上一张
================================================== */

function previousSlide(){

  if(
    currentSlides.length <= 1
  ){

    return;

  }


  currentSlideIndex =

    (
      currentSlideIndex - 1 +
      currentSlides.length
    ) %

    currentSlides.length;


  pauseAllVideos();

  updateSlider();

}


/* ==================================================
   暂停视频
================================================== */

function pauseAllVideos(){

  document
    .querySelectorAll(
      "#sliderTrack video"
    )
    .forEach(
      video => {

        try{

          video.pause();

        }catch(error){}

      }
    );

}

   Slider Buttons
================================================== */

document

  )
  .addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      nextSlide();

    }
  );


document

    "click",
    function(event){

      event.stopPropagation();

      previousSlide();

    }
  );


/* ==================================================
   Touch Swipe
================================================== */

const sliderViewport =
  document.getElementById(
    "sliderViewport"
  );


sliderViewport.addEventListener(
  "touchstart",
  function(event){

    if(
      !event.touches ||
      !event.touches.length
    ){

      return;

    }


    touchStartX =
      event.touches[0].clientX;

  },
  {
    passive:true
  }
);


sliderViewport.addEventListener(
  "touchend",
  function(event){

    if(
      !event.changedTouches ||
      !event.changedTouches.length
    ){

      return;

    }


    touchEndX =
      event.changedTouches[0].clientX;


    const distance =
      touchEndX -
      touchStartX;


    /*
      至少滑动 50px
    */

    if(
      Math.abs(distance) <
      50
    ){

      return;

    }


    if(
      distance < 0
    ){

      nextSlide();

    }else{

      previousSlide();

    }

  },
  {
    passive:true
  }
);

/* ==================================================
   WhatsApp
================================================== */

function openWhatsApp(phone){

  let number =
    String(
      phone || ""
    )

    .trim()

    .replace(
      /[^\d]/g,
      ""
    );


  if(!number){

    alert(
      "WhatsApp 联系方式无效"
    );

    return;

  }


  window.location.href =
    "https://wa.me/" +
    number;

}


/* ==================================================
   Telegram
================================================== */

function openTelegram(username){

  let value =
    String(
      username || ""
    )

    .trim();


  if(!value){

    alert(
      "Telegram 联系方式无效"
    );

    return;

  }


  if(

    value.startsWith(
      "https://t.me/"
    ) ||

    value.startsWith(
      "http://t.me/"
    )

  ){

    window.location.href =
      value;

    return;

  }


  value =
    value.replace(
      /^@/,
      ""
    );


  if(!value){

    alert(
      "Telegram 联系方式无效"
    );

    return;

  }


  window.location.href =
    "https://t.me/" +
    value;

}

  const telegramButton =
    document.getElementById(
      "joinTelegram"
    );


  /*
    WhatsApp
  */

  if(
    joinContact.whatsapp
  ){

    whatsappButton.style.display =
      "flex";

  }else{

    whatsappButton.style.display =
      "none";

  }


  /*
    Telegram
  */

  if(
    joinContact.telegram
  ){

    telegramButton.style.display =
      "flex";

  }else{

    telegramButton.style.display =
      "none";

  }


  /*
    都没有
  */

  if(

    !joinContact.whatsapp &&
    !joinContact.telegram

  ){

    alert(
      "目前暂未设置申请加入联系方式。"
    );

    return;

  }


  modal.classList.remove(
    "hidden"
  );


  document.body.classList.add(
    "modal-open"
  );

}


/* ==================================================
   关闭申请加入
================================================== */

function closeJoinModal(){

  document
    .getElementById(
      "joinModal"
    )
    .classList.add(
      "hidden"
    );


  document.body.classList.remove(
    "modal-open"
  );

}


document
  .getElementById(
    "closeJoinModal"
  )
  .addEventListener(
    "click",
    closeJoinModal
  );


document
  .getElementById(
    "joinModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        closeJoinModal();

      }

    }
  );


/* ==================================================
   WhatsApp - 申请加入
================================================== */

document
  .getElementById(
    "joinWhatsapp"
  )
  .addEventListener(
    "click",
    function(){

      openWhatsApp(
        joinContact.whatsapp
      );

    }
  );


/* ==================================================
   Telegram - 申请加入
================================================== */

document
  .getElementById(
    "joinTelegram"
  )
  .addEventListener(
    "click",
    function(){

      openTelegram(
        joinContact.telegram
      );

    }
  );


/* ==================================================
   ESC
================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key !== "Escape"
    ){

      return;

    }


    const profile =
      document.getElementById(
        "profileModal"
      );


    const join =
      document.getElementById(
        "joinModal"
      );


    if(
      !profile.classList.contains(
        "hidden"
      )
    ){

      closeProfile();

      return;

    }


    if(
      !join.classList.contains(
        "hidden"
      )
    ){

      closeJoinModal();

    }

  }
);


/* ==================================================
   城市筛选
================================================== */

document
  .getElementById(
    "cityFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


/* ==================================================
   年龄筛选
================================================== */

document
  .getElementById(
    "ageFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


/* ==================================================
   Filter
================================================== */

function filterWomen(){

  const city =
    document.getElementById(
      "cityFilter"
    ).value;


  const age =
    document.getElementById(
      "ageFilter"
    ).value;


  const filtered =
    women.filter(
      woman => {

        /*
          城市
        */

        if(

          city &&
          woman.city !== city

        ){

          return false;

        }


        /*
          年龄
        */

        const womanAge =
          Number(
            woman.age
          );


        if(
          age ===
          "18-25"
        ){

          return (

            womanAge >= 18 &&
            womanAge <= 25

          );

        }


        if(
          age ===
          "26-35"
        ){

          return (

            womanAge >= 26 &&
            womanAge <= 35

          );

        }


        if(
          age ===
          "36-45"
        ){

          return (

            womanAge >= 36 &&
            womanAge <= 45

          );

        }


        if(
          age ===
          "46+"
        ){

          return (
            womanAge >= 46
          );

        }


        return true;

      }
    );


  /*
    数量也跟着筛选改变
  */

  document
    .getElementById(
      "count"
    )
    .textContent =

    `共 ${filtered.length} 位`;


  renderWomen(
    filtered
  );

}


/* ==================================================
   启动
================================================== */

async function init(){

  /*
    两个同时加载
  */

  await Promise.all([

    loadWomen(),

    loadJoinContact()

  ]);

}


init();

</script>
