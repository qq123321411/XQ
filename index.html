<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分 · 相遇</title>

<meta
  name="description"
  content="寻找适合你的缘分"
>

<style>

/* =========================================================
   基础
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background:#faf9f7;

  color:#2b2927;

  line-height:1.6;

  -webkit-font-smoothing:antialiased;
}

button,
select{

  font-family:inherit;

}

button{

  cursor:pointer;

}

a{

  text-decoration:none;

  color:inherit;

}


/* =========================================================
   Header
========================================================= */

.site-header{

  height:72px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 6%;

  background:rgba(255,255,255,.97);

  border-bottom:1px solid #eee;

  position:sticky;

  top:0;

  z-index:100;

  backdrop-filter:blur(10px);

}

.brand{

  font-size:22px;

  font-weight:700;

  letter-spacing:1px;

}

.brand span{

  color:#b58b63;

  margin:0 3px;

}

.admin-link{

  padding:8px 16px;

  border:1px solid #ddd;

  border-radius:20px;

  font-size:14px;

  color:#666;

  transition:.2s;

}

.admin-link:hover{

  background:#2b2927;

  color:#fff;

}


/* =========================================================
   Hero
========================================================= */

.hero{

  min-height:430px;

  display:flex;

  align-items:center;

  padding:70px 8%;

  background:

    linear-gradient(
      90deg,
      #faf9f7 0%,
      rgba(250,249,247,.95) 55%,
      rgba(250,249,247,.75) 100%
    );

}

.hero-content{

  max-width:700px;

}

.eyebrow{

  font-size:13px;

  letter-spacing:4px;

  color:#b58b63;

  margin-bottom:18px;

  font-weight:600;

}

.hero h1{

  font-size:
    clamp(
      38px,
      6vw,
      70px
    );

  line-height:1.2;

  font-weight:600;

  letter-spacing:1px;

  margin-bottom:24px;

}

.hero-description{

  color:#777;

  font-size:17px;

  max-width:520px;

}


/* =========================================================
   Toolbar
========================================================= */

.toolbar{

  width:88%;

  max-width:1400px;

  margin:40px auto 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  flex-wrap:wrap;

}

.toolbar-title{

  display:flex;

  align-items:center;

  gap:12px;

}

.toolbar strong{

  font-size:22px;

}

#count{

  color:#999;

  font-size:14px;

}

.filters{

  display:flex;

  gap:10px;

}

.filters select{

  appearance:none;

  border:1px solid #ddd;

  background:#fff;

  padding:11px 36px 11px 14px;

  border-radius:8px;

  color:#444;

  cursor:pointer;

  outline:none;

}

.filters select:focus{

  border-color:#b58b63;

}


/* =========================================================
   Grid
========================================================= */

.women-grid{

  width:88%;

  max-width:1400px;

  margin:0 auto 70px;

  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:24px;

}


/* =========================================================
   Card
========================================================= */

.woman-card{

  background:#fff;

  border-radius:14px;

  overflow:hidden;

  border:1px solid #eee;

  transition:

    transform .25s ease,

    box-shadow .25s ease;

}

.woman-card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 15px 40px rgba(0,0,0,.08);

}


/* =========================================================
   Media
========================================================= */

.media-gallery{

  background:#eee;

}

.woman-image{

  width:100%;

  aspect-ratio:3 / 4;

  background:#eee;

  overflow:hidden;

}

.woman-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:
    transform .5s ease;

}

.woman-card:hover
.woman-image img{

  transform:scale(1.03);

}


/* =========================================================
   多张照片
========================================================= */

.photo-list{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:3px;

  margin-top:3px;

}

.photo-list img{

  width:100%;

  aspect-ratio:1 / 1;

  object-fit:cover;

  display:block;

  background:#eee;

}


/* =========================================================
   视频
========================================================= */

.video-list{

  display:grid;

  grid-template-columns:1fr;

  gap:5px;

  margin-top:5px;

}

.video-list video{

  width:100%;

  display:block;

  background:#000;

  max-height:500px;

}


/* =========================================================
   信息
========================================================= */

.woman-info{

  padding:20px;

}

.woman-info h2{

  font-size:21px;

  font-weight:600;

  margin-bottom:5px;

}

.city{

  color:#b58b63;

  font-size:14px;

  margin-bottom:8px;

}

.woman-info > p{

  color:#777;

  font-size:14px;

  margin-bottom:6px;

}

.description{

  margin-top:12px;

  line-height:1.7;

  display:-webkit-box;

  -webkit-line-clamp:4;

  -webkit-box-orient:vertical;

  overflow:hidden;

}


/* =========================================================
   联系按钮
========================================================= */

.contact-buttons{

  display:flex;

  gap:8px;

  margin-top:18px;

}

.contact-btn{

  flex:1;

  border:0;

  padding:11px 8px;

  border-radius:8px;

  cursor:pointer;

  font-size:14px;

  font-weight:600;

  transition:.2s;

}

.whatsapp-btn{

  background:#e8f7ed;

  color:#168a43;

}

.whatsapp-btn:hover{

  background:#168a43;

  color:#fff;

}

.telegram-btn{

  background:#e8f2fb;

  color:#2481c7;

}

.telegram-btn:hover{

  background:#2481c7;

  color:#fff;

}


/* =========================================================
   Loading
========================================================= */

.loading{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

  color:#888;

}

.loading h3{

  font-size:22px;

  color:#444;

  margin-bottom:10px;

}

.loading p{

  color:#999;

  font-size:14px;

}


/* =========================================================
   Empty
========================================================= */

.empty-state{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

}

.empty-state h3{

  font-size:22px;

  margin-bottom:10px;

}

.empty-state p{

  color:#999;

}


/* =========================================================
   Footer
========================================================= */

footer{

  text-align:center;

  padding:35px 20px;

  border-top:1px solid #eee;

  color:#aaa;

  font-size:13px;

  background:#fff;

}


/* =========================================================
   Tablet
========================================================= */

@media(max-width:1000px){

  .women-grid{

    grid-template-columns:
      repeat(
        3,
        minmax(0,1fr)
      );

  }

}


/* =========================================================
   Mobile
========================================================= */

@media(max-width:700px){

  .site-header{

    height:62px;

    padding:0 20px;

  }

  .brand{

    font-size:19px;

  }

  .admin-link{

    font-size:12px;

    padding:6px 12px;

  }

  .hero{

    min-height:360px;

    padding:55px 25px;

  }

  .hero h1{

    font-size:39px;

  }

  .hero-description{

    font-size:15px;

  }

  .toolbar{

    width:
      calc(
        100% - 40px
      );

    margin-top:30px;

    align-items:flex-start;

  }

  .toolbar-title{

    width:100%;

  }

  .toolbar strong{

    font-size:20px;

  }

  .filters{

    width:100%;

  }

  .filters select{

    flex:1;

    width:50%;

  }

  .women-grid{

    width:
      calc(
        100% - 30px
      );

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

    gap:12px;

    margin-bottom:50px;

  }

  .woman-info{

    padding:14px;

  }

  .woman-info h2{

    font-size:17px;

  }

  .woman-info > p{

    font-size:12px;

  }

  .description{

    font-size:12px !important;

  }

  .contact-buttons{

    flex-direction:column;

    gap:6px;

  }

  .contact-btn{

    width:100%;

    padding:9px;

  }

}


/* =========================================================
   Small phone
========================================================= */

@media(max-width:400px){

  .women-grid{

    grid-template-columns:1fr;

  }

  .woman-image{

    aspect-ratio:4 / 5;

  }

}

</style>

</head>


<body>


<!-- =======================================================
     Header
======================================================= -->

<header class="site-header">

  <a
    class="brand"
    href="./"
  >

    缘分<span>·</span>相遇

  </a>


  <a
    class="admin-link"

  >

  </a>

</header>


<!-- =======================================================
     Main
======================================================= -->

<main>


<!-- =======================================================
     Hero
======================================================= -->

<section class="hero">

  <div class="hero-content">

    <p class="eyebrow">

      MEET SOMEONE SPECIAL

    </p>


    <h1>

      认真认识一个人，<br>

      从一次相遇开始。

    </h1>


    <p class="hero-description">

      浏览真实资料，了解彼此，再决定是否联系。

    </p>

  </div>

</section>


<!-- =======================================================
     Toolbar
======================================================= -->

<section class="toolbar">

  <div class="toolbar-title">

    <strong>

      女士资料

    </strong>


    <span id="count">

      加载中…

    </span>

  </div>


  <div class="filters">

        26–35

      </option>

      </option>

        46+

      </option>

    </select>

</section>

<!-- =======================================================
     Footer
======================================================= -->

<footer>

  ©

  <span id="year"></span>

  缘分·相遇

</footer>


<script>


/* =========================================================
   Supabase 配置
========================================================= */

const SUPABASE_URL =
  "https://yutraouosffjteivvlfx.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


/* =========================================================
   全局数据
========================================================= */

let women = [];


/* =========================================================
   年份
========================================================= */

document
  .getElementById("year")
  .textContent =
  new Date().getFullYear();


/* =========================================================
   HTML 安全处理
========================================================= */

function escapeHtml(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   Storage URL
========================================================= */

function convertStorageUrl(path){

  if(!path){

    return "";

  }


  let value =
    String(path).trim();


  if(!value){

    return "";

  }


  /*
    如果已经是完整 URL
  */

  if(
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ){

    return value;

  }


  /*
    后台上传格式：

    photos/xxx.jpg

    videos/xxx.mp4

    因此直接拼接 Storage public URL
  */

  return (

    SUPABASE_URL +

    "/storage/v1/object/public/women-photos/" +

    value.replace(
      /^\/+/,
      ""
    )

  );

}


/* =========================================================
   数组转换
========================================================= */

function normalizeMedia(value){

  if(!value){

    return [];

  }


  /*
    数据库已经是数组
  */

  if(Array.isArray(value)){

    return value

      .flat(Infinity)

      .filter(Boolean)

      .map(
        item =>
          String(item).trim()
      )

      .filter(Boolean);

  }


  /*
    数据库是 JSON 字符串
  */

  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){

      return [];

    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed

          .flat(Infinity)

          .filter(Boolean)

          .map(
            item =>
              String(item).trim()
          )

          .filter(Boolean);

      }

    }catch(error){

      /*
        不是 JSON，
        继续按照普通字符串处理
      */

    }


    /*
      兼容：

      photo1.jpg,photo2.jpg
    */

    if(text.includes(",")){

      return text

        .split(",")

        .map(
          item =>
            item.trim()
        )

        .filter(Boolean);

    }


    return [text];

  }


  return [];

}


/* =========================================================
   获取照片
========================================================= */

function getPhotos(woman){

  let photos = [];


  /*
    image_url 是旧字段。

    后台保存第一张照片的时候
    会同时写入 image_url。
  */

  if(woman.image_url){

    photos.push(
      woman.image_url
    );

  }


  /*
    photos 是完整照片数组
  */

  const extraPhotos =
    normalizeMedia(
      woman.photos
    );


  photos.push(
    ...extraPhotos
  );


  /*
    URL 转换 + 去重
  */

  return [

    ...new Set(

      photos

        .filter(Boolean)

        .map(
          convertStorageUrl
        )

        .filter(Boolean)

    )

  ];

}


/* =========================================================
   获取视频
========================================================= */

function getVideos(woman){

  return [

    ...new Set(

      normalizeMedia(
        woman.videos
      )

        .map(
          convertStorageUrl
        )

        .filter(Boolean)

    )

  ];

}


/* =========================================================
   默认图片
========================================================= */

function getDefaultImage(){

  return (

    "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="800"
      >

        <rect
          width="600"
          height="800"
          fill="#eeeeee"
        />

        <text
          x="300"
          y="400"
          text-anchor="middle"
          font-size="28"
          fill="#999999"
        >

          暂无照片

        </text>

      </svg>

    `)

  );

}


/* =========================================================
   创建城市筛选
========================================================= */

function createCityFilter(){

  const select =
    document.getElementById(
      "cityFilter"
    );


  const cities = [

    ...new Set(

      women

        .map(
          woman =>
            woman.city
        )

        .filter(
          city =>
            city &&
            String(city).trim()
        )

        .map(
          city =>
            String(city).trim()
        )

    )

  ].sort(
    (a,b) =>
      a.localeCompare(
        b
      )
  );


  select.innerHTML = `

    <option value="">

      全部城市

    </option>

  `;


  cities.forEach(
    city => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        city;


      option.textContent =
        city;


      select.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   加载 Supabase 数据
========================================================= */

async function loadWomen(){

  const grid =
    document.getElementById(
      "womenGrid"
    );


  const count =
    document.getElementById(
      "count"
    );


  grid.innerHTML = `

    <div class="loading">

      <h3>

        正在连接数据库……

      </h3>

      <p>

        请稍候

      </p>

    </div>

  `;


  try{


    /*
      只获取已经发布的女士。

      is_published = true
    */

    const url =

      SUPABASE_URL +

      "/rest/v1/women" +

      "?select=*" +

      "&is_published=eq.true" +

      "&order=created_at.desc";


    const response =
      await fetch(
        url,
        {

          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Accept":
              "application/json"

          }

        }
      );


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(

        "Supabase 请求失败。" +

        "\nHTTP 状态：" +

        response.status +

        "\n" +

        text

      );

    }


    let data;


    try{

      data =
        JSON.parse(
          text
        );

    }catch(error){

      throw new Error(

        "Supabase 返回的数据无法解析。"

      );

    }


    women =
      Array.isArray(data)
      ? data
      : [];


    count.textContent =
      `共 ${women.length} 位`;


    createCityFilter();


    renderWomen(
      women
    );


  }catch(error){

    console.error(
      "加载女士资料失败：",
      error
    );


    count.textContent =
      "加载失败";


    grid.innerHTML = `

      <div class="loading">

        <h3>

          女士资料无法加载

        </h3>


        <p style="
          max-width:700px;
          margin:12px auto;
          white-space:pre-wrap;
          word-break:break-word;
        ">

          ${escapeHtml(
            error.message
          )}

        </p>

      </div>

    `;

  }

}


/* =========================================================
   渲染女士
========================================================= */

function renderWomen(list){

  const grid =
    document.getElementById(
      "womenGrid"
    );


  if(
    !list ||
    list.length === 0
  ){

    grid.innerHTML = `

      <div class="empty-state">

        <h3>

          暂时没有女士资料

        </h3>


        <p>

          当前没有符合条件的资料。

        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    "";


  list.forEach(
    woman => {


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "woman-card";


      /*
        获取照片
      */

      const photos =
        getPhotos(
          woman
        );


      /*
        获取视频
      */

      const videos =
        getVideos(
          woman
        );


      /*
        第一张图片
      */

      const firstPhoto =
        photos.length > 0

        ?

        photos[0]

        :

        getDefaultImage();


      /* =================================================
         Media
      ================================================= */

      let mediaHTML = `

        <div class="media-gallery">

          <div class="woman-image">

            <img

              src="${escapeHtml(
                firstPhoto
              )}"

              alt="${escapeHtml(
                woman.name ||
                "女士"
              )}"

              loading="lazy"

              onerror="
                this.onerror=null;
                this.src='${getDefaultImage()}';
              "

            >

          </div>

      `;


      /*
        其他照片
      */

      if(
        photos.length > 1
      ){

        mediaHTML += `

          <div class="photo-list">

        `;


        photos

          .slice(1)

          .forEach(
            photo => {

              mediaHTML += `

                <img

                  src="${escapeHtml(
                    photo
                  )}"

                  alt="${escapeHtml(
                    woman.name ||
                    "女士"
                  )}"

                  loading="lazy"

                  onerror="
                    this.style.display='none';
                  "

                >

              `;

            }
          );


        mediaHTML += `

          </div>

        `;

      }


      /*
        视频
      */

      if(
        videos.length > 0
      ){

        mediaHTML += `

          <div class="video-list">

        `;


        videos.forEach(
          video => {

            mediaHTML += `

              <video

                controls

                playsinline

                preload="metadata"

              >

                <source

                  src="${escapeHtml(
                    video
                  )}"

                >

                您的浏览器不支持视频播放。

              </video>

            `;

          }
        );


        mediaHTML += `

          </div>

        `;

      }


      mediaHTML += `

        </div>

      `;


      /* =================================================
         信息
      ================================================= */

      let infoHTML = `

        <div class="woman-info">

          <h2>

            ${escapeHtml(
              woman.name ||
              "未填写姓名"
            )}

            ${
              woman.age

              ?

              "，" +
              escapeHtml(
                woman.age
              ) +
              "岁"

              :

              ""
            }

          </h2>

      `;


      /*
        城市
      */

      if(
        woman.city
      ){

        infoHTML += `

          <p class="city">

            ${escapeHtml(
              woman.city
            )}

          </p>

        `;

      }


      /*
        职业
      */

      if(
        woman.occupation
      ){

        infoHTML += `

          <p>

            ${escapeHtml(
              woman.occupation
            )}

          </p>

        `;

      }


      /*
        个人介绍
      */

      if(
        woman.description
      ){

        infoHTML += `

          <p class="description">

            ${escapeHtml(
              woman.description
            )}

          </p>

        `;

      }


      /*
        联系方式
      */

      if(
        woman.whatsapp ||
        woman.telegram
      ){

        infoHTML += `

          <div class="contact-buttons">

        `;


        /*
          WhatsApp
        */

        if(
          woman.whatsapp
        ){

          infoHTML += `

            <button

              class="contact-btn whatsapp-btn"

              type="button"

              data-whatsapp="${escapeHtml(
                woman.whatsapp
              )}"

            >

              WhatsApp

            </button>

          `;

        }


        /*
          Telegram
        */

        if(
          woman.telegram
        ){

          infoHTML += `

            <button

              class="contact-btn telegram-btn"

              type="button"

              data-telegram="${escapeHtml(
                woman.telegram
              )}"

            >

              Telegram

            </button>

          `;

        }


        infoHTML += `

          </div>

        `;

      }


      infoHTML += `

        </div>

      `;


      /*
        写入卡片
      */

      card.innerHTML =
        mediaHTML +
        infoHTML;


      grid.appendChild(
        card
      );


      /*
        WhatsApp
      */

      const whatsappButton =
        card.querySelector(
          "[data-whatsapp]"
        );


      if(
        whatsappButton
      ){

        whatsappButton.addEventListener(
          "click",
          function(){

            openWhatsApp(
              this.dataset.whatsapp
            );

          }
        );

      }


      /*
        Telegram
      */

      const telegramButton =
        card.querySelector(
          "[data-telegram]"
        );


      if(
        telegramButton
      ){

        telegramButton.addEventListener(
          "click",
          function(){

            openTelegram(
              this.dataset.telegram
            );

          }
        );

      }

    }
  );

}


/* =========================================================
   WhatsApp
========================================================= */

function openWhatsApp(
  phone
){

  let number =
    String(
      phone || ""
    )
    .trim();


  /*
    如果后台填写：

    +52 155 1234 5678

    自动只保留数字
  */

  number =
    number.replace(
      /[^\d]/g,
      ""
    );


  if(!number){

    alert(
      "WhatsApp 联系方式无效"
    );

    return;

  }


  /*
    wa.me 格式：

    https://wa.me/国家码+号码
  */

  const url =
    "https://wa.me/" +
    number;


  window.location.href =
    url;

}


/* =========================================================
   Telegram
========================================================= */

function openTelegram(
  username
){

  let value =
    String(
      username || ""
    ).trim();


  if(!value){

    alert(
      "Telegram 联系方式无效"
    );

    return;

  }


  /*
    后台可以填写：

    @username

    username

    https://t.me/username
  */

  if(
    value.startsWith(
      "https://t.me/"
    ) ||

    value.startsWith(
      "http://t.me/"
    )
  ){

    window.location.href =
      value;

    return;

  }


  value =
    value.replace(
      /^@/,
      ""
    );


  if(!value){

    alert(
      "Telegram 联系方式无效"
    );

    return;

  }


  window.location.href =
    "https://t.me/" +
    value;

}


/* =========================================================
   筛选
========================================================= */

function filterWomen(){

  const city =
    document
      .getElementById(
        "cityFilter"
      )
      .value;


  const age =
    document
      .getElementById(
        "ageFilter"
      )
      .value;


  const filtered =
    women.filter(
      woman => {


        /*
          城市
        */

        if(
          city &&
          String(
            woman.city || ""
          ).trim() !== city
        ){

          return false;

        }


        /*
          年龄
        */

        const womanAge =
          Number(
            woman.age
          );


        if(
          age === "18-25"
        ){

          return (

            womanAge >= 18 &&

            womanAge <= 25

          );

        }


        if(
          age === "26-35"
        ){

          return (

            womanAge >= 26 &&

            womanAge <= 35

          );

        }


        if(
          age === "36-45"
        ){

          return (

            womanAge >= 36 &&

            womanAge <= 45

          );

        }


        if(
          age === "46+"
        ){

          return (

            womanAge >= 46

          );

        }


        return true;

      }
    );


  /*
    更新数量
  */

  document
    .getElementById(
      "count"
    )
    .textContent =
    `共 ${filtered.length} 位`;


  renderWomen(
    filtered
  );

}


/* =========================================================
   筛选事件
========================================================= */

document
  .getElementById(
    "cityFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById(
    "ageFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


/* =========================================================
   页面启动
========================================================= */

loadWomen();
