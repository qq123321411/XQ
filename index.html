<!doctype html>
<html lang="auto">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分·相遇</title>

<meta
  id="metaDescription"
  name="description"
  content=""
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

html,
body{
  min-height:100%;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  color:#f3e9ed;

  line-height:1.6;

  overflow-x:hidden;

  background:

    radial-gradient(
      ellipse 75% 38% at 5% 8%,
      rgba(213,128,151,.16),
      transparent 70%
    ),

    radial-gradient(
      ellipse 70% 40% at 95% 22%,
      rgba(232,181,145,.12),
      transparent 70%
    ),

    radial-gradient(
      ellipse 80% 55% at 50% 58%,
      rgba(108,55,76,.15),
      transparent 75%
    ),

    radial-gradient(
      ellipse 70% 40% at 15% 90%,
      rgba(194,105,136,.12),
      transparent 72%
    ),

    linear-gradient(
      180deg,
      #171014 0%,
      #21151b 32%,
      #291923 65%,
      #21141b 100%
    );

  background-attachment:fixed;

}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================================================
   HEADER
========================================================= */

.site-header{

  height:72px;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  padding:0 6%;

  position:sticky;

  top:0;

  z-index:100;

  color:#fff;

  background:

    linear-gradient(
      90deg,
      rgba(23,15,20,.97),
      rgba(48,28,36,.94)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.15);

  backdrop-filter:blur(16px);

}

.brand{

  font-size:22px;

  font-weight:700;

  letter-spacing:2px;

  color:#fff;

}

.brand span{

  color:#df9faf;

  margin:0 4px;

}


/* =========================================================
   HERO
========================================================= */

.hero{

  min-height:360px;

  height:360px;

  display:flex;

  align-items:center;

  position:relative;

  z-index:2;

  padding:55px 8%;

  overflow:hidden;

  color:#fff;

  background-image:

    linear-gradient(
      90deg,
      rgba(20,13,17,.92) 0%,
      rgba(28,18,22,.74) 38%,
      rgba(30,20,24,.48) 70%,
      rgba(20,14,18,.34) 100%
    ),

    url(
      "https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png"
    );

  background-size:cover;

  background-position:center 42%;

}

.hero{

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      #000 0%,
      #000 90%,
      rgba(0,0,0,.96) 96%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to bottom,
      #000 0%,
      #000 90%,
      rgba(0,0,0,.96) 96%,
      transparent 100%
    );

}

.hero > div{

  max-width:720px;

  position:relative;

  z-index:5;

}

.eyebrow{

  font-size:12px;

  letter-spacing:5px;

  color:#e8a8b8;

  margin-bottom:15px;

  font-weight:600;

}

.hero h1{

  font-size:
    clamp(36px,5vw,64px);

  line-height:1.16;

  font-weight:600;

  letter-spacing:1px;

  margin-bottom:18px;

  text-shadow:
    0 4px 25px
    rgba(0,0,0,.28);

}

.hero p:not(.eyebrow){

  color:
    rgba(255,255,255,.84);

  font-size:16px;

  max-width:550px;

  line-height:1.8;

}

.hero-label{

  margin-top:22px;

  display:flex;

  align-items:center;

  gap:12px;

  color:
    rgba(255,255,255,.62);

  font-size:13px;

}

.hero-label::before{

  content:"";

  width:34px;

  height:1px;

  background:#d99cac;

}


/* =========================================================
   CONTENT
========================================================= */

.content-section{

  position:relative;

  z-index:2;

  overflow:visible;

  padding-top:1px;

  background:transparent;

}

.content-section::before{

  content:"";

  position:absolute;

  left:0;

  right:0;

  top:-90px;

  height:90px;

  pointer-events:none;

  z-index:0;

  background:

    linear-gradient(
      to bottom,
      transparent,
      rgba(33,21,27,.65)
    );

}


/* =========================================================
   PROFILES
========================================================= */

.profiles-area{

  width:100%;

  position:relative;

  z-index:30;

  isolation:isolate;

  overflow:hidden;

  padding-bottom:70px;

  background:

    radial-gradient(
      ellipse 70% 38% at 8% 12%,
      rgba(213,128,151,.17),
      transparent 70%
    ),

    radial-gradient(
      ellipse 65% 40% at 92% 20%,
      rgba(232,181,145,.13),
      transparent 70%
    ),

    radial-gradient(
      ellipse 75% 55% at 50% 52%,
      rgba(108,55,76,.13),
      transparent 75%
    ),

    linear-gradient(
      180deg,
      #21151b 0%,
      #261821 45%,
      #21141b 100%
    );

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  width:88%;

  max-width:1400px;

  margin:35px auto 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  flex-wrap:wrap;

  position:relative;

  z-index:5;

}

.section-title{

  color:#fff;

}

.section-title small{

  display:block;

  font-size:11px;

  letter-spacing:4px;

  color:#e0a0b2;

  margin-bottom:4px;

}

.section-title h2{

  font-size:27px;

  font-weight:600;

  color:#fff;

}

.filters{

  display:flex;

  gap:10px;

}

.filters select{

  appearance:none;

  border:
    1px solid
    rgba(235,185,197,.22);

  background:
    rgba(42,25,32,.72);

  padding:
    11px 40px 11px 15px;

  border-radius:10px;

  color:#f8e9ee;

  cursor:pointer;

  outline:none;

  box-shadow:

    0 8px 28px
    rgba(0,0,0,.14),

    inset 0 1px 0
    rgba(255,255,255,.06);

  backdrop-filter:blur(14px);

}

.filters select:focus{

  border-color:
    rgba(214,154,170,.75);

}


/* =========================================================
   GRID
========================================================= */

.women-grid{

  width:88%;

  max-width:1400px;

  margin:0 auto;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:24px;

  position:relative;

  z-index:6;

}


/* =========================================================
   CARD
========================================================= */

.woman-card{

  position:relative;

  z-index:7;

  height:520px;

  min-height:520px;

  border-radius:18px;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.22);

  transition:
    transform .35s ease,
    box-shadow .35s ease;

  cursor:pointer;

  color:#fff;

  background:#281c21;

  box-shadow:

    0 12px 40px
    rgba(0,0,0,.20),

    0 2px 8px
    rgba(0,0,0,.08);

  isolation:isolate;

}

.woman-card:hover{

  transform:
    translateY(-7px);

  box-shadow:

    0 25px 65px
    rgba(0,0,0,.32),

    0 4px 15px
    rgba(0,0,0,.12);

}


/* =========================================================
   IMAGE
========================================================= */

.woman-image{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:#281c21;

}

.woman-image::after{

  content:"";

  position:absolute;

  inset:0;

  z-index:2;

  pointer-events:none;

  background:

    linear-gradient(
      to bottom,
      rgba(15,8,12,0) 35%,
      rgba(15,8,12,.04) 45%,
      rgba(15,8,12,.28) 62%,
      rgba(15,8,12,.78) 82%,
      rgba(15,8,12,.96) 100%
    );

}

.woman-image::before{

  content:"♥";

  position:absolute;

  right:12px;

  top:12px;

  z-index:4;

  width:32px;

  height:32px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  color:rgba(255,255,255,.95);

  background:
    rgba(60,30,42,.28);

  backdrop-filter:
    blur(5px);

  font-size:14px;

  opacity:.9;

  border:
    1px solid
    rgba(255,255,255,.16);

}

.woman-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  object-position:center center;

  display:block;

  transition:
    transform .6s ease;

}

.woman-card:hover
.woman-image img{

  transform:
    scale(1.045);

}


/* =========================================================
   CARD INFO
========================================================= */

.woman-info{

  position:absolute;

  left:0;

  right:0;

  bottom:0;

  z-index:5;

  padding:
    25px 20px 20px;

  padding-right:145px;

  background:
    linear-gradient(
      to bottom,
      rgba(15,8,12,0),
      rgba(15,8,12,.48) 30%,
      rgba(15,8,12,.92) 100%
    );

}

.woman-info h2{

  font-size:21px;

  font-weight:600;

  color:#fff;

  margin-bottom:4px;

  text-shadow:
    0 2px 8px
    rgba(0,0,0,.45);

}

.city{

  color:#f0b5c4;

  font-size:13px;

  margin-bottom:5px;

  text-shadow:
    0 2px 6px
    rgba(0,0,0,.45);

}

.woman-info p{

  color:
    rgba(255,255,255,.82);

  font-size:13px;

  text-shadow:
    0 2px 6px
    rgba(0,0,0,.45);

}

.description{

  margin-top:7px;

  line-height:1.6;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;

  color:
    rgba(255,255,255,.76) !important;

}


/* =========================================================
   WOMAN CONTACT BUTTON
========================================================= */

.woman-contact-button{

  position:absolute;

  right:14px;

  bottom:15px;

  z-index:20;

  border:1px solid
    rgba(255,255,255,.25);

  background:
    rgba(255,255,255,.16);

  color:#fff;

  min-width:112px;

  padding:9px 13px;

  border-radius:10px;

  font-size:12px;

  font-weight:600;

  cursor:pointer;

  backdrop-filter:blur(10px);

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.18);

  transition:
    background .2s ease,
    transform .2s ease;

}

.woman-contact-button:hover{

  background:
    rgba(255,255,255,.25);

  transform:
    translateY(-2px);

}

.woman-contact-button:active{

  transform:
    scale(.97);

}


/* =========================================================
   MORE CARD
========================================================= */

.more-card{

  position:relative;

  z-index:7;

  min-height:520px;

  overflow:hidden;

  border-radius:18px;

  cursor:pointer;

  background:#281c21;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.22);

  isolation:isolate;

}

.more-card-bg{

  position:absolute;

  inset:0;

  z-index:0;

  background-image:

    linear-gradient(
      rgba(30,17,22,.20),
      rgba(27,16,21,.86)
    ),

    url(
      "https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png"
    );

  background-size:cover;

  background-position:center;

  transition:
    transform .6s ease;

}

.more-card:hover
.more-card-bg{

  transform:
    scale(1.05);

}

.more-card-content{

  position:relative;

  z-index:2;

  min-height:520px;

  padding:30px;

  display:flex;

  flex-direction:column;

  justify-content:flex-end;

  color:#fff;

}

.more-card-content h2{

  font-size:26px;

  line-height:1.3;

  margin-bottom:12px;

}

.more-card-content p{

  color:
    rgba(255,255,255,.82);

  font-size:14px;

  line-height:1.8;

  margin-bottom:20px;

}

.join-button{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  padding:13px;

  background:#fff;

  color:#33282c;

  border-radius:10px;

  font-weight:600;

  transition:.25s ease;

}

.more-card:hover
.join-button{

  background:#f3dce2;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

  color:
    rgba(255,255,255,.70);

  position:relative;

  z-index:6;

}


/* =========================================================
   ROMANTIC BANNER
========================================================= */

.romantic-banner{

  width:88%;

  max-width:1400px;

  min-height:235px;

  margin:0 auto;

  position:relative;

  z-index:30;

  overflow:hidden;

  border-radius:25px;

  border:
    1px solid
    rgba(255,255,255,.14);

  background:

    linear-gradient(
      115deg,
      rgba(35,20,27,.96),
      rgba(72,40,50,.94),
      rgba(48,28,35,.97)
    );

  box-shadow:

    0 28px 75px
    rgba(0,0,0,.23),

    inset 0 1px 0
    rgba(255,255,255,.10);

  isolation:isolate;

}

.romantic-banner-content{

  min-height:235px;

  position:relative;

  z-index:5;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  text-align:center;

  padding:30px;

}

.romantic-mini{

  font-size:10px;

  letter-spacing:6px;

  color:#e8bd9f;

  margin-bottom:8px;

  opacity:.9;

}

.romantic-banner h2{

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-weight:400;

  font-size:
    clamp(28px,4vw,47px);

  letter-spacing:2px;

  line-height:1.25;

  text-shadow:
    0 5px 30px
    rgba(0,0,0,.35);

}

.romantic-banner h2 span{

  color:#e6aabd;

}

.romantic-subtitle{

  margin-top:10px;

  color:
    rgba(255,255,255,.73);

  font-size:14px;

  letter-spacing:2px;

}

.romantic-line{

  width:100px;

  height:1px;

  margin-top:19px;

  position:relative;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(230,176,145,.85),
      transparent
    );

}

.romantic-heart{

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  color:#e6a8ba;

  font-size:14px;

  background:#4c2b35;

  padding:0 8px;

}

.banner-corner{

  position:absolute;

  width:70px;

  height:70px;

  border-color:
    rgba(233,185,160,.32);

  border-style:solid;

  z-index:4;

}

.banner-corner.left-top{
  left:18px;
  top:18px;
  border-width:1px 0 0 1px;
  border-radius:15px 0 0 0;
}

.banner-corner.right-top{
  right:18px;
  top:18px;
  border-width:1px 1px 0 0;
  border-radius:0 15px 0 0;
}

.banner-corner.left-bottom{
  left:18px;
  bottom:18px;
  border-width:0 0 1px 1px;
  border-radius:0 0 0 15px;
}

.banner-corner.right-bottom{
  right:18px;
  bottom:18px;
  border-width:0 1px 1px 0;
  border-radius:0 0 15px 0;
}


/* =========================================================
   FOOTER
========================================================= */

footer{

  position:relative;

  z-index:2;

  overflow:hidden;

  isolation:isolate;

  text-align:center;

  padding:
    70px 20px 75px;

  color:
    rgba(255,255,255,.68);

  font-size:13px;

  background:

    linear-gradient(
      180deg,
      #21151b 0%,
      #24171e 50%,
      #1b1217 100%
    );

  border-top:
    1px solid
    rgba(255,255,255,.06);

}

footer span{

  position:relative;

  z-index:2;

}


/* =========================================================
   GALLERY
========================================================= */

.gallery-modal{

  position:fixed;

  inset:0;

  z-index:1000;

  background:
    rgba(15,10,13,.96);

  display:none;

  align-items:center;

  justify-content:center;

}

.gallery-modal.show{

  display:flex;

}

.gallery-container{

  width:100%;

  height:100%;

  display:flex;

  flex-direction:column;

  position:relative;

}

.gallery-header{

  height:65px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 20px;

  color:#fff;

  flex-shrink:0;

}

.gallery-title{

  font-size:17px;

  font-weight:600;

}

.gallery-close{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

  color:#fff;

  font-size:25px;

  cursor:pointer;

}

.gallery-body{

  flex:1;

  min-height:0;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  overflow:hidden;

}

.gallery-track{

  width:100%;

  height:100%;

  display:flex;

  overflow-x:auto;

  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;

}

.gallery-track::-webkit-scrollbar{
  display:none;
}

.gallery-slide{

  min-width:100%;

  height:100%;

  scroll-snap-align:center;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:10px 70px;

}

.gallery-slide img{

  max-width:100%;

  max-height:100%;

  object-fit:contain;

  border-radius:6px;

  user-select:none;

  -webkit-user-drag:none;

}

.gallery-slide video{

  max-width:100%;

  max-height:100%;

  width:auto;

  height:auto;

  background:#000;

  border-radius:6px;

}

.gallery-arrow{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:48px;

  height:48px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

  color:#fff;

  font-size:30px;

  cursor:pointer;

  z-index:5;

}

.gallery-prev{
  left:15px;
}

.gallery-next{
  right:15px;
}

.gallery-counter{

  height:55px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#aaa;

  font-size:13px;

}


/* =========================================================
   CONTACT MODAL
========================================================= */

.contact-modal{

  position:fixed;

  inset:0;

  z-index:1200;

  background:
    rgba(15,8,12,.70);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  backdrop-filter:
    blur(8px);

}

.contact-modal.show{

  display:flex;

}

.contact-box{

  width:100%;

  max-width:410px;

  background:

    linear-gradient(
      145deg,
      #fff,
      #fdf7f8
    );

  border-radius:20px;

  padding:32px;

  position:relative;

  text-align:center;

  box-shadow:

    0 30px 80px
    rgba(0,0,0,.30);

}

.contact-box h2{

  font-size:27px;

  margin-bottom:6px;

  color:#33272b;

}

.contact-name{

  color:#a17f88;

  font-size:13px;

  margin-bottom:23px;

}

.contact-close{

  position:absolute;

  top:12px;

  right:12px;

  width:35px;

  height:35px;

  border:0;

  border-radius:50%;

  background:#f1e8ea;

  color:#66565b;

  font-size:20px;

  cursor:pointer;

}

.contact-buttons{

  display:flex;

  flex-direction:column;

  gap:10px;

}

.contact-buttons a{

  display:flex;

  align-items:center;

  justify-content:center;

  padding:14px;

  border-radius:11px;

  font-weight:600;

  transition:.25s ease;

}

.contact-buttons a:hover{

  transform:translateY(-2px);

}

.contact-whatsapp{

  background:#e7f6ec;

  color:#168743;

}

.contact-telegram{

  background:#e7f1f9;

  color:#2480c5;

}

.no-contact{

  color:#999;

  font-size:13px;

  padding:8px;

}


/* =========================================================
   JOIN MODAL
========================================================= */

.join-modal{

  position:fixed;

  inset:0;

  z-index:1100;

  background:
    rgba(15,8,12,.68);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  backdrop-filter:
    blur(8px);

}

.join-modal.show{
  display:flex;
}

.join-box{

  width:100%;

  max-width:410px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #fdf7f8
    );

  border-radius:20px;

  padding:32px;

  position:relative;

      lang.startsWith("zh-cn")

    if(
      lang === "zh-tw" ||
      lang === "zh-hk" ||
      lang === "zh-mo" ||
      lang.startsWith("zh-tw") ||
      lang.startsWith("zh-hk")
    ){

      return "zh_TW";

    }


    if(
      lang.startsWith("ja")
    ){

      return "ja";

    }


    if(
      lang.startsWith("ru")
    ){

      return "ru";

    }


    if(
      lang.startsWith("zh")
    ){

      return "zh_CN";

    }


    if(
      lang.startsWith("en")
    ){

      return "en";

    }

  }


  return "en";

}


/* =========================================================
   COUNTRY -> LANGUAGE
========================================================= */

function languageFromCountry(countryCode){

  const country =
    String(countryCode || "")
      .trim()
      .toUpperCase();


  /*
   * 中国大陆
   */

  if(
    country === "CN"
  ){

    return "zh_CN";

  }


  /*
   * 台湾 / 香港 / 澳门
   */

  if(
    country === "TW" ||
    country === "HK" ||
    country === "MO"
  ){

    return "zh_TW";

  }


  /*
   * 日本
   */

  if(
    country === "JP"
  ){

    return "ja";

  }


  /*
   * 俄罗斯及主要俄语国家
   */

  const russianCountries = [

    "RU",
    "BY",
    "KZ",
    "KG"

  ];


  if(
    russianCountries.includes(
      country
    )
  ){

    return "ru";

  }


  /*
   * 其他国家统一使用英文
   */

  return "en";

}


/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyLanguage(language){

  if(
    !LANGUAGE_CONFIG[language]
  ){

    language = "en";

  }


  CURRENT_LANGUAGE =
    language;


  CURRENT_TRANSLATION =
    LANGUAGE_CONFIG[
      language
    ];


  document.documentElement.lang =
    CURRENT_TRANSLATION.htmlLang;


  document.title =
    CURRENT_TRANSLATION.title;


  const meta =
    document.getElementById(
      "metaDescription"
    );


  if(meta){

    meta.setAttribute(
      "content",
      CURRENT_TRANSLATION.description
    );

  }


  /*
   * 普通文字
   */

  document
    .querySelectorAll(
      "[data-i18n]"
    )
    .forEach(element => {

      const key =
        element.getAttribute(
          "data-i18n"
        );


      if(
        Object.prototype.hasOwnProperty.call(
          CURRENT_TRANSLATION,
          key
        )
      ){

        element.textContent =
          CURRENT_TRANSLATION[key];

      }

    });


  /*
   * HTML 文字
   *
   * 用于 hero 标题换行等内容。
   */

  document
    .querySelectorAll(
      "[data-i18n-html]"
    )
    .forEach(element => {

      const key =
        element.getAttribute(
          "data-i18n-html"
        );


      if(
        Object.prototype.hasOwnProperty.call(
          CURRENT_TRANSLATION,
          key
        )
      ){

        element.innerHTML =
          CURRENT_TRANSLATION[key];

      }

    });


  /*
   * 更新年龄筛选文字
   */

  updateAgeFilterLanguage();

}


/* =========================================================
   AGE FILTER LANGUAGE
========================================================= */

function updateAgeFilterLanguage(){

  const select =
    document.getElementById(
      "ageFilter"
    );


  if(!select){
    return;
  }


  const options =
    select.querySelectorAll(
      "option"
    );


  options.forEach(option => {

    const key =
      option.getAttribute(
        "data-i18n"
      );


    if(
      key &&
      CURRENT_TRANSLATION[key]
    ){

      option.textContent =
        CURRENT_TRANSLATION[key];

    }

  });

}


/* =========================================================
   IP LANGUAGE DETECTION
========================================================= */

async function detectLanguageByIP(){

  /*
   * 第一备用：
   * 浏览器语言
   */

  const browserLanguage =
    detectBrowserLanguage();


  try{

    /*
     * 使用公开 IP 地区接口。
     *
     * 如果接口不可用，
     * 不会影响网站正常运行。
     */

    const response =
      await fetch(
        "https://ipwho.is/",
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "IP detection failed"
      );

    }


    const data =
      await response.json();


    if(
      data &&
      data.success &&
      data.country_code
    ){

      const language =
        languageFromCountry(
          data.country_code
        );


      applyLanguage(
        language
      );


      return;

    }


  }catch(error){

    console.warn(
      "IP语言识别失败，使用浏览器语言：",
      error
    );

  }


  /*
   * IP 获取失败：
   * 使用浏览器语言。
   */

  applyLanguage(
    browserLanguage
  );

}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   RANDOM SHUFFLE
========================================================= */

function shuffleWomen(list){

  const result =
    [...list];


  for(
    let i = result.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}


/* =========================================================
   MEDIA
========================================================= */

function normalizeMedia(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){

    return value
      .flat(Infinity)
      .filter(Boolean)
      .map(v => String(v).trim())
      .filter(Boolean);

  }


  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){
      return [];
    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed
          .flat(Infinity)
          .filter(Boolean)
          .map(v => String(v).trim())
          .filter(Boolean);

      }

    }catch(e){}


    if(text.includes(",")){

      return text
        .split(",")
        .map(v => v.trim())
        .filter(Boolean);

    }


    return [text];

  }


  return [];

}


/* =========================================================
   STORAGE URL
========================================================= */

function getStorageUrl(path){

  if(!path){
    return "";
  }


  const value =
    String(path).trim();


  if(

    value.startsWith("http://") ||

    value.startsWith("https://") ||

    value.startsWith("data:")

  ){

    return value;

  }


  return (

    SUPABASE_URL +

    "/storage/v1/object/public/" +

    STORAGE_BUCKET +

    "/" +

    value.replace(/^\/+/,"")

  );

}

function getPhotos(woman){

/* =========================================================
   WHATSAPP URL
========================================================= */

function makeWhatsAppUrl(value){

  if(!value){
    return "";
  }


  let text =
    String(value)
      .trim();


  if(
    text.startsWith("https://wa.me/") ||
    text.startsWith("http://wa.me/") ||
    text.startsWith("https://api.whatsapp.com/")
  ){

    return text;

  }


  const number =
    text.replace(/[^\d]/g,"");


  if(!number){
    return "";
  }


  return (
    "https://wa.me/" +
    number
  );

}


/* =========================================================
   TELEGRAM URL
========================================================= */

function makeTelegramUrl(value){

  if(!value){
    return "";
  }


  let username =
    String(value)
      .trim();


  if(!username){
    return "";
  }


  if(

    username.startsWith(
      "https://t.me/"
    )

    ||

    username.startsWith(
      "http://t.me/"
    )

    ||

    username.startsWith(
      "https://telegram.me/"
    )

    ||

    username.startsWith(
      "http://telegram.me/"
    )

  ){

    return username;

  }


  username =
    username.replace(
      /^@/,
      ""
    );


  if(!username){
    return "";
  }


  return (
    "https://t.me/" +
    username
  );

}

/* =========================================================
   RENDER GALLERY
========================================================= */

function renderGallery(){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.innerHTML = "";


  galleryMedia.forEach(media => {

    const slide =
      document.createElement(
        "div"
      );


    slide.className =
      "gallery-slide";


    if(media.type === "image"){

      slide.innerHTML = `

        <img
          src="${escapeHtml(media.url)}"
          draggable="false"
        >

      `;

    }else{

      slide.innerHTML = `

        <video
          controls
          playsinline
          preload="metadata"
        >

          <source
            src="${escapeHtml(media.url)}"
          >

        </video>

      `;

    }


    track.appendChild(
      slide
    );

  });


  updateGalleryCounter();


  requestAnimationFrame(() => {

    track.scrollLeft =
      track.clientWidth *
      galleryIndex;

  });

}


/* =========================================================
   GALLERY COUNTER
========================================================= */

function updateGalleryCounter(){

  const counter =
    document.getElementById(
      "galleryCounter"
    );


  if(galleryMedia.length){

    counter.textContent =

      `${galleryIndex + 1} / ${galleryMedia.length} · ${CURRENT_TRANSLATION.galleryCounter}`;

  }

}


/* =========================================================
   GALLERY GO TO
========================================================= */

function galleryGoTo(index){

  if(!galleryMedia.length){
    return;
  }


  if(index < 0){

    index =
      galleryMedia.length - 1;

  }


  if(index >= galleryMedia.length){

    index = 0;

  }


  galleryIndex =
    index;


  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.scrollTo({

    left:
      track.clientWidth *
      galleryIndex,

    behavior:"smooth"

  });


  updateGalleryCounter();

}


/* =========================================================
   GALLERY SCROLL
========================================================= */

document
  .getElementById("galleryTrack")
  .addEventListener(
    "scroll",
    function(){

      const width =
        this.clientWidth;


      if(!width){
        return;
      }


      const index =
        Math.round(
          this.scrollLeft /
          width
        );


      if(index !== galleryIndex){

        galleryIndex =
          index;

        updateGalleryCounter();

      }

    }
  );


/* =========================================================
   GALLERY BUTTONS
========================================================= */

document
  .getElementById("galleryPrev")
  .addEventListener(

    () =>
      galleryGoTo(
        galleryIndex - 1
      )
  );

      )

   JOIN MODAL
========================================================= */

function openJoinModal(){

  const box =
    document.getElementById(
      "joinContacts"
    );


  box.innerHTML = "";


  const whatsappUrl =
    makeWhatsAppUrl(
      joinContact.whatsapp
    );


  const telegramUrl =
    makeTelegramUrl(
      joinContact.telegram
    );


  if(whatsappUrl){

    const a =
      document.createElement(
        "a"
      );


    a.href =
      whatsappUrl;

    a.target =
      "_blank";

    a.rel =
      "noopener noreferrer";

    a.className =
      "join-whatsapp";

    a.textContent =
      CURRENT_TRANSLATION.joinWhatsApp;


    box.appendChild(a);

  }


  if(telegramUrl){

    const a =
      document.createElement(
        "a"
      );


    a.href =
      telegramUrl;

    a.target =
      "_blank";

    a.rel =
      "noopener noreferrer";

    a.className =
      "join-telegram";

    a.textContent =
      CURRENT_TRANSLATION.joinTelegram;


    box.appendChild(a);

  }


  if(
    !whatsappUrl &&
    !telegramUrl
  ){

    box.innerHTML = `

      <div class="no-contact">
        ${escapeHtml(
          CURRENT_TRANSLATION.noJoinContact
        )}
      </div>

    `;

  }


  document
    .getElementById("joinModal")
    .classList.add("show");

}


function closeJoinModal(){

  document
    .getElementById("joinModal")
    .classList.remove("show");

}


document
  .getElementById("joinClose")
  .addEventListener(
    "click",
    closeJoinModal
  );


document
  .getElementById("joinModal")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){

        closeJoinModal();

      }

    }
  );


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeGallery();

      closeJoinModal();

      closeWomanContact();

    }


    if(

      document
        .getElementById("galleryModal")
        .classList
        .contains("show")

    ){

      if(event.key === "ArrowLeft"){

        galleryGoTo(
          galleryIndex - 1
        );

      }


      if(event.key === "ArrowRight"){

        galleryGoTo(
          galleryIndex + 1
        );

      }

    }

  }
);


/* =========================================================
   FILTER
========================================================= */

function filterWomen(){

  const city =
    document
      .getElementById("cityFilter")
      .value;


  const age =
    document
      .getElementById("ageFilter")
      .value;


  const filtered =
    shuffledWomen.filter(
      woman => {

        if(
          city &&
          woman.city !== city
        ){

          return false;

        }


        const womanAge =
          Number(woman.age);


        if(age === "18-25"){

          return (
            womanAge >= 18 &&
            womanAge <= 25
          );

        }


        if(age === "26-35"){

          return (
            womanAge >= 26 &&
            womanAge <= 35
          );

        }


        if(age === "36-45"){

          return (
            womanAge >= 36 &&
            womanAge <= 45
          );

        }


        if(age === "46+"){

          return womanAge >= 46;

        }


        return true;

      }
    );


  renderWomen(
    filtered
  );

}


/* =========================================================
   FILTER EVENTS
========================================================= */

document
  .getElementById("cityFilter")
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById("ageFilter")
  .addEventListener(
    "change",
    filterWomen
  );


/* =========================================================
   START
========================================================= */

Promise.all([

  loadWomen(),

  loadJoinContact()

]);

</script>
