<script>

/* ==================================================

================================================== */

const SUPABASE_URL =
"https://yutraouosffjteivvlfx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


/* ==================================================
   全局变量
================================================== */

let women = [];

let currentViewerWoman = null;

let currentMedia = [];

let currentMediaIndex = 0;


/* ==================================================
   Year
================================================== */

document

  new Date().getFullYear();


/* ==================================================
   HTML 安全处理
================================================== */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* ==================================================
   Storage URL
================================================== */

function convertStorageUrl(path){

  if(!path){

    return "";

  }


  let value =
    String(path).trim();


  if(
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ){

    return value;

  }


  return (

    SUPABASE_URL +

    "/storage/v1/object/public/women-photos/" +

    value.replace(/^\/+/,"")

  );

}


/* ==================================================
   数组转换
================================================== */

function normalizeMedia(value){

  if(!value){

    return [];

  }


  if(Array.isArray(value)){

    return value

      .flat(Infinity)

      .filter(Boolean)

      .map(
        v =>
          String(v).trim()
      )

      .filter(Boolean);

  }


  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){

      return [];

    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed

          .flat(Infinity)

          .filter(Boolean)

          .map(
            v =>
              String(v).trim()
          )

          .filter(Boolean);

      }

    }catch(error){}


    if(text.includes(",")){

      return text

        .split(",")

        .map(
          v =>
            v.trim()
        )

        .filter(Boolean);

    }


    return [text];

  }


  return [];

}


/* ==================================================
   获取照片
================================================== */

function getPhotos(woman){

  let photos = [];


  /*
    兼容旧 image_url
  */

  if(woman.image_url){

    photos.push(
      woman.image_url
    );

  }


  /*
    新 photos
  */

  const extra =
    normalizeMedia(
      woman.photos
    );


  photos =
    photos.concat(
      extra
    );


  /*
    去重 + URL
  */

  return [
    ...new Set(

      photos

        .filter(Boolean)

        .map(
          convertStorageUrl
        )

        .filter(Boolean)

    )
  ];

}


/* ==================================================
   获取视频
================================================== */

function getVideos(woman){

  return [

    ...new Set(

      normalizeMedia(
        woman.videos
      )

        .filter(Boolean)

        .map(
          convertStorageUrl
        )

        .filter(Boolean)

    )

  ];

}


/* ==================================================
   默认图片
================================================== */

function getDefaultImage(){

  return (

    "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="800"
      >

        <rect
          width="600"
          height="800"
          fill="#eeeeee"
        />

        <text
          x="300"
          y="400"
          text-anchor="middle"
          font-size="28"
          fill="#999999"
        >
          暂无照片
        </text>

      </svg>

    `)

  );

}


/* ==================================================
   获取全部媒体
================================================== */

function getAllMedia(woman){

  const photos =
    getPhotos(woman);


  const videos =
    getVideos(woman);


  const media = [];


  photos.forEach(
    url => {

      media.push({

        type:"image",

        url:url

      });

    }
  );


  videos.forEach(
    url => {

      media.push({

        type:"video",

        url:url

      });

    }
  );


  return media;

}

  const grid =

  try{

    grid.innerHTML = `

      <div class="loading">

        正在连接数据库……

      </div>

    `;


    const url =

      SUPABASE_URL +

      "/rest/v1/women" +

      "?select=*" +

      "&is_published=eq.true" +

      "&order=created_at.desc";


    const response =
      await fetch(
        url,
        {

          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          }

        }
      );


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(

        "Supabase 错误 " +

        response.status +

        ": " +

        text

      );

    }


    let data;


    try{

      data =
        JSON.parse(text);

    }catch(error){

      throw new Error(
        "Supabase 返回的数据不是 JSON"
      );

    }


    women =
      data || [];


    count.textContent =
      `共 ${women.length} 位`;


    createCityFilter();


    renderWomen(
      women
    );


  }catch(error){

    console.error(
      error
    );


    count.textContent =
      "加载失败";


    grid.innerHTML = `

      <div class="loading">

        <h3>
          女士资料无法加载
        </h3>

        <p>
          ${escapeHtml(
            error.message
          )}
        </p>

      </div>

    `;

  }

}


/* ==================================================
   城市筛选
================================================== */

function createCityFilter(){

  const select =
    document.getElementById(
      "cityFilter"
    );


  const currentValue =
    select.value;


  const cities = [

    ...new Set(

      women

        .map(
          woman =>
            woman.city
        )

        .filter(
          city =>
            city &&
            String(city).trim()
        )

    )

  ];


  select.innerHTML = `

    <option value="">
      全部城市
    </option>

  `;


  cities.forEach(
    city => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        city;


      option.textContent =
        city;


      select.appendChild(
        option
      );

    }
  );


  if(
    cities.includes(
      currentValue
    )
  ){

    select.value =
      currentValue;

  }

}


/* ==================================================

================================================== */

function renderWomen(list){

  const grid =
    document.getElementById(
      "womenGrid"
    );

    !list ||
    list.length === 0
  ){

    grid.innerHTML = `

      <div class="loading">

        <h3>
          暂时没有女士资料
        </h3>

        <p>
          当前没有符合条件的资料。
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    "";


  list.forEach(
    (woman,index) => {


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "woman-card";


      const photos =
        getPhotos(
          woman
        );


      const videos =
        getVideos(
          woman
        );


      const allMedia =
        getAllMedia(
          woman
        );


      const firstPhoto =

        photos.length > 0

        ?

        photos[0]

        :

        getDefaultImage();


      let mediaBadge = "";


      if(
        allMedia.length > 1
      ){

        mediaBadge = `

          <div class="media-badge">

            📷
            ${allMedia.length}

          </div>

        `;

      }


      let videoBadge = "";


      if(
        videos.length > 0
      ){

        videoBadge = `

          <div class="video-badge">

            ▶ 有视频

          </div>

        `;

      }


      card.innerHTML = `

        <div class="woman-image">

          <img
            src="${escapeHtml(
              firstPhoto
            )}"
            alt="${escapeHtml(
              woman.name ||
              "女士"
            )}"
            loading="lazy"
          >

          ${mediaBadge}

          ${videoBadge}

        </div>


        <div class="woman-info">

          <h2>

            ${escapeHtml(
              woman.name ||
              "未填写姓名"
            )}

            ${
              woman.age
              ?

              " · " +
              escapeHtml(
                woman.age
              ) +
              "岁"

              :

              ""
            }

          </h2>


          ${
            woman.city

            ?

            `

              <p class="city">

                ${escapeHtml(
                  woman.city
                )}

              </p>

            `

            :

            ""
          }


          ${
            woman.occupation

            ?

            `

              <p>

                ${escapeHtml(
                  woman.occupation
                )}

              </p>

            `

            :

            ""
          }


          ${
            woman.description

            ?

            `

              <p class="description">

                ${escapeHtml(
                  woman.description
                )}

              </p>

            `

            :

            ""
          }


          <div class="view-profile">

            查看资料

            <span>
              →
            </span>

          </div>

        </div>

      `;


      const image =
        card.querySelector(
          "img"
        );


      image.addEventListener(
        "error",
        function(){

          this.src =
            getDefaultImage();

        }
      );


      /*
        点击整个卡片
      */

      card.addEventListener(
        "click",
        function(){

          openViewer(
            woman
          );

        }
      );


      grid.appendChild(
        card
      );

    }
  );

}


/* ==================================================
   打开资料查看器
================================================== */

function openViewer(
  woman
){

  currentViewerWoman =
    woman;


  currentMedia =
    getAllMedia(
      woman
    );


  /*
    如果没有媒体，
    也创建一个默认图片
  */

  if(
    currentMedia.length === 0
  ){

    currentMedia = [

      {

        type:"image",

        url:
          getDefaultImage()

      }

    ];

  }


  currentMediaIndex =
    0;


  /*
    标题
  */

  document
    .getElementById(
      "viewerName"
    )
    .textContent =

    (
      woman.name ||
      "女士"
    ) +

    (
      woman.age
      ?
      " · " +
      woman.age +
      "岁"
      :
      ""
    );


  const infoParts = [];


  if(woman.city){

    infoParts.push(
      woman.city
    );

  }


  if(woman.occupation){

    infoParts.push(
      woman.occupation
    );

  }


  document
    .getElementById(
      "viewerInfo"
    )
    .textContent =

    infoParts.join(
      " · "
    );


  /*
    创建媒体
  */

  renderViewerMedia();


  /*
    联系按钮
  */

  const whatsappButton =
    document.getElementById(
      "viewerWhatsapp"
    );


  const telegramButton =
    document.getElementById(
      "viewerTelegram"
    );


  whatsappButton.style.display =
    woman.whatsapp
    ?
    "block"
    :
    "none";


  telegramButton.style.display =
    woman.telegram
    ?
    "block"
    :
    "none";


  /*
    打开
  */

  const viewer =
    document.getElementById(
      "profileViewer"
    );


  viewer.classList.remove(
    "hidden"
  );


  viewer.classList.add(
    "first-open"
  );


  document.body.classList.add(
    "viewer-open"
  );


  /*
    3秒后隐藏提示
  */

  setTimeout(
    () => {

      viewer.classList.remove(
        "first-open"
      );

    },
    3000
  );

}


/* ==================================================
   创建 Viewer 媒体
================================================== */

function renderViewerMedia(){

  const track =
    document.getElementById(
      "viewerTrack"
    );


  track.innerHTML =
    "";


  currentMedia.forEach(
    (media,index) => {

      const slide =
        document.createElement(
          "div"
        );


      slide.className =
        "viewer-slide";


      if(
        media.type === "video"
      ){

        slide.innerHTML = `

          <video
            controls
            playsinline
            preload="metadata"
          >

            <source
              src="${escapeHtml(
                media.url
              )}"
            >

            您的浏览器不支持视频播放。

          </video>

        `;

      }else{

        slide.innerHTML = `

          <img
            src="${escapeHtml(
              media.url
            )}"
            alt="资料照片"
            draggable="false"
          >

        `;

      }


      track.appendChild(
        slide
      );

    }
  );


  /*
    图片加载失败处理
  */

  track
    .querySelectorAll(
      "img"
    )
    .forEach(
      img => {

        img.addEventListener(
          "error",
          function(){

            this.src =
              getDefaultImage();

          }
        );

      }
    );


  /*
    当前定位到第一张
  */

  requestAnimationFrame(
    () => {

      scrollViewerTo(
        0,
        false
      );

    }
  );


  updateViewerCounter();

}


/* ==================================================
   滑动到指定媒体
================================================== */

function scrollViewerTo(
  index,
  smooth=true
){

  if(
    !currentMedia.length
  ){

    return;

  }


  index =
    Math.max(
      0,
      Math.min(
        index,
        currentMedia.length - 1
      )
    );


  currentMediaIndex =
    index;


  const track =
    document.getElementById(
      "viewerTrack"
    );


  const width =
    track.clientWidth;


  track.scrollTo({

    left:
      width * index,

    behavior:
      smooth
      ?
      "smooth"
      :
      "auto"

  });


  updateViewerCounter();

}


/* ==================================================
   上一张
================================================== */

function previousMedia(){

  if(
    currentMediaIndex <= 0
  ){

    return;

  }


  scrollViewerTo(
    currentMediaIndex - 1
  );

}


/* ==================================================
   下一张
================================================== */

function nextMedia(){

  if(
    currentMediaIndex >=
    currentMedia.length - 1
  ){

    return;

  }


  scrollViewerTo(
    currentMediaIndex + 1
  );

}


/* ==================================================
   Counter
================================================== */

function updateViewerCounter(){

  const counter =
    document.getElementById(
      "viewerCounter"
    );


  counter.textContent =

    (
      currentMediaIndex + 1
    ) +

    " / " +

    currentMedia.length;

}


/* ==================================================
   监听手动左右滑动
================================================== */

let scrollTimer = null;


document
  .getElementById(
    "viewerTrack"
  )
  .addEventListener(
    "scroll",
    function(){

      clearTimeout(
        scrollTimer
      );


      scrollTimer =
        setTimeout(
          () => {

            const width =
              this.clientWidth;


            if(!width){

              return;

            }


            let index =
              Math.round(
                this.scrollLeft /
                width
              );


            index =
              Math.max(
                0,
                Math.min(
                  index,
                  currentMedia.length - 1
                )
              );


            currentMediaIndex =
              index;


            updateViewerCounter();


            /*
              如果滑到了视频，
              其他视频暂停
            */

            this
              .querySelectorAll(
                "video"
              )
              .forEach(
                (video,videoIndex) => {

                  /*
                    找到这个 video 所属 slide
                  */

                  const slide =
                    video.closest(
                      ".viewer-slide"
                    );


                  if(!slide){

                    return;

                  }


                  const slides =
                    Array.from(
                      this.children
                    );


                  const slideIndex =
                    slides.indexOf(
                      slide
                    );


                  if(
                    slideIndex !==
                    currentMediaIndex
                  ){

                    video.pause();

                  }

                }
              );

          },
          80
        );

    }
  );


/* ==================================================
   关闭 Viewer
================================================== */

function closeViewer(){

  const viewer =
    document.getElementById(
      "profileViewer"
    );


  /*
    暂停视频
  */

  viewer
    .querySelectorAll(
      "video"
    )
    .forEach(
      video => {

        video.pause();

      }
    );


  viewer.classList.add(
    "hidden"
  );


  document.body.classList.remove(
    "viewer-open"
  );


  currentViewerWoman =
    null;

}


document
  .getElementById(
    "closeViewer"
  )
  .addEventListener(
    "click",
    closeViewer
  );


/* ==================================================
   点击黑色背景关闭
================================================== */

document
  .getElementById(
    "profileViewer"
  )
  .addEventListener(
    "click",
    function(event){

      /*
        只有点击最外层背景才关闭

        点击图片 / 视频 / 按钮
        不关闭
      */

      if(
        event.target === this
      ){

        closeViewer();

      }

    }
  );


/* ==================================================
   左右按钮
================================================== */

document
  .getElementById(
    "prevMedia"
  )
  .addEventListener(
    "click",
    previousMedia
  );


document
  .getElementById(
    "nextMedia"
  )
  .addEventListener(
    "click",
    nextMedia
  );


/* ==================================================
   键盘
================================================== */

document.addEventListener(
  "keydown",
  function(event){

    const viewer =
      document.getElementById(
        "profileViewer"
      );


    if(
      viewer.classList.contains(
        "hidden"
      )
    ){

      return;

    }


    if(
      event.key ===
      "Escape"
    ){

      closeViewer();

      return;

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      previousMedia();

      return;

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      nextMedia();

      return;

    }

  }
);


/* ==================================================
   WhatsApp
================================================== */

function openWhatsApp(
  phone
){

  let number =
    String(
      phone || ""
    )

    .trim()

    .replace(
      /[^\d]/g,
      ""
    );


  if(!number){

    alert(
      "WhatsApp 联系方式无效"
    );

    return;

  }


  window.location.href =
    "https://wa.me/" +
    number;

}


/* ==================================================
   Telegram
================================================== */

function openTelegram(
  username
){

  let value =
    String(
      username || ""
    )

    .trim();


  if(
    value.startsWith(
      "https://t.me/"
    ) ||

    value.startsWith(
      "http://t.me/"
    )
  ){

    window.location.href =
      value;

    return;

  }


  value =
    value.replace(
      /^@/,
      ""
    );


  if(!value){

    alert(
      "Telegram 联系方式无效"
    );

    return;

  }


  window.location.href =
    "https://t.me/" +
    value;

}

/* ==================================================
   筛选
================================================== */

function filterWomen(){

  const city =
    document.getElementById(
      "cityFilter"
    ).value;


  const age =
    document.getElementById(
      "ageFilter"
    ).value;


  const filtered =
    women.filter(
      woman => {


        /*
          城市
        */

        if(
          city &&
          woman.city !== city
        ){

          return false;

        }


        /*
          年龄
        */

        const womanAge =
          Number(
            woman.age
          );


        if(
          age === "18-25"
        ){

          return (

            womanAge >= 18 &&

            womanAge <= 25

          );

        }


        if(
          age === "26-35"
        ){

          return (

            womanAge >= 26 &&

            womanAge <= 35

          );

        }


        if(
          age === "36-45"
        ){

          return (

            womanAge >= 36 &&

            womanAge <= 45

          );

        }


        if(
          age === "46+"
        ){

          return womanAge >= 46;

        }


        return true;

      }
    );


  renderWomen(
    filtered
  );

}

   筛选事件
================================================== */

document
  .getElementById(

  )
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById(
    "ageFilter"
  )
