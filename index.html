<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分·相遇</title>

<meta
  name="description"
  content="认真认识一个人，从一次相遇开始。"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background:#f7f1f3;

  color:#30272a;

  line-height:1.6;

  overflow-x:hidden;

}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================================================
   全首页动态恋爱氛围层
========================================================= */

#romanceCanvas{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  z-index:1;

  pointer-events:none;

  overflow:hidden;

  opacity:.95;

}


/* =========================================================
   动态背景光晕
========================================================= */

.romance-glow{

  position:fixed;

  inset:0;

  z-index:0;

  pointer-events:none;

  overflow:hidden;

  background:

    radial-gradient(
      circle at 12% 18%,
      rgba(211,126,151,.11),
      transparent 24%
    ),

    radial-gradient(
      circle at 88% 24%,
      rgba(236,181,139,.10),
      transparent 25%
    ),

    radial-gradient(
      circle at 50% 65%,
      rgba(177,103,128,.07),
      transparent 30%
    ),

    radial-gradient(
      circle at 15% 88%,
      rgba(236,183,143,.08),
      transparent 23%
    );

}


/* 第一层呼吸光 */

.romance-glow::before{

  content:"";

  position:absolute;

  width:480px;

  height:480px;

  left:-180px;

  top:15%;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      rgba(224,133,158,.17) 0%,
      rgba(224,133,158,.06) 35%,
      transparent 70%
    );

  filter:blur(35px);

  animation:
    glowFloatOne 14s ease-in-out infinite;

}


/* 第二层呼吸光 */

.romance-glow::after{

  content:"";

  position:absolute;

  width:520px;

  height:520px;

  right:-220px;

  top:48%;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      rgba(229,178,138,.15) 0%,
      rgba(229,178,138,.05) 38%,
      transparent 72%
    );

  filter:blur(40px);

  animation:
    glowFloatTwo 18s ease-in-out infinite;

}


@keyframes glowFloatOne{

  0%{

    transform:
      translate3d(0,0,0)
      scale(.9);

    opacity:.45;

  }

  50%{

    transform:
      translate3d(180px,80px,0)
      scale(1.18);

    opacity:1;

  }

  100%{

    transform:
      translate3d(0,0,0)
      scale(.9);

    opacity:.45;

  }

}


@keyframes glowFloatTwo{

  0%{

    transform:
      translate3d(0,0,0)
      scale(1);

    opacity:.4;

  }

  50%{

    transform:
      translate3d(-160px,-100px,0)
      scale(1.22);

    opacity:.9;

  }

  100%{

    transform:
      translate3d(0,0,0)
      scale(1);

    opacity:.4;

  }

}


/* =========================================================
   HEADER
========================================================= */

.site-header{

  height:72px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 6%;

  position:sticky;

  top:0;

  z-index:100;

  color:#fff;

  background:

    linear-gradient(
      90deg,
      rgba(27,18,22,.98),
      rgba(52,31,38,.96)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.15);

}

.brand{

  font-size:22px;

  font-weight:700;

  letter-spacing:2px;

  color:#fff;

}

.brand span{

  color:#df9faf;

  margin:0 4px;

}

.admin-link{

  padding:8px 17px;

  border:
    1px solid
    rgba(255,255,255,.25);

  border-radius:22px;

  font-size:13px;

  color:
    rgba(255,255,255,.85);

  background:
    rgba(255,255,255,.06);

  transition:.25s ease;

}

.admin-link:hover{

  background:#fff;

  color:#30272a;

}


/* =========================================================
   HERO
========================================================= */

.hero{

  min-height:610px;

  display:flex;

  align-items:center;

  position:relative;

  z-index:2;

  padding:90px 8%;

  overflow:hidden;

  color:#fff;

  background-image:

    linear-gradient(
      90deg,
      rgba(20,13,17,.88) 0%,
      rgba(28,18,22,.70) 38%,
      rgba(30,20,24,.42) 70%,
      rgba(20,14,18,.28) 100%
    ),

    url("https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png");

  background-size:cover;

  background-position:center;

  isolation:isolate;

}


/* Hero 内部香槟光 */

.hero::before{

  content:"";

  position:absolute;

  width:520px;

  height:520px;

  left:-200px;

  bottom:-270px;

  border-radius:50%;

  background:
    rgba(213,128,151,.20);

  filter:blur(105px);

  pointer-events:none;

  animation:
    heroGlow 12s ease-in-out infinite;

}


/* Hero 右上光 */

.hero::after{

  content:"";

  position:absolute;

  width:430px;

  height:430px;

  right:-170px;

  top:-170px;

  border-radius:50%;

  background:
    rgba(239,179,155,.14);

  filter:blur(100px);

  pointer-events:none;

  animation:
    heroGlow 15s ease-in-out infinite reverse;

}


@keyframes heroGlow{

  0%,
  100%{

    transform:scale(.9);

    opacity:.45;

  }

  50%{

    transform:scale(1.25);

    opacity:1;

  }

}


.hero > div{

  max-width:720px;

  position:relative;

  z-index:5;

}

.eyebrow{

  font-size:12px;

  letter-spacing:5px;

  color:#e8a8b8;

  margin-bottom:20px;

  font-weight:600;

}

.hero h1{

  font-size:
    clamp(40px,6vw,76px);

  line-height:1.16;

  font-weight:600;

  letter-spacing:1px;

  margin-bottom:26px;

  text-shadow:
    0 4px 25px
    rgba(0,0,0,.28);

}

.hero p:not(.eyebrow){

  color:
    rgba(255,255,255,.84);

  font-size:17px;

  max-width:550px;

  line-height:1.9;

}

.hero-label{

  margin-top:35px;

  display:flex;

  align-items:center;

  gap:12px;

  color:
    rgba(255,255,255,.62);

  font-size:13px;

}

.hero-label::before{

  content:"";

  width:34px;

  height:1px;

  background:#d99cac;

}


/* =========================================================
   内容区
========================================================= */

.content-section{

  position:relative;

  z-index:2;

  overflow:hidden;

  padding-top:1px;

  background:

    radial-gradient(
      circle at 5% 8%,
      rgba(215,153,167,.16),
      transparent 27%
    ),

    radial-gradient(
      circle at 94% 30%,
      rgba(220,180,160,.13),
      transparent 28%
    ),

    radial-gradient(
      circle at 50% 90%,
      rgba(201,142,159,.08),
      transparent 32%
    ),

    linear-gradient(
      180deg,
      rgba(248,242,244,.94) 0%,
      rgba(247,240,242,.94) 55%,
      rgba(244,233,237,.96) 100%
    );

}


/* =========================================================
   新增：高级恋爱动态横幅
========================================================= */

.romantic-banner{

  width:88%;

  max-width:1400px;

  min-height:235px;

  margin:42px auto 35px;

  position:relative;

  z-index:3;

  overflow:hidden;

  border-radius:24px;

  border:
    1px solid
    rgba(255,255,255,.22);

  background:

    linear-gradient(
      115deg,
      rgba(36,20,27,.96),
      rgba(75,42,51,.92),
      rgba(50,29,35,.94)
    );

  box-shadow:

    0 25px 70px
    rgba(57,31,40,.18),

    inset 0 1px 0
    rgba(255,255,255,.10);

  isolation:isolate;

}


/* Banner 背景光 */

.romantic-banner::before{

  content:"";

  position:absolute;

  width:480px;

  height:480px;

  left:-180px;

  top:-280px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      rgba(225,144,164,.40),
      rgba(225,144,164,.05) 50%,
      transparent 72%
    );

  filter:blur(18px);

  animation:
    bannerLight 10s ease-in-out infinite;

}


/* Banner 香槟光 */

.romantic-banner::after{

  content:"";

  position:absolute;

  width:500px;

  height:500px;

  right:-220px;

  bottom:-330px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      rgba(232,190,146,.34),
      rgba(232,190,146,.05) 50%,
      transparent 73%
    );

  filter:blur(18px);

  animation:
    bannerLightTwo 13s ease-in-out infinite;

}


@keyframes bannerLight{

  0%,
  100%{

    transform:
      translate3d(0,0,0)
      scale(.9);

    opacity:.5;

  }

  50%{

    transform:
      translate3d(160px,90px,0)
      scale(1.25);

    opacity:1;

  }

}


@keyframes bannerLightTwo{

  0%,
  100%{

    transform:
      translate3d(0,0,0)
      scale(1);

    opacity:.45;

  }

  50%{

    transform:
      translate3d(-140px,-90px,0)
      scale(1.2);

    opacity:.9;

  }

}


.romantic-banner-content{

  min-height:235px;

  position:relative;

  z-index:5;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  text-align:center;

  padding:30px;

}


.romantic-mini{

  font-size:10px;

  letter-spacing:6px;

  color:#e8bd9f;

  margin-bottom:8px;

  opacity:.9;

}


.romantic-banner h2{

  color:#fff;

  font-family:

    Georgia,

    "Times New Roman",

    serif;

  font-weight:400;

  font-size:
    clamp(28px,4vw,47px);

  letter-spacing:2px;

  line-height:1.25;

  text-shadow:
    0 5px 30px
    rgba(0,0,0,.35);

}


.romantic-banner h2 span{

  color:#e6aabd;

}


.romantic-subtitle{

  margin-top:10px;

  color:
    rgba(255,255,255,.73);

  font-size:14px;

  letter-spacing:2px;

}


.romantic-line{

  width:100px;

  height:1px;

  margin-top:19px;

  position:relative;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(230,176,145,.85),
      transparent
    );

}


.romantic-heart{

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  color:#e6a8ba;

  font-size:14px;

  background:#4c2b35;

  padding:0 8px;

}


/* Banner 四角装饰 */

.banner-corner{

  position:absolute;

  width:70px;

  height:70px;

  border-color:
    rgba(233,185,160,.32);

  border-style:solid;

  z-index:4;

}


.banner-corner.left-top{

  left:18px;

  top:18px;

  border-width:1px 0 0 1px;

  border-radius:15px 0 0 0;

}


.banner-corner.right-top{

  right:18px;

  top:18px;

  border-width:1px 1px 0 0;

  border-radius:0 15px 0 0;

}


.banner-corner.left-bottom{

  left:18px;

  bottom:18px;

  border-width:0 0 1px 1px;

  border-radius:0 0 0 15px;

}


.banner-corner.right-bottom{

  right:18px;

  bottom:18px;

  border-width:0 1px 1px 0;

  border-radius:0 0 15px 0;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  width:88%;

  max-width:1400px;

  margin:35px auto 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  flex-wrap:wrap;

  position:relative;

  z-index:4;

}

.section-title{

  color:#392c30;

}

.section-title small{

  display:block;

  font-size:11px;

  letter-spacing:4px;

  color:#b97889;

  margin-bottom:4px;

}

.section-title h2{

  font-size:27px;

  font-weight:600;

}

.filters{

  display:flex;

  gap:10px;

}

.filters select{

  appearance:none;

  border:
    1px solid
    #e1d2d7;

  background:
    rgba(255,255,255,.82);

  padding:
    11px 40px 11px 15px;

  border-radius:10px;

  color:#4b4043;

  cursor:pointer;

  outline:none;

  box-shadow:
    0 5px 20px
    rgba(72,42,50,.05);

}

.filters select:focus{

  border-color:#c58a9a;

}


/* =========================================================
   GRID
========================================================= */

.women-grid{

  width:88%;

  max-width:1400px;

  margin:
    0 auto 85px;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:24px;

  position:relative;

  z-index:4;

}


/* =========================================================
   CARD
========================================================= */

.woman-card{

  background:
    rgba(255,255,255,.92);

  border-radius:16px;

  overflow:hidden;

  border:
    1px solid
    rgba(219,201,205,.85);

  transition:
    transform .3s ease,
    box-shadow .3s ease;

  cursor:pointer;

  box-shadow:
    0 8px 30px
    rgba(58,37,43,.07);

  backdrop-filter:
    blur(5px);

}

.woman-card:hover{

  transform:
    translateY(-6px);

  box-shadow:
    0 20px 50px
    rgba(63,38,47,.15);

}


/* =========================================================
   IMAGE
========================================================= */

.woman-image{

  width:100%;

  aspect-ratio:3 / 4;

  background:#eee5e8;

  overflow:hidden;

  position:relative;

}

.woman-image::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      transparent 52%,
      rgba(30,20,24,.12)
    );

}

.woman-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:
    transform .6s ease;

}

.woman-card:hover
.woman-image img{

  transform:
    scale(1.045);

}


/* =========================================================
   INFO
========================================================= */

.woman-info{

  padding:
    18px 18px 20px;

}

.woman-info h2{

  font-size:20px;

  font-weight:600;

  color:#332a2d;

  margin-bottom:5px;

}

.city{

  color:#b77b8b;

  font-size:13px;

  margin-bottom:7px;

}

.woman-info p{

  color:#827579;

  font-size:13px;

}

.description{

  margin-top:8px;

  line-height:1.7;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;

}


/* =========================================================
   MORE CARD
========================================================= */

.more-card{

  position:relative;

  min-height:100%;

  overflow:hidden;

  border-radius:16px;

  cursor:pointer;

  background:#281c21;

  min-height:400px;

  box-shadow:
    0 10px 35px
    rgba(58,34,42,.14);

}

.more-card-bg{

  position:absolute;

  inset:0;

  background-image:

    linear-gradient(
      rgba(30,17,22,.20),
      rgba(27,16,21,.84)
    ),

    url("https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png");

  background-size:cover;

  background-position:center;

  transition:
    transform .6s ease;

}

.more-card:hover
.more-card-bg{

  transform:
    scale(1.05);

}

.more-card-content{

  position:relative;

  z-index:2;

  min-height:100%;

  padding:30px;

  display:flex;

  flex-direction:column;

  justify-content:flex-end;

  color:#fff;

}

.more-card-content h2{

  font-size:26px;

  line-height:1.3;

  margin-bottom:12px;

}

.more-card-content p{

  color:
    rgba(255,255,255,.82);

  font-size:14px;

  line-height:1.8;

  margin-bottom:20px;

}

.join-button{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  padding:13px;

  background:#fff;

  color:#33282c;

  border-radius:10px;

  font-weight:600;

  transition:.25s ease;

}

.more-card:hover
.join-button{

  background:#f3dce2;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

  color:#9a898e;

}


/* =========================================================
   FOOTER
========================================================= */

footer{

  position:relative;

  z-index:2;

  overflow:hidden;

  isolation:isolate;

  text-align:center;

  padding:
    70px 20px 75px;

  color:
    rgba(255,255,255,.68);

  font-size:13px;

  background:

    radial-gradient(
      circle at 15% 20%,
      rgba(211,137,157,.25),
      transparent 32%
    ),

    radial-gradient(
      circle at 85% 70%,
      rgba(221,166,139,.20),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #24171c 0%,
      #352128 45%,
      #24171c 100%
    );

  border-top:
    1px solid
    rgba(255,255,255,.08);

}


footer::before{

  content:"";

  position:absolute;

  width:380px;

  height:380px;

  left:-180px;

  bottom:-260px;

  border-radius:50%;

  background:
    rgba(212,132,153,.18);

  filter:blur(80px);

  pointer-events:none;

  animation:
    footerGlow 11s ease-in-out infinite;

}


footer::after{

  content:"";

  position:absolute;

  width:320px;

  height:320px;

  right:-140px;

  top:-200px;

  border-radius:50%;

  background:
    rgba(224,174,145,.14);

  filter:blur(75px);

  pointer-events:none;

  animation:
    footerGlow 15s ease-in-out infinite reverse;

}


@keyframes footerGlow{

  0%,
  100%{

    transform:
      scale(.85);

    opacity:.4;

  }

  50%{

    transform:
      scale(1.25);

    opacity:1;

  }

}


footer span{

  position:relative;

  z-index:2;

}


/* =========================================================
   GALLERY
========================================================= */

.gallery-modal{

  position:fixed;

  inset:0;

  z-index:1000;

  background:
    rgba(15,10,13,.96);

  display:none;

  align-items:center;

  justify-content:center;

}

.gallery-modal.show{

  display:flex;

}

.gallery-container{

  width:100%;

  height:100%;

  display:flex;

  flex-direction:column;

  position:relative;

}

.gallery-header{

  height:65px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 20px;

  color:#fff;

  flex-shrink:0;

}

.gallery-title{

  font-size:17px;

  font-weight:600;

}

.gallery-close{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

  color:#fff;

  font-size:25px;

  cursor:pointer;

}

.gallery-body{

  flex:1;

  min-height:0;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  overflow:hidden;

}

.gallery-track{

  width:100%;

  height:100%;

  display:flex;

  overflow-x:auto;

  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;

}

.gallery-track::-webkit-scrollbar{

  display:none;

}

.gallery-slide{

  min-width:100%;

  height:100%;

  scroll-snap-align:center;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:10px 70px;

}

.gallery-slide img{

  max-width:100%;

  max-height:100%;

  object-fit:contain;

  border-radius:6px;

  user-select:none;

  -webkit-user-drag:none;

}

.gallery-slide video{

  max-width:100%;

  max-height:100%;

  width:auto;

  height:auto;

  background:#000;

  border-radius:6px;

}

.gallery-arrow{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:48px;

  height:48px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

  color:#fff;

  font-size:30px;

  cursor:pointer;

  z-index:5;

}

.gallery-prev{

  left:15px;

}

.gallery-next{

  right:15px;

}

.gallery-counter{

  height:55px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#aaa;

  font-size:13px;

}


/* =========================================================
   JOIN MODAL
========================================================= */

.join-modal{

  position:fixed;

  inset:0;

  z-index:1100;

/* =========================================================
   ROMANTIC CANVAS
   全首页：
   樱花 + 香槟粒子 + 心形 + 光点

const romanceCanvas =
  document.getElementById(
    "romanceCanvas"
  );


const romanceCtx =
  romanceCanvas.getContext(
    "2d"
  );


let romanceParticles = [];


let romanceWidth = 0;

let romanceHeight = 0;


let romanceDpr =
  Math.min(
    window.devicePixelRatio || 1,
    2
  );


function resizeRomanceCanvas(){

  romanceWidth =
    window.innerWidth;


  romanceHeight =
    window.innerHeight;


  romanceDpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  romanceCanvas.width =
    romanceWidth *
    romanceDpr;


  romanceCanvas.height =
    romanceHeight *
    romanceDpr;


  romanceCanvas.style.width =
    romanceWidth + "px";


  romanceCanvas.style.height =
    romanceHeight + "px";


  romanceCtx.setTransform(
    romanceDpr,
    0,
    0,
    romanceDpr,
    0,
    0
  );

}


resizeRomanceCanvas();


window.addEventListener(
  "resize",
  resizeRomanceCanvas
);



/* =========================================================
   PARTICLE CLASS
========================================================= */

class RomanceParticle{

  constructor(){

    this.reset(
      true
    );

  }


  reset(initial){

    this.type =
      this.randomType();


    this.x =
      Math.random() *
      romanceWidth;


    this.y =
      initial

        ?

        Math.random() *
        romanceHeight

        :

        -30;


    this.size =

      this.type === "petal"

        ?

        5 +
        Math.random() * 8

        :

      this.type === "heart"

        ?

        6 +
        Math.random() * 9

        :

        1 +
        Math.random() * 3;


    this.speedY =

      this.type === "petal"

        ?

        .25 +
        Math.random() * .65

        :

      this.type === "heart"

        ?

        .15 +
        Math.random() * .35

        :

        .08 +
        Math.random() * .30;


    this.speedX =

      -.25 +
      Math.random() * .5;


    this.rotation =
      Math.random() *
      Math.PI *
      2;


    this.rotationSpeed =

      -.012 +
      Math.random() *
      .024;


    this.wave =
      Math.random() *
      Math.PI *
      2;


    this.waveSpeed =

      .008 +
      Math.random() *
      .018;


    this.opacity =

      .12 +
      Math.random() *
      .50;


    this.life =
      Math.random() *
      Math.PI *
      2;


    this.lifeSpeed =

      .008 +
      Math.random() *
      .015;

  }


  randomType(){

    const value =
      Math.random();


    if(
      value < .47
    ){

      return "petal";

    }


    if(
      value < .67
    ){

      return "heart";

    }


    if(
      value < .86
    ){

      return "champagne";

    }


    return "sparkle";

  }


  update(){

    this.y +=
      this.speedY;


    this.wave +=
      this.waveSpeed;


    this.x +=

      this.speedX +

      Math.sin(
        this.wave
      ) *
      .22;


    this.rotation +=
      this.rotationSpeed;


    this.life +=
      this.lifeSpeed;


    if(
      this.y >
      romanceHeight + 40
    ){

      this.reset(
        false
      );

    }


    if(
      this.x <
      -50
    ){

      this.x =
        romanceWidth + 20;

    }


    if(
      this.x >
      romanceWidth + 50
    ){

      this.x =
        -20;

    }

  }


  draw(){

    const ctx =
      romanceCtx;


    let pulse =

      .72 +

      Math.sin(
        this.life
      ) *
      .28;


    ctx.save();


    ctx.translate(
      this.x,
      this.y
    );


    ctx.rotate(
      this.rotation
    );


    ctx.globalAlpha =
      this.opacity *
      pulse;


    /* =====================================================
       樱花花瓣
    ===================================================== */

    if(
      this.type === "petal"
    ){

      ctx.beginPath();


      ctx.moveTo(
        0,
        -this.size
      );


      ctx.bezierCurveTo(

        this.size * 1.4,
        -this.size * .7,

        this.size * 1.25,
        this.size * .9,

        0,
        this.size

      );


      ctx.bezierCurveTo(

        -this.size * 1.25,
        this.size * .9,

        -this.size * 1.4,
        -this.size * .7,

        0,
        -this.size

      );


      ctx.closePath();


      const gradient =
        ctx.createLinearGradient(
          0,
          -this.size,
          0,
          this.size
        );


      gradient.addColorStop(
        0,
        "rgba(255,220,228,.85)"
      );


      gradient.addColorStop(
        .55,
        "rgba(232,153,176,.62)"
      );


      gradient.addColorStop(
        1,
        "rgba(194,111,138,.32)"
      );


      ctx.fillStyle =
        gradient;


      ctx.fill();

    }


    /* =====================================================
       心形
    ===================================================== */

    else if(
      this.type === "heart"
    ){

      const s =
        this.size;


      ctx.beginPath();


      ctx.moveTo(
        0,
        s * .9
      );


      ctx.bezierCurveTo(
        -s * 1.7,
        -s * .1,
        -s * .9,
        -s * 1.5,
        0,
        -s * .65
      );


      ctx.bezierCurveTo(
        s * .9,
        -s * 1.5,
        s * 1.7,
        -s * .1,
        0,
        s * .9
      );


      ctx.closePath();


      ctx.fillStyle =
        "rgba(224,137,163,.65)";


      ctx.shadowBlur =
        15;


      ctx.shadowColor =
        "rgba(227,148,173,.65)";


      ctx.fill();

    }


    /* =====================================================
       香槟粒子
    ===================================================== */

    else if(
      this.type === "champagne"
    ){

      const gradient =
        ctx.createRadialGradient(
          0,
          0,
          0,
          0,
          0,
          this.size * 4
        );


      gradient.addColorStop(
        0,
        "rgba(255,224,178,.95)"
      );


      gradient.addColorStop(
        .25,
        "rgba(245,201,155,.62)"
      );


      gradient.addColorStop(
        1,
        "rgba(245,201,155,0)"
      );


      ctx.fillStyle =
        gradient;


      ctx.beginPath();


      ctx.arc(
        0,
        0,
        this.size * 4,
        0,
        Math.PI * 2
      );


      ctx.fill();

    }


    /* =====================================================
       星光
    ===================================================== */

    else{

      ctx.strokeStyle =
        "rgba(255,222,184,.78)";


      ctx.lineWidth =
        1;


      const length =
        this.size * 4;


      ctx.beginPath();


      ctx.moveTo(
        -length,
        0
      );


      ctx.lineTo(
        length,
        0
      );


      ctx.moveTo(
        0,
        -length
      );


      ctx.lineTo(
        0,
        length
      );


      ctx.stroke();

    }


    ctx.restore();

  }

}



/* =========================================================

========================================================= */

function createRomanceParticles(){

  romanceParticles = [];

  romanceParticles.forEach(

      particle.draw();

    }
  );

}

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* =========================================================
   MEDIA
========================================================= */

function normalizeMedia(value){

  if(!value){

    return [];

  }


  if(Array.isArray(value)){

    return value

      .flat(Infinity)

      .filter(Boolean)

      .map(v =>
        String(v).trim()
      )

      .filter(Boolean);

  }


  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){

      return [];

    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed

          .flat(Infinity)

          .filter(Boolean)

          .map(v =>
            String(v).trim()
          )

          .filter(Boolean);

      }

    }catch(e){}


    if(text.includes(",")){

      return text

        .split(",")

        .map(v =>
          v.trim()
        )

        .filter(Boolean);

    }


    return [text];

  }


  return [];

}



/* =========================================================
   STORAGE
========================================================= */

function getStorageUrl(path){

  if(!path){

    return "";

  }


  const value =
    String(path).trim();


  if(

    value.startsWith("http://") ||

    value.startsWith("https://") ||

    value.startsWith("data:")

  ){

    return value;

  }


  return (

    SUPABASE_URL +

    "/storage/v1/object/public/" +

    STORAGE_BUCKET +

    "/" +

    value.replace(/^\/+/,"")

  );

}

  photos =

    );


  return [

    ...new Set(

      photos

        .filter(Boolean)

        .map(
          getStorageUrl

    )

  ];

}

/* =========================================================
   GALLERY
========================================================= */

let galleryMedia = [];

let galleryIndex = 0;



function openGallery(woman){

  const photos =
    getPhotos(
      woman
    );


  const videos =
    getVideos(
      woman
    );


  galleryMedia = [];


  photos.forEach(

    url => {

      galleryMedia.push({

        type:"image",

        url

      });

    }

  );


  videos.forEach(

    url => {

      galleryMedia.push({

        type:"video",

        url

      });

    }

  );


  if(
    galleryMedia.length === 0
  ){

    return;

  }


  galleryIndex = 0;


  document
    .getElementById(
      "galleryTitle"
    )
    .textContent =

    woman.name ||
    "女士资料";


  renderGallery();


  document
    .getElementById(
      "galleryModal"
    )
    .classList.add(
      "show"
    );


  document.body.style.overflow =
    "hidden";

}



function renderGallery(){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.innerHTML = "";


  galleryMedia.forEach(

    media => {

      const slide =
        document.createElement(
          "div"
        );


      slide.className =
        "gallery-slide";


      if(
        media.type === "image"
      ){

        slide.innerHTML = `

          <img

            src="${escapeHtml(
              media.url
            )}"

            draggable="false"

          >

        `;

      }else{

        slide.innerHTML = `

          <video

            controls

            playsinline

            preload="metadata"

          >

            <source
              src="${escapeHtml(
                media.url
              )}"
            >

          </video>

        `;

      }


      track.appendChild(
        slide
      );

    }

  );


  updateGalleryCounter();


  requestAnimationFrame(

    () => {

      const width =
        track.clientWidth;


      track.scrollLeft =
        width *
        galleryIndex;

    }

  );

}



function updateGalleryCounter(){

  const counter =
    document.getElementById(
      "galleryCounter"
    );


  if(
    galleryMedia.length
  ){

    counter.textContent =

      `${galleryIndex + 1} / ${galleryMedia.length}  ·  左右滑动查看`;

  }

}



function galleryGoTo(index){

  if(
    !galleryMedia.length
  ){

    return;

  }


  if(index < 0){

    index =
      galleryMedia.length - 1;

  }


  if(
    index >=
    galleryMedia.length
  ){

    index = 0;

  }


  galleryIndex =
    index;


  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.scrollTo({

    left:
      track.clientWidth *
      galleryIndex,

    behavior:"smooth"

  });


  updateGalleryCounter();

}



/* =========================================================
   GALLERY SCROLL
========================================================= */

document
  .getElementById(
    "galleryTrack"
  )
  .addEventListener(

    "scroll",

    function(){

      const width =
        this.clientWidth;


      if(!width){

        return;

      }


      const index =

        Math.round(

          this.scrollLeft /
          width

        );


      if(
        index !==
        galleryIndex
      ){

        galleryIndex =
          index;


        updateGalleryCounter();

      }

    }

  );



document
  .getElementById(
    "galleryPrev"
  )
  .addEventListener(

    "click",

    () => {

      galleryGoTo(
        galleryIndex - 1
      );

    }

  );


document
  .getElementById(
    "galleryNext"
  )
  .addEventListener(

    "click",

    () => {

      galleryGoTo(
        galleryIndex + 1
      );

    }

  );


document
  .getElementById(
    "galleryClose"
  )
  .addEventListener(

    "click",

    closeGallery

  );



function closeGallery(){

  document
    .getElementById(
      "galleryModal"
    )
    .classList.remove(
      "show"
    );


  document.body.style.overflow =
    "";


  document
    .querySelectorAll(
      "#galleryTrack video"
    )
    .forEach(

      video =>
        video.pause()

    );

}



/* =========================================================
   ESC
========================================================= */

document.addEventListener(

  "keydown",

  event => {

    if(
      event.key === "Escape"
    ){

      closeGallery();

      closeJoinModal();

    }


    if(

      document
        .getElementById(
          "galleryModal"
        )
        .classList
        .contains("show")

    ){

      if(
        event.key === "ArrowLeft"
      ){

        galleryGoTo(
          galleryIndex - 1
        );

      }


      if(
        event.key === "ArrowRight"
      ){

        galleryGoTo(
          galleryIndex + 1
        );

      }

    }

  }

);



/* =========================================================
   JOIN CONTACT
========================================================= */

async function loadJoinContact(){

  try{

    const url =

      SUPABASE_URL +

      "/rest/v1/site_settings" +

      "?select=whatsapp,telegram" +

      "&setting_key=eq.join_contact" +

      "&limit=1";


    const response =
      await fetch(

        url,

        {

          headers:{

            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    if(
      data.length
    ){

      joinContact =
        data[0];

    }


  }catch(error){

    console.error(
      "联系方式加载失败:",
      error
    );

  }

}



/* =========================================================
   WHATSAPP
========================================================= */

function makeWhatsAppUrl(value){

  const number =

    String(
      value || ""
    )

    .replace(
      /[^\d]/g,
      ""
    );


  if(!number){

    return "";

  }


  return (
    "https://wa.me/" +
    number
  );

}



/* =========================================================
   TELEGRAM
========================================================= */

function makeTelegramUrl(value){

  let username =

    String(
      value || ""
    )

    .trim();


  if(!username){

    return "";

  }


  if(

    username.startsWith(
      "https://t.me/"
    )

    ||

    username.startsWith(
      "http://t.me/"
    )

  ){

    return username;

  }


  username =
    username.replace(
      /^@/,
      ""
    );


  return (
    "https://t.me/" +
    username
  );

}



/* =========================================================
   JOIN MODAL
========================================================= */

function openJoinModal(){

  const box =
    document.getElementById(
      "joinContacts"
    );


  box.innerHTML = "";


  const whatsappUrl =
    makeWhatsAppUrl(
      joinContact.whatsapp
    );


  const telegramUrl =
    makeTelegramUrl(
      joinContact.telegram
    );


  if(whatsappUrl){

    const a =
      document.createElement(
        "a"
      );


    a.href =
      whatsappUrl;


    a.target =
      "_blank";


    a.rel =
      "noopener";


    a.className =
      "join-whatsapp";


    a.textContent =
      "WhatsApp 联系我们";


    box.appendChild(
      a
    );

  }


  if(telegramUrl){

    const a =
      document.createElement(
        "a"
      );


    a.href =
      telegramUrl;


    a.target =
      "_blank";


    a.rel =
      "noopener";


    a.className =
      "join-telegram";


    a.textContent =
      "Telegram 联系我们";


    box.appendChild(
      a
    );

  }


  if(

    !whatsappUrl &&
    !telegramUrl

  ){

    box.innerHTML = `

      <div class="no-contact">

        暂无联系方式，请稍后再试。

      </div>

    `;

  }


  document
    .getElementById(
      "joinModal"
    )
    .classList.add(
      "show"
    );

}



function closeJoinModal(){

  document
    .getElementById(
      "joinModal"
    )
    .classList.remove(
      "show"
    );

}



document
  .getElementById(
    "joinClose"
  )
  .addEventListener(
    "click",
    closeJoinModal
  );



document
  .getElementById(
    "joinModal"
  )
  .addEventListener(

    "click",

    function(event){

      if(
        event.target ===
        this
      ){

        closeJoinModal();

      }

    }

  );



/* =========================================================
   FILTER
========================================================= */

function filterWomen(){

  const city =

    document
      .getElementById(
        "cityFilter"
      )
      .value;


  const age =

    document
      .getElementById(
        "ageFilter"
      )
      .value;


  const filtered =

    women.filter(

      woman => {


        if(

          city &&
          woman.city !== city

        ){

          return false;

        }


        const womanAge =

          Number(
            woman.age
          );


        if(
          age === "18-25"
        ){

          return (

            womanAge >= 18 &&
            womanAge <= 25

          );

        }


        if(
          age === "26-35"
        ){

          return (

            womanAge >= 26 &&
            womanAge <= 35

          );

        }


        if(
          age === "36-45"
        ){

          return (

            womanAge >= 36 &&
            womanAge <= 45

          );

        }


        if(
          age === "46+"
        ){

          return (
            womanAge >= 46
          );

        }


        return true;

      }

    );


  renderWomen(
    filtered
  );

}



document
  .getElementById(
    "cityFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById(
    "ageFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );
