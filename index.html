<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分·相遇</title>

<meta
  name="description"
  content="认真认识一个人，从一次相遇开始。"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background:#faf9f7;
  color:#2b2927;
  line-height:1.6;

}

button{
  font-family:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================
   Header
========================= */

.site-header{

  height:72px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 6%;

  background:rgba(255,255,255,.97);

  border-bottom:1px solid #eee;

  position:sticky;
  top:0;

  z-index:100;

}

.brand{

  font-size:22px;
  font-weight:700;
  letter-spacing:1px;

}

.brand span{

  color:#b58b63;
  margin:0 3px;

}

.admin-link{

  padding:8px 16px;

  border:1px solid #ddd;
  border-radius:20px;

  font-size:14px;
  color:#666;

}

.admin-link:hover{

  background:#2b2927;
  color:#fff;

}


/* =========================
   Hero
========================= */

.hero{

  min-height:420px;

  display:flex;
  align-items:center;

  padding:70px 8%;

  background:
    linear-gradient(
      90deg,
      #faf9f7 0%,
      rgba(250,249,247,.94) 55%,
      rgba(250,249,247,.65) 100%
    );

}

.hero > div{

  max-width:700px;

}

.eyebrow{

  font-size:13px;
  letter-spacing:4px;
  color:#b58b63;

  margin-bottom:18px;

  font-weight:600;

}

.hero h1{

  font-size:clamp(38px,6vw,70px);

  line-height:1.2;

  font-weight:600;

  letter-spacing:1px;

  margin-bottom:24px;

}

.hero p:not(.eyebrow){

  color:#777;

  font-size:17px;

  max-width:520px;

}


/* =========================
   Toolbar
========================= */

.toolbar{

  width:88%;
  max-width:1400px;

  margin:40px auto 25px;

  display:flex;

  align-items:center;
  justify-content:flex-end;

  gap:20px;

  flex-wrap:wrap;

}

.filters{

  display:flex;

  gap:10px;

}

.filters select{

  appearance:none;

  border:1px solid #ddd;

  background:#fff;

  padding:11px 36px 11px 14px;

  border-radius:8px;

  color:#444;

  cursor:pointer;

  outline:none;

}


/* =========================
   Grid
========================= */

.women-grid{

  width:88%;
  max-width:1400px;

  margin:0 auto 70px;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:24px;

}


/* =========================
   Card
========================= */

.woman-card{

  background:#fff;

  border-radius:14px;

  overflow:hidden;

  border:1px solid #eee;

  transition:
    transform .25s ease,
    box-shadow .25s ease;

  cursor:pointer;

}

.woman-card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 15px 40px rgba(0,0,0,.08);

}


/* =========================
   Image
========================= */

.woman-image{

  width:100%;

  aspect-ratio:3 / 4;

  background:#eee;

  overflow:hidden;

}

.woman-image img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  transition:transform .5s ease;

}

.woman-card:hover
.woman-image img{

  transform:scale(1.03);

}


/* =========================
   Info
========================= */

.woman-info{

  padding:18px;

}

.woman-info h2{

  font-size:20px;

  font-weight:600;

  margin-bottom:4px;

}

.city{

  color:#b58b63;

  font-size:14px;

  margin-bottom:7px;

}

.woman-info p{

  color:#777;

  font-size:13px;

}

.description{

  margin-top:8px;

  line-height:1.7;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;

}


/* =========================
   More card
========================= */

.more-card{

  position:relative;

  min-height:100%;

  aspect-ratio:auto;

  overflow:hidden;

  border-radius:14px;

  cursor:pointer;

  background:#222;

}

.more-card-bg{

  position:absolute;

  inset:0;

  background-image:
    linear-gradient(
      rgba(0,0,0,.18),
      rgba(0,0,0,.68)
    ),
    url("https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png");

  background-size:cover;

  background-position:center;

  transition:transform .5s ease;

}

.more-card:hover .more-card-bg{

  transform:scale(1.04);

}

.more-card-content{

  position:relative;

  z-index:2;

  min-height:100%;

  padding:30px;

  display:flex;

  flex-direction:column;

  justify-content:flex-end;

  color:#fff;

}

.more-card-content h2{

  font-size:25px;

  margin-bottom:10px;

}

.more-card-content p{

  color:rgba(255,255,255,.88);

  font-size:14px;

  margin-bottom:20px;

}

.join-button{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  width:100%;

  padding:12px;

  background:#fff;

  color:#2b2927;

  border-radius:9px;

  font-weight:600;

}


/* =========================
   Loading
========================= */

.loading{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

  color:#888;

}


/* =========================
   Footer
========================= */

footer{

  text-align:center;

  padding:35px 20px;

  border-top:1px solid #eee;

  color:#aaa;

  font-size:13px;

  background:#fff;

}


/* =========================
   Gallery Modal
========================= */

.gallery-modal{

  position:fixed;

  inset:0;

  z-index:1000;

  background:rgba(0,0,0,.94);

  display:none;

  align-items:center;

  justify-content:center;

}

.gallery-modal.show{

  display:flex;

}

.gallery-container{

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;

  position:relative;

}

.gallery-header{

  height:65px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 20px;

  color:#fff;

  flex-shrink:0;

}

.gallery-title{

  font-size:17px;
  font-weight:600;

}

.gallery-close{

  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:rgba(255,255,255,.15);

  color:#fff;

  font-size:25px;

  cursor:pointer;

}

.gallery-body{

  flex:1;

  min-height:0;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  overflow:hidden;

}

.gallery-track{

  width:100%;
  height:100%;

  display:flex;

  overflow-x:auto;

  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;

}

.gallery-track::-webkit-scrollbar{

  display:none;

}

.gallery-slide{

  min-width:100%;

  height:100%;

  scroll-snap-align:center;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:10px 70px;

}

.gallery-slide img{

  max-width:100%;
  max-height:100%;

  object-fit:contain;

  border-radius:6px;

  user-select:none;

  -webkit-user-drag:none;

}

.gallery-slide video{

  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

  background:#000;

  border-radius:6px;

}

.gallery-arrow{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:48px;
  height:48px;

  border:0;

  border-radius:50%;

  background:rgba(255,255,255,.15);

  color:#fff;

  font-size:30px;

  cursor:pointer;

  z-index:5;

}

.gallery-prev{

  left:15px;

}

.gallery-next{

  right:15px;

}

.gallery-counter{

  height:55px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#aaa;

  font-size:13px;

}


/* =========================
   Join Modal
========================= */

.join-modal{

  position:fixed;

  inset:0;

  z-index:1100;

  background:rgba(0,0,0,.55);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

}

.join-modal.show{

  display:flex;

}

.join-box{

  width:100%;
  max-width:400px;

  background:#fff;

  border-radius:18px;

  padding:30px;

  position:relative;

  text-align:center;

}

.join-box h2{

  font-size:25px;

  margin-bottom:8px;

}

.join-box p{

  color:#888;

  font-size:14px;

  margin-bottom:25px;

}

.join-close{

  position:absolute;

  top:12px;
  right:12px;

  width:35px;
  height:35px;

  border:0;

  border-radius:50%;

  background:#f1f1f1;

  font-size:20px;

}

.join-contact{

  display:flex;

  flex-direction:column;

  gap:10px;

}

.join-contact a{

  display:flex;

  align-items:center;

  justify-content:center;

  padding:13px;

  border-radius:9px;

  font-weight:600;

}

.join-whatsapp{

  background:#e8f7ed;
  color:#168a43;

}

.join-telegram{

  background:#e8f2fb;
  color:#2481c7;

}

.no-contact{

  color:#999;

  font-size:13px;

}


/* =========================
   Responsive
========================= */

@media(max-width:1000px){

  .women-grid{

    grid-template-columns:
      repeat(3,minmax(0,1fr));

  }

}

@media(max-width:700px){

  .site-header{

    height:62px;
    padding:0 20px;

  }

  .brand{

    font-size:19px;

  }

  .admin-link{

    font-size:12px;
    padding:6px 12px;

  }

  .hero{

    min-height:360px;
    padding:55px 25px;

  }

  .hero h1{

    font-size:39px;

  }

  .hero p:not(.eyebrow){

    font-size:15px;

  }

  .toolbar{

    width:calc(100% - 30px);

    margin-top:30px;

  }

  .filters{

    width:100%;

  }

  .filters select{

    flex:1;

    width:50%;

  }

  .women-grid{

    width:calc(100% - 30px);

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:12px;

  }

  .woman-info{

    padding:13px;

  }

  .woman-info h2{

    font-size:17px;

  }

  .woman-info p{

    font-size:12px;

  }

  .more-card-content{

    padding:18px;

  }

  .more-card-content h2{

    font-size:20px;

  }

  .more-card-content p{

    font-size:12px;

  }

  .gallery-slide{

    padding:10px 15px;

  }

  .gallery-arrow{

    width:40px;
    height:40px;

    font-size:23px;

  }

  .gallery-prev{

    left:5px;

  }

  .gallery-next{

    right:5px;

  }

}

@media(max-width:400px){

  .women-grid{

    grid-template-columns:1fr;

  }

}

</style>

<script>


/* ==================================================
   Supabase
================================================== */

const SUPABASE_URL =
"https://yutraouosffjteivvlfx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


const STORAGE_BUCKET =
"women-photos";


let women = [];

let joinContact = {
  whatsapp:"",
  telegram:""
};


/* ==================================================
   基础
================================================== */

document
  .getElementById("year")
  .textContent =
  new Date().getFullYear();


function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function normalizeMedia(value){

  if(!value){
    return [];
  }

  if(Array.isArray(value)){

    return value
      .flat(Infinity)
      .filter(Boolean)
      .map(v => String(v).trim())
      .filter(Boolean);

  }

  if(typeof value === "string"){

    const text = value.trim();

    if(!text){
      return [];
    }

    try{

      const parsed =
        JSON.parse(text);

      if(Array.isArray(parsed)){

        return parsed
          .flat(Infinity)
          .filter(Boolean)
          .map(v => String(v).trim())
          .filter(Boolean);

      }

    }catch(e){}

    if(text.includes(",")){

      return text
        .split(",")
        .map(v => v.trim())
        .filter(Boolean);

    }

    return [text];

  }

  return [];

}


function getStorageUrl(path){

  if(!path){
    return "";
  }

  const value =
    String(path).trim();

  if(
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ){

    return value;

  }

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    STORAGE_BUCKET +
    "/" +
    value.replace(/^\/+/,"")
  );

}


function getPhotos(woman){

  let photos = [];

  if(woman.image_url){

    photos.push(
      woman.image_url
    );

  }

  photos =
    photos.concat(
      normalizeMedia(
        woman.photos
      )
    );

  return [
    ...new Set(
      photos
        .filter(Boolean)
        .map(getStorageUrl)
    )
  ];

}


function getVideos(woman){

  return [
    ...new Set(
      normalizeMedia(
        woman.videos
      )
      .filter(Boolean)
      .map(getStorageUrl)
    )
  ];

}


/* ==================================================
   获取女士
================================================== */

async function loadWomen(){

  const grid =
    document.getElementById(
      "womenGrid"
    );

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/women" +
      "?select=*" +
      "&is_published=eq.true" +
      "&order=created_at.desc";

    const response =
      await fetch(
        url,
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );

    const text =
      await response.text();

    if(!response.ok){

      throw new Error(
        text
      );

    }

    women =
      JSON.parse(text) || [];

    createCityFilter();

    renderWomen(
      women
    );

  }catch(error){

    console.error(error);

    grid.innerHTML = `

      <div class="loading">

        暂时无法加载资料。

      </div>

    `;

  }

}


/* ==================================================
   城市
================================================== */

function createCityFilter(){

  const select =
    document.getElementById(
      "cityFilter"
    );

  const cities =
    [
      ...new Set(
        women
          .map(w => w.city)
          .filter(Boolean)
      )
    ];

  select.innerHTML = `

    <option value="">
      全部城市
    </option>

  `;

  cities.forEach(
    city => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        city;

      option.textContent =
        city;

      select.appendChild(
        option
      );

    }
  );

}


/* ==================================================
   渲染
================================================== */

function renderWomen(list){

  const grid =
    document.getElementById(
      "womenGrid"
    );

  grid.innerHTML = "";

  list.forEach(
    (woman,index) => {

      const photos =
        getPhotos(
          woman
        );

      const cover =
        photos[0] ||
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg"
               width="600"
               height="800">
            <rect width="600" height="800"
                  fill="#eeeeee"/>
            <text x="300" y="400"
                  text-anchor="middle"
                  font-size="28"
                  fill="#999">
              暂无照片
            </text>
          </svg>
        `);


      const card =
        document.createElement(
          "article"
        );

      card.className =
        "woman-card";


      card.innerHTML = `

        <div class="woman-image">

          <img
            src="${escapeHtml(cover)}"
            alt="${escapeHtml(
              woman.name || "女士"
            )}"
            loading="lazy"
          >

        </div>


        <div class="woman-info">

          <h2>

            ${escapeHtml(
              woman.name ||
              "未填写姓名"
            )}

            ${
              woman.age
              ?
              " · " +
              escapeHtml(
                woman.age
              ) +
              "岁"
              :
              ""
            }

          </h2>


          ${
            woman.city
            ?
            `
              <p class="city">
                ${escapeHtml(
                  woman.city
                )}
              </p>
            `
            :
            ""
          }


          ${
            woman.occupation
            ?
            `
              <p>
                ${escapeHtml(
                  woman.occupation
                )}
              </p>
            `
            :
            ""
          }


          ${
            woman.description
            ?
            `
              <p class="description">
                ${escapeHtml(
                  woman.description
                )}
              </p>
            `
            :
            ""
          }

        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          openGallery(
            woman
          );

        }
      );


      grid.appendChild(
        card
      );

    }
  );


  /* =========================
     最后一张申请卡
  ========================= */

  const moreCard =
    document.createElement(
      "article"
    );

  moreCard.className =
    "more-card";


  moreCard.innerHTML = `

    <div class="more-card-bg"></div>

    <div class="more-card-content">

      <h2>
        更多女士正在加入中
      </h2>

      <p>
        如果你也希望认识更多优秀的人，
        或希望申请加入我们的资料展示，
        欢迎联系我们。
      </p>

      <div class="join-button">
        申请加入
      </div>

    </div>

  `;


  moreCard.addEventListener(
    "click",
    openJoinModal
  );


  grid.appendChild(
    moreCard
  );

}


/* ==================================================
   Gallery
================================================== */

let galleryMedia = [];

let galleryIndex = 0;


function openGallery(woman){

  const photos =
    getPhotos(woman);

  const videos =
    getVideos(woman);


  galleryMedia = [];


  photos.forEach(
    url => {

      galleryMedia.push({
        type:"image",
        url
      });

    }
  );


  videos.forEach(
    url => {

      galleryMedia.push({
        type:"video",
        url
      });

    }
  );


  if(galleryMedia.length === 0){

    return;

  }


  galleryIndex = 0;


  document
    .getElementById(
      "galleryTitle"
    )
    .textContent =
    woman.name ||
    "女士资料";


  renderGallery();

  document
    .getElementById(
      "galleryModal"
    )
    .classList.add(
      "show"
    );


  document.body.style.overflow =
    "hidden";

}


function renderGallery(){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.innerHTML = "";


  galleryMedia.forEach(
    media => {

      const slide =
        document.createElement(
          "div"
        );

      slide.className =
        "gallery-slide";


      if(media.type === "image"){

        slide.innerHTML = `

          <img
            src="${escapeHtml(
              media.url
            )}"
            draggable="false"
          >

        `;

      }else{

        slide.innerHTML = `

          <video
            controls
            playsinline
            preload="metadata"
          >

            <source
              src="${escapeHtml(
                media.url
              )}"
            >

          </video>

        `;

      }


      track.appendChild(
        slide
      );

    }
  );


  updateGalleryCounter();


  requestAnimationFrame(
    () => {

      const width =
        track.clientWidth;

      track.scrollLeft =
        width *
        galleryIndex;

    }
  );

}


function updateGalleryCounter(){

  const counter =
    document.getElementById(
      "galleryCounter"
    );

  if(galleryMedia.length){

    counter.textContent =
      `${galleryIndex + 1} / ${galleryMedia.length}  ·  左右滑动查看`;

  }

}


function galleryGoTo(index){

  if(!galleryMedia.length){
    return;
  }

  if(index < 0){
    index =
      galleryMedia.length - 1;
  }

  if(
    index >=
    galleryMedia.length
  ){

    index = 0;

  }

  galleryIndex =
    index;


  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.scrollTo({
    left:
      track.clientWidth *
      galleryIndex,

    behavior:"smooth"

  });


  updateGalleryCounter();

}


/* =========================
   自动识别手指滑动
========================= */

document
  .getElementById(
    "galleryTrack"
  )
  .addEventListener(
    "scroll",
    function(){

      const width =
        this.clientWidth;

      if(!width){
        return;
      }

      const index =
        Math.round(
          this.scrollLeft /
          width
        );

      if(
        index !==
        galleryIndex
      ){

        galleryIndex =
          index;

        updateGalleryCounter();

      }

    }
  );


document
  .getElementById(
    "galleryPrev"
  )
  .addEventListener(
    "click",
    () => {

      galleryGoTo(
        galleryIndex - 1
      );

    }
  );


document
  .getElementById(
    "galleryNext"
  )
  .addEventListener(
    "click",
    () => {

      galleryGoTo(
        galleryIndex + 1
      );

    }
  );


document
  .getElementById(
    "galleryClose"
  )
  .addEventListener(
    "click",
    closeGallery
  );


function closeGallery(){

  document
    .getElementById(
      "galleryModal"
    )
    .classList.remove(
      "show"
    );

  document.body.style.overflow =
    "";

  document
    .querySelectorAll(
      "#galleryTrack video"
    )
    .forEach(
      video => video.pause()
    );

}


/* =========================
   ESC
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeGallery();

      closeJoinModal();

    }

    if(
      document
        .getElementById(
          "galleryModal"
        )
        .classList.contains("show")
    ){

      if(event.key === "ArrowLeft"){

        galleryGoTo(
          galleryIndex - 1
        );

      }

      if(event.key === "ArrowRight"){

        galleryGoTo(
          galleryIndex + 1
        );

      }

    }

  }
);


/* ==================================================
   Join 联系方式
================================================== */

async function loadJoinContact(){

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/site_settings" +
      "?select=whatsapp,telegram" +
      "&setting_key=eq.join_contact" +
      "&limit=1";


    const response =
      await fetch(
        url,
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    if(data.length){

      joinContact =
        data[0];

    }


  }catch(error){

    console.error(
      "联系方式加载失败:",
      error
    );

  }

}


function makeWhatsAppUrl(value){

  const number =
    String(
      value || ""
    )
    .replace(
      /[^\d]/g,
      ""
    );


  if(!number){
    return "";
  }


  return (
    "https://wa.me/" +
    number
  );

}


function makeTelegramUrl(value){

  let username =
    String(
      value || ""
    )
    .trim();


  if(!username){
    return "";
  }


  if(
    username.startsWith(
      "https://t.me/"
    ) ||
    username.startsWith(
      "http://t.me/"
    )
  ){

    return username;

  }


  username =
    username.replace(
      /^@/,
      ""
    );


  return (
    "https://t.me/" +
    username
  );

}


function openJoinModal(){

  const box =
    document.getElementById(
      "joinContacts"
    );


  box.innerHTML = "";


  const whatsappUrl =
    makeWhatsAppUrl(
      joinContact.whatsapp
    );


  const telegramUrl =
    makeTelegramUrl(
      joinContact.telegram
    );


  if(whatsappUrl){

    const a =
      document.createElement(
        "a"
      );

    a.href =
      whatsappUrl;

    a.target =
      "_blank";

    a.rel =
      "noopener";

    a.className =
      "join-whatsapp";

    a.textContent =
      "WhatsApp 联系我们";

    box.appendChild(a);

  }


  if(telegramUrl){

    const a =
      document.createElement(
        "a"
      );

    a.href =
      telegramUrl;

    a.target =
      "_blank";

    a.rel =
      "noopener";

    a.className =
      "join-telegram";

    a.textContent =
      "Telegram 联系我们";

    box.appendChild(a);

  }


  if(
    !whatsappUrl &&
    !telegramUrl
  ){

    box.innerHTML = `

      <div class="no-contact">

        暂无联系方式，请稍后再试。

      </div>

    `;

  }


  document
    .getElementById(
      "joinModal"
    )
    .classList.add(
      "show"
    );

}


function closeJoinModal(){

  document
    .getElementById(
      "joinModal"
    )
    .classList.remove(
      "show"
    );

}


document
  .getElementById(
    "joinClose"
  )
  .addEventListener(
    "click",
    closeJoinModal
  );


document
  .getElementById(
    "joinModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        this
      ){

        closeJoinModal();

      }

    }
  );


/* ==================================================
   筛选
================================================== */

function filterWomen(){

  const city =
    document
      .getElementById(
        "cityFilter"
      )
      .value;


  const age =
    document
      .getElementById(
        "ageFilter"
      )
      .value;


  const filtered =
    women.filter(
      woman => {

        if(
          city &&
          woman.city !== city
        ){

          return false;

        }


        const womanAge =
          Number(
            woman.age
          );


        if(age === "18-25"){

          return (
            womanAge >= 18 &&
            womanAge <= 25
          );

        }


        if(age === "26-35"){

          return (
            womanAge >= 26 &&
            womanAge <= 35
          );

        }


        if(age === "36-45"){

          return (
            womanAge >= 36 &&
            womanAge <= 45
          );

        }


        if(age === "46+"){

          return womanAge >= 46;

        }


        return true;

      }
    );


  renderWomen(
    filtered
  );

}


document
  .getElementById(
    "cityFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById(
    "ageFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


/* ==================================================
   启动
================================================== */

Promise.all([
  loadWomen(),
  loadJoinContact()
]);

</script>
