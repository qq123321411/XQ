<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分·相遇</title>

<meta
  name="description"
  content="认真认识一个人，从一次相遇开始。"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  background:#f7f1f3;

  color:#30272a;

  line-height:1.6;

}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================================================
   HEADER
========================================================= */

.site-header{

  height:72px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 6%;

  position:sticky;
  top:0;

  z-index:100;

  color:#fff;

  background:
    linear-gradient(
      90deg,
      rgba(27,18,22,.98),
      rgba(52,31,38,.96)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.15);

}

.brand{

  font-size:22px;

  font-weight:700;

  letter-spacing:2px;

  color:#fff;

}

.brand span{

  color:#df9faf;

  margin:0 4px;

}

.admin-link{

  padding:8px 17px;

  border:
    1px solid
    rgba(255,255,255,.25);

  border-radius:22px;

  font-size:13px;

  color:
    rgba(255,255,255,.85);

  background:
    rgba(255,255,255,.06);

  transition:.25s ease;

}

.admin-link:hover{

  background:#fff;

  color:#30272a;

}


/* =========================================================
   HERO
========================================================= */

.hero{

  min-height:610px;

  display:flex;

  align-items:center;

  position:relative;

  padding:90px 8%;

  overflow:hidden;

  color:#fff;

  background-image:

    linear-gradient(
      90deg,
      rgba(20,13,17,.88) 0%,
      rgba(28,18,22,.70) 38%,
      rgba(30,20,24,.42) 70%,
      rgba(20,14,18,.28) 100%
    ),

    url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=2200&q=90");

  background-size:cover;

  background-position:center;

}


/* Hero 左侧光晕 */

.hero::before{

  content:"";

  position:absolute;

  width:520px;

  height:520px;

  left:-200px;

  bottom:-270px;

  border-radius:50%;

  background:
    rgba(213,128,151,.20);

  filter:blur(105px);

  pointer-events:none;

}


/* Hero 右上光晕 */

.hero::after{

  content:"";

  position:absolute;

  width:430px;

  height:430px;

  right:-170px;

  top:-170px;

  border-radius:50%;

  background:
    rgba(239,179,155,.14);

  filter:blur(100px);

  pointer-events:none;

}


.hero > div{

  max-width:720px;

  position:relative;

  z-index:2;

}

.eyebrow{

  font-size:12px;

  letter-spacing:5px;

  color:#e8a8b8;

  margin-bottom:20px;

  font-weight:600;

}

.hero h1{

  font-size:
    clamp(40px,6vw,76px);

  line-height:1.16;

  font-weight:600;

  letter-spacing:1px;

  margin-bottom:26px;

  text-shadow:
    0 4px 25px
    rgba(0,0,0,.28);

}

.hero p:not(.eyebrow){

  color:
    rgba(255,255,255,.84);

  font-size:17px;

  max-width:550px;

  line-height:1.9;

}

.hero-label{

  margin-top:35px;

  display:flex;

  align-items:center;

  gap:12px;

  color:
    rgba(255,255,255,.62);

  font-size:13px;

}

.hero-label::before{

  content:"";

  width:34px;

  height:1px;

  background:#d99cac;

}


/* =========================================================
   CONTENT
========================================================= */

.content-section{

  position:relative;

  overflow:hidden;

  padding-top:1px;

  background:

    radial-gradient(
      circle at 5% 8%,
      rgba(215,153,167,.16),
      transparent 27%
    ),

    radial-gradient(
      circle at 94% 30%,
      rgba(220,180,160,.13),
      transparent 28%
    ),

    radial-gradient(
      circle at 50% 90%,
      rgba(201,142,159,.08),
      transparent 32%
    ),

    linear-gradient(
      180deg,
      #f8f2f4 0%,
      #f7f0f2 55%,
      #f4e9ed 100%
    );

}


/* 内容区装饰光晕 */

.content-section::before{

  content:"";

  position:absolute;

  width:450px;

  height:450px;

  left:-260px;

  top:25%;

  border-radius:50%;

  background:
    rgba(213,135,156,.10);

  filter:blur(90px);

  pointer-events:none;

}

.content-section::after{

  content:"";

  position:absolute;

  width:400px;

  height:400px;

  right:-240px;

  bottom:10%;

  border-radius:50%;

  background:
    rgba(222,168,146,.10);

  filter:blur(90px);

  pointer-events:none;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  width:88%;

  max-width:1400px;

  margin:45px auto 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  flex-wrap:wrap;

  position:relative;

  z-index:2;

}

.section-title{

  color:#392c30;

}

.section-title small{

  display:block;

  font-size:11px;

  letter-spacing:4px;

  color:#b97889;

  margin-bottom:4px;

}

.section-title h2{

  font-size:27px;

  font-weight:600;

}

.filters{

  display:flex;

  gap:10px;

}

.filters select{

  appearance:none;

  border:
    1px solid
    #e1d2d7;

  background:
    rgba(255,255,255,.82);

  padding:
    11px 40px 11px 15px;

  border-radius:10px;

  color:#4b4043;

  cursor:pointer;

  outline:none;

  box-shadow:
    0 5px 20px
    rgba(72,42,50,.05);

}

.filters select:focus{

  border-color:#c58a9a;

}


/* =========================================================
   GRID
========================================================= */

.women-grid{

  width:88%;

  max-width:1400px;

  margin:
    0 auto 85px;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:24px;

  position:relative;

  z-index:2;

}


/* =========================================================
   CARD
========================================================= */

.woman-card{

  background:
    rgba(255,255,255,.90);

  border-radius:16px;

  overflow:hidden;

  border:
    1px solid
    rgba(219,201,205,.85);

  transition:
    transform .3s ease,
    box-shadow .3s ease;

  cursor:pointer;

  box-shadow:
    0 8px 30px
    rgba(58,37,43,.07);

  backdrop-filter:
    blur(5px);

}

.woman-card:hover{

  transform:
    translateY(-6px);

  box-shadow:
    0 20px 50px
    rgba(63,38,47,.15);

}


/* =========================================================
   IMAGE
========================================================= */

.woman-image{

  width:100%;

  aspect-ratio:3 / 4;

  background:#eee5e8;

  overflow:hidden;

  position:relative;

}

.woman-image::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      transparent 52%,
      rgba(30,20,24,.12)
    );

}

.woman-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:
    transform .6s ease;

}

.woman-card:hover
.woman-image img{

  transform:
    scale(1.045);

}


/* =========================================================
   INFO
========================================================= */

.woman-info{

  padding:
    18px 18px 20px;

}

.woman-info h2{

  font-size:20px;

  font-weight:600;

  color:#332a2d;

  margin-bottom:5px;

}

.city{

  color:#b77b8b;

  font-size:13px;

  margin-bottom:7px;

}

.woman-info p{

  color:#827579;

  font-size:13px;

}

.description{

  margin-top:8px;

  line-height:1.7;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;

}


/* =========================================================
   MORE CARD
========================================================= */

.more-card{

  position:relative;

  min-height:100%;

  overflow:hidden;

  border-radius:16px;

  cursor:pointer;

  background:#281c21;

  min-height:400px;

  box-shadow:
    0 10px 35px
    rgba(58,34,42,.14);

}

.more-card-bg{

  position:absolute;

  inset:0;

  background-image:

    linear-gradient(
      rgba(30,17,22,.20),
      rgba(27,16,21,.84)
    ),

    url("https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=1200&q=90");

  background-size:cover;

  background-position:center;

  transition:
    transform .6s ease;

}

.more-card:hover
.more-card-bg{

  transform:
    scale(1.05);

}

.more-card-content{

  position:relative;

  z-index:2;

  min-height:100%;

  padding:30px;

  display:flex;

  flex-direction:column;

  justify-content:flex-end;

  color:#fff;

}

.more-card-content h2{

  font-size:26px;

  line-height:1.3;

  margin-bottom:12px;

}

.more-card-content p{

  color:
    rgba(255,255,255,.82);

  font-size:14px;

  line-height:1.8;

  margin-bottom:20px;

}

.join-button{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  padding:13px;

  background:#fff;

  color:#33282c;

  border-radius:10px;

  font-weight:600;

  transition:.25s ease;

}

.more-card:hover
.join-button{

  background:#f3dce2;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

  color:#9a898e;

}


/* =========================================================
   FOOTER
========================================================= */

footer{

  position:relative;

  overflow:hidden;

  isolation:isolate;

  text-align:center;

  padding:
    70px 20px 75px;

  color:
    rgba(255,255,255,.68);

  font-size:13px;

  background:

    radial-gradient(
      circle at 15% 20%,
      rgba(211,137,157,.25),
      transparent 32%
    ),

    radial-gradient(
      circle at 85% 70%,
      rgba(221,166,139,.20),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #24171c 0%,
      #352128 45%,
      #24171c 100%
    );

  border-top:
    1px solid
    rgba(255,255,255,.08);

}


/* Footer 左下光晕 */

footer::before{

  content:"";

  position:absolute;

  width:380px;

  height:380px;

  left:-180px;

  bottom:-260px;

  border-radius:50%;

  background:
    rgba(212,132,153,.18);

  filter:blur(80px);

  pointer-events:none;

}


/* Footer 右上光晕 */

footer::after{

  content:"";

  position:absolute;

  width:320px;

  height:320px;

  right:-140px;

  top:-200px;

  border-radius:50%;

  background:
    rgba(224,174,145,.14);

  filter:blur(75px);

  pointer-events:none;

}

footer span{

  position:relative;

  z-index:2;

}


/* =========================================================
   GALLERY
========================================================= */

.gallery-modal{

  position:fixed;

  inset:0;

  z-index:1000;

  background:
    rgba(15,10,13,.96);

  display:none;

  align-items:center;

  justify-content:center;

}

.gallery-modal.show{

  display:flex;

}

.gallery-container{

  width:100%;

  height:100%;

  display:flex;

  flex-direction:column;

  position:relative;

}

.gallery-header{

  height:65px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 20px;

  color:#fff;

  flex-shrink:0;

}

.gallery-title{

  font-size:17px;

  font-weight:600;

}

.gallery-close{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

  color:#fff;

  font-size:25px;

  cursor:pointer;

}

.gallery-body{

  flex:1;

  min-height:0;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  overflow:hidden;

}

.gallery-track{

  width:100%;

  height:100%;

  display:flex;

  overflow-x:auto;

  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;

}

.gallery-track::-webkit-scrollbar{

  display:none;

}

.gallery-slide{

  min-width:100%;

  height:100%;

  scroll-snap-align:center;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:10px 70px;

}

.gallery-slide img{

  max-width:100%;

  max-height:100%;

  object-fit:contain;

  border-radius:6px;

  user-select:none;

  -webkit-user-drag:none;

}

.gallery-slide video{

  max-width:100%;

  max-height:100%;

  width:auto;

  height:auto;

  background:#000;

  border-radius:6px;

}

.gallery-arrow{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:48px;

  height:48px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

  color:#fff;

  font-size:30px;

  cursor:pointer;

  z-index:5;

}

.gallery-prev{

  left:15px;

}

.gallery-next{

  right:15px;

}

.gallery-counter{

  height:55px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#aaa;

  font-size:13px;

}


/* =========================================================
   JOIN MODAL
========================================================= */

.join-modal{

  position:fixed;

  inset:0;

  z-index:1100;

  background:
    rgba(15,8,12,.68);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  backdrop-filter:
    blur(8px);

}

.join-modal.show{

  display:flex;

}

.join-box{

  width:100%;

  max-width:410px;

  background:

    linear-gradient(
      145deg,
      #fff,
      #fdf7f8
    );

  border-radius:20px;

  padding:32px;

  position:relative;

  text-align:center;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.25);

}

.join-box h2{

  font-size:27px;

  margin-bottom:8px;

  color:#33272b;

}

.join-box p{

  color:#8b7b80;

  font-size:14px;

  margin-bottom:25px;

}

.join-close{

  position:absolute;

  top:12px;

  right:12px;

  width:35px;

  height:35px;

  border:0;

  border-radius:50%;

  background:#f1e8ea;

  color:#66565b;

  font-size:20px;

  cursor:pointer;

}

.join-contact{

  display:flex;

  flex-direction:column;

  gap:10px;

}

.join-contact a{

  display:flex;

  align-items:center;

  justify-content:center;

  padding:13px;

  border-radius:10px;

  font-weight:600;

  transition:.25s ease;

}

.join-contact a:hover{

  transform:
    translateY(-2px);

}

.join-whatsapp{

  background:#e7f6ec;

  color:#168743;

}

.join-telegram{

  background:#e7f1f9;

  color:#2480c5;

}

.no-contact{

  color:#999;

  font-size:13px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

  .women-grid{

    grid-template-columns:
      repeat(3,minmax(0,1fr));

  }

}


@media(max-width:700px){

  .site-header{

    height:62px;

    padding:0 20px;

  }

  .brand{

    font-size:19px;

  }

  .admin-link{

    font-size:12px;

    padding:6px 12px;

  }


  .hero{

    min-height:590px;

    padding:65px 25px;

    background-position:
      62% center;

  }

  .hero h1{

    font-size:40px;

  }

  .hero p:not(.eyebrow){

    font-size:15px;

    line-height:1.8;

  }


  .hero-label{

    font-size:12px;

  }


  .toolbar{

    width:
      calc(100% - 30px);

    margin-top:35px;

    align-items:flex-start;

    flex-direction:column;

  }

  .section-title h2{

    font-size:23px;

  }


  .filters{

    width:100%;

  }

  .filters select{

    flex:1;

    width:50%;

  }


  .women-grid{

    width:
      calc(100% - 30px);

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:12px;

  }


  .woman-info{

    padding:13px;

  }

  .woman-info h2{

    font-size:17px;

  }

  .woman-info p{

    font-size:12px;

  }


  .more-card{

    min-height:360px;

  }

  .more-card-content{

    padding:18px;

  }

  .more-card-content h2{

    font-size:20px;

  }

  .more-card-content p{

    font-size:12px;

  }


  .gallery-slide{

    padding:10px 15px;

  }

  .gallery-arrow{

    width:40px;

    height:40px;

    font-size:23px;

  }

  .gallery-prev{

    left:5px;

  }

  .gallery-next{

    right:5px;

  }


  footer{

    padding:
      55px 20px 60px;

  }

}


@media(max-width:400px){

  .women-grid{

    grid-template-columns:1fr;

  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *{

    scroll-behavior:auto !important;

    transition:none !important;

  }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="site-header">

  <a
    class="brand"
    href="./"
  >
    缘分<span>·</span>相遇
  </a>


  <a
    class="admin-link"
    href="admin/"
  >
    管理
  </a>

</header>



<!-- =========================================================
     HERO
========================================================= -->

<section class="hero">

  <div>

    <p class="eyebrow">
      MEET SOMEONE SPECIAL
    </p>


    <h1>
      认真认识一个人，<br>
      从一次相遇开始。
    </h1>


    <p>
      浏览真实资料，了解彼此，再决定是否联系。
      有些缘分，不需要刻意寻找，只需要一次恰好的相遇。
    </p>


    <div class="hero-label">
      每一次相遇，都可能成为故事的开始
    </div>

  </div>

</section>



<!-- =========================================================
     CONTENT
========================================================= -->

<main class="content-section">


<section class="toolbar">


  <div class="section-title">

    <small>
      DISCOVER
    </small>

    <h2>
      认识她们
    </h2>

  </div>


  <div class="filters">


    <select id="cityFilter">

      <option value="">
        全部城市
      </option>

    </select>


    <select id="ageFilter">

      <option value="">
        全部年龄
      </option>

      <option value="18-25">
        18–25
      </option>

      <option value="26-35">
        26–35
      </option>

      <option value="36-45">
        36–45
      </option>

      <option value="46+">
        46+
      </option>

    </select>

  </div>

</section>



<section
  id="womenGrid"
  class="women-grid"
>

  <div class="loading">
    正在加载资料……
  </div>

</section>


</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

  ©
  <span id="year"></span>
  缘分·相遇

</footer>



<!-- =========================================================
     GALLERY
========================================================= -->

<div
  id="galleryModal"
  class="gallery-modal"
>

  <div class="gallery-container">


    <div class="gallery-header">

      <div
        id="galleryTitle"
        class="gallery-title"
      >
        女士资料
      </div>


      <button
        id="galleryClose"
        class="gallery-close"
        type="button"
      >
        ×
      </button>

    </div>



    <div class="gallery-body">


      <button
        id="galleryPrev"
        class="gallery-arrow gallery-prev"
        type="button"
      >
        ‹
      </button>


      <div
        id="galleryTrack"
        class="gallery-track"
      ></div>


      <button
        id="galleryNext"
        class="gallery-arrow gallery-next"
        type="button"
      >
        ›
      </button>

    </div>



    <div
      id="galleryCounter"
      class="gallery-counter"
    ></div>


  </div>

</div>



<!-- =========================================================
     JOIN
========================================================= -->

<div
  id="joinModal"
  class="join-modal"
>

  <div class="join-box">


    <button
      id="joinClose"
      class="join-close"
      type="button"
    >
      ×
    </button>


    <h2>
      申请加入
    </h2>


    <p>
      如果你也希望出现在这里，可以联系我们。
    </p>


    <div
      id="joinContacts"
      class="join-contact"
    >

      <div class="no-contact">
        正在加载联系方式……
      </div>

    </div>


  </div>

</div>



<script>


/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://yutraouosffjteivvlfx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


const STORAGE_BUCKET =
"women-photos";


let women = [];


let joinContact = {

  whatsapp:"",
  telegram:""

};



/* ==================================================
   BASIC
================================================== */

document
  .getElementById("year")
  .textContent =
  new Date().getFullYear();



function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* ==================================================
   MEDIA
================================================== */

function normalizeMedia(value){

  if(!value){

    return [];

  }


  if(Array.isArray(value)){

    return value

      .flat(Infinity)

      .filter(Boolean)

      .map(v =>
        String(v).trim()
      )

      .filter(Boolean);

  }


  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){

      return [];

    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed

          .flat(Infinity)

          .filter(Boolean)

          .map(v =>
            String(v).trim()
          )

          .filter(Boolean);

      }

    }catch(e){}


    if(text.includes(",")){

      return text

        .split(",")

        .map(v =>
          v.trim()
        )

        .filter(Boolean);

    }


    return [text];

  }


  return [];

}



/* ==================================================
   STORAGE
================================================== */

function getStorageUrl(path){

  if(!path){

    return "";

  }


  const value =
    String(path).trim();


  if(

    value.startsWith("http://") ||

    value.startsWith("https://") ||

    value.startsWith("data:")

  ){

    return value;

  }


  return (

    SUPABASE_URL +

    "/storage/v1/object/public/" +

    STORAGE_BUCKET +

    "/" +

    value.replace(/^\/+/,"")

  );

}



/* ==================================================
   PHOTOS
================================================== */

function getPhotos(woman){

  let photos = [];


  if(woman.image_url){

    photos.push(
      woman.image_url
    );

  }


  photos =
    photos.concat(
      normalizeMedia(
        woman.photos
      )
    );


  return [

    ...new Set(

      photos

        .filter(Boolean)

        .map(
          getStorageUrl
        )

    )

  ];

}



/* ==================================================
   VIDEOS
================================================== */

function getVideos(woman){

  return [

    ...new Set(

      normalizeMedia(
        woman.videos
      )

      .filter(Boolean)

      .map(
        getStorageUrl
      )

    )

  ];

}



/* ==================================================
   LOAD WOMEN
================================================== */

async function loadWomen(){

  const grid =
    document.getElementById(
      "womenGrid"
    );


  try{

    const url =

      SUPABASE_URL +

      "/rest/v1/women" +

      "?select=*" +

      "&is_published=eq.true" +

      "&order=created_at.desc";


    const response =
      await fetch(

        url,

        {

          headers:{

            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(
        text
      );

    }


    women =
      JSON.parse(text) || [];


    createCityFilter();


    renderWomen(
      women
    );


  }catch(error){

    console.error(
      error
    );


    grid.innerHTML = `

      <div class="loading">

        暂时无法加载资料。

      </div>

    `;

  }

}



/* ==================================================
   CITY FILTER
================================================== */

function createCityFilter(){

  const select =
    document.getElementById(
      "cityFilter"
    );


  const cities =

    [

      ...new Set(

        women

          .map(
            w => w.city
          )

          .filter(Boolean)

      )

    ];


  select.innerHTML = `

    <option value="">
      全部城市
    </option>

  `;


  cities.forEach(

    city => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        city;


      option.textContent =
        city;


      select.appendChild(
        option
      );

    }

  );

}



/* ==================================================
   RENDER WOMEN
================================================== */

function renderWomen(list){

  const grid =
    document.getElementById(
      "womenGrid"
    );


  grid.innerHTML = "";


  list.forEach(

    woman => {


      const photos =
        getPhotos(
          woman
        );


      const cover =

        photos[0] ||

        "data:image/svg+xml;charset=UTF-8," +

        encodeURIComponent(`

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="600"
            height="800"
          >

            <rect
              width="600"
              height="800"
              fill="#eee6e8"
            />

            <text
              x="300"
              y="400"
              text-anchor="middle"
              font-size="28"
              fill="#999"
            >
              暂无照片
            </text>

          </svg>

        `);



      const card =
        document.createElement(
          "article"
        );


      card.className =
        "woman-card";


      card.innerHTML = `

        <div class="woman-image">

          <img

            src="${escapeHtml(
              cover
            )}"

            alt="${escapeHtml(
              woman.name ||
              "女士"
            )}"

            loading="lazy"

          >

        </div>


        <div class="woman-info">


          <h2>

            ${escapeHtml(
              woman.name ||
              "未填写姓名"
            )}

            ${

              woman.age

              ?

              " · " +

              escapeHtml(
                woman.age
              ) +

              "岁"

              :

              ""

            }

          </h2>


          ${

            woman.city

            ?

            `

              <p class="city">

                ${escapeHtml(
                  woman.city
                )}

              </p>

            `

            :

            ""

          }


          ${

            woman.occupation

            ?

            `

              <p>

                ${escapeHtml(
                  woman.occupation
                )}

              </p>

            `

            :

            ""

          }


          ${

            woman.description

            ?

            `

              <p class="description">

                ${escapeHtml(
                  woman.description
                )}

              </p>

            `

            :

            ""

          }


        </div>

      `;


      card.addEventListener(

        "click",

        () => {

          openGallery(
            woman
          );

        }

      );


      grid.appendChild(
        card
      );


    }

  );



  /* ==================================================
     MORE CARD
  ================================================== */

  const moreCard =
    document.createElement(
      "article"
    );


  moreCard.className =
    "more-card";


  moreCard.innerHTML = `

    <div class="more-card-bg"></div>

    <div class="more-card-content">

      <h2>
        更多女士正在加入中
      </h2>

      <p>
        如果你也希望认识更多优秀的人，
        或希望申请加入我们的资料展示，
        欢迎联系我们。
      </p>

      <div class="join-button">
        申请加入
      </div>

    </div>

  `;


  moreCard.addEventListener(
    "click",
    openJoinModal
  );


  grid.appendChild(
    moreCard
  );

}



/* ==================================================
   GALLERY
================================================== */

let galleryMedia = [];

let galleryIndex = 0;



function openGallery(woman){

  const photos =
    getPhotos(
      woman
    );


  const videos =
    getVideos(
      woman
    );


  galleryMedia = [];


  photos.forEach(

    url => {

      galleryMedia.push({

        type:"image",

        url

      });

    }

  );


  videos.forEach(

    url => {

      galleryMedia.push({

        type:"video",

        url

      });

    }

  );


  if(
    galleryMedia.length === 0
  ){

    return;

  }


  galleryIndex = 0;


  document
    .getElementById(
      "galleryTitle"
    )
    .textContent =

    woman.name ||
    "女士资料";


  renderGallery();


  document
    .getElementById(
      "galleryModal"
    )
    .classList.add(
      "show"
    );


  document.body.style.overflow =
    "hidden";

}



function renderGallery(){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.innerHTML = "";


  galleryMedia.forEach(

    media => {

      const slide =
        document.createElement(
          "div"
        );


      slide.className =
        "gallery-slide";


      if(
        media.type === "image"
      ){

        slide.innerHTML = `

          <img

            src="${escapeHtml(
              media.url
            )}"

            draggable="false"

          >

        `;

      }else{

        slide.innerHTML = `

          <video

            controls

            playsinline

            preload="metadata"

          >

            <source
              src="${escapeHtml(
                media.url
              )}"
            >

          </video>

        `;

      }


      track.appendChild(
        slide
      );

    }

  );


  updateGalleryCounter();


  requestAnimationFrame(

    () => {

      const width =
        track.clientWidth;


      track.scrollLeft =
        width *
        galleryIndex;

    }

  );

}



function updateGalleryCounter(){

  const counter =
    document.getElementById(
      "galleryCounter"
    );


  if(
    galleryMedia.length
  ){

    counter.textContent =

      `${galleryIndex + 1} / ${galleryMedia.length}  ·  左右滑动查看`;

  }

}



function galleryGoTo(index){

  if(
    !galleryMedia.length
  ){

    return;

  }


  if(index < 0){

    index =
      galleryMedia.length - 1;

  }


  if(
    index >=
    galleryMedia.length
  ){

    index = 0;

  }


  galleryIndex =
    index;


  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.scrollTo({

    left:
      track.clientWidth *
      galleryIndex,

    behavior:"smooth"

  });


  updateGalleryCounter();

}



/* ==================================================
   GALLERY SCROLL
================================================== */

document
  .getElementById(
    "galleryTrack"
  )
  .addEventListener(

    "scroll",

    function(){

      const width =
        this.clientWidth;


      if(!width){

        return;

      }


      const index =

        Math.round(

          this.scrollLeft /
          width

        );


      if(
        index !==
        galleryIndex
      ){

        galleryIndex =
          index;


        updateGalleryCounter();

      }

    }

  );



document
  .getElementById(
    "galleryPrev"
  )
  .addEventListener(

    "click",

    () => {

      galleryGoTo(
        galleryIndex - 1
      );

    }

  );


document
  .getElementById(
    "galleryNext"
  )
  .addEventListener(

    "click",

    () => {

      galleryGoTo(
        galleryIndex + 1
      );

    }

  );


document
  .getElementById(
    "galleryClose"
  )
  .addEventListener(

    "click",

    closeGallery

  );



function closeGallery(){

  document
    .getElementById(
      "galleryModal"
    )
    .classList.remove(
      "show"
    );


  document.body.style.overflow =
    "";


  document
    .querySelectorAll(
      "#galleryTrack video"
    )
    .forEach(

      video =>
        video.pause()

    );

}



/* ==================================================
   ESC
================================================== */

document.addEventListener(

  "keydown",

  event => {

    if(
      event.key === "Escape"
    ){

      closeGallery();

      closeJoinModal();

    }


    if(

      document
        .getElementById(
          "galleryModal"
        )
        .classList
        .contains("show")

    ){

      if(
        event.key === "ArrowLeft"
      ){

        galleryGoTo(
          galleryIndex - 1
        );

      }


      if(
        event.key === "ArrowRight"
      ){

        galleryGoTo(
          galleryIndex + 1
        );

      }

    }

  }

);



/* ==================================================
   JOIN CONTACT
================================================== */

async function loadJoinContact(){

  try{

    const url =

      SUPABASE_URL +

      "/rest/v1/site_settings" +

      "?select=whatsapp,telegram" +

      "&setting_key=eq.join_contact" +

      "&limit=1";


    const response =
      await fetch(

        url,

        {

          headers:{

            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    if(
      data.length
    ){

      joinContact =
        data[0];

    }


  }catch(error){

    console.error(
      "联系方式加载失败:",
      error
    );

  }

}



/* ==================================================
   WHATSAPP
================================================== */

function makeWhatsAppUrl(value){

  const number =

    String(
      value || ""
    )

    .replace(
      /[^\d]/g,
      ""
    );


  if(!number){

    return "";

  }


  return (
    "https://wa.me/" +
    number
  );

}



/* ==================================================
   TELEGRAM
================================================== */

function makeTelegramUrl(value){

  let username =

    String(
      value || ""
    )

    .trim();


  if(!username){

    return "";

  }


  if(

    username.startsWith(
      "https://t.me/"
    )

    ||

    username.startsWith(
      "http://t.me/"
    )

  ){

    return username;

  }


  username =
    username.replace(
      /^@/,
      ""
    );


  return (
    "https://t.me/" +
    username
  );

}



/* ==================================================
   JOIN MODAL
================================================== */

function openJoinModal(){

  const box =
    document.getElementById(
      "joinContacts"
    );


  box.innerHTML = "";


  const whatsappUrl =
    makeWhatsAppUrl(
      joinContact.whatsapp
    );


  const telegramUrl =
    makeTelegramUrl(
      joinContact.telegram
    );


  if(whatsappUrl){

    const a =
      document.createElement(
        "a"
      );


    a.href =
      whatsappUrl;


    a.target =
      "_blank";


    a.rel =
      "noopener";


    a.className =
      "join-whatsapp";


    a.textContent =
      "WhatsApp 联系我们";


    box.appendChild(
      a
    );

  }


  if(telegramUrl){

    const a =
      document.createElement(
        "a"
      );


    a.href =
      telegramUrl;


    a.target =
      "_blank";


    a.rel =
      "noopener";


    a.className =
      "join-telegram";


    a.textContent =
      "Telegram 联系我们";


    box.appendChild(
      a
    );

  }


  if(

    !whatsappUrl &&
    !telegramUrl

  ){

    box.innerHTML = `

      <div class="no-contact">

        暂无联系方式，请稍后再试。

      </div>

    `;

  }


  document
    .getElementById(
      "joinModal"
    )
    .classList.add(
      "show"
    );

}



function closeJoinModal(){

  document
    .getElementById(
      "joinModal"
    )
    .classList.remove(
      "show"
    );

}



document
  .getElementById(
    "joinClose"
  )
  .addEventListener(
    "click",
    closeJoinModal
  );



document
  .getElementById(
    "joinModal"
  )
  .addEventListener(

    "click",

    function(event){

      if(
        event.target ===
        this
      ){

        closeJoinModal();

      }

    }

  );



/* ==================================================
   FILTER
================================================== */

function filterWomen(){

  const city =

    document
      .getElementById(
        "cityFilter"
      )
      .value;


  const age =

    document
      .getElementById(
        "ageFilter"
      )
      .value;


  const filtered =

    women.filter(

      woman => {


        if(

          city &&
          woman.city !== city

        ){

          return false;

        }


        const womanAge =

          Number(
            woman.age
          );


        if(
          age === "18-25"
        ){

          return (

            womanAge >= 18 &&
            womanAge <= 25

          );

        }


        if(
          age === "26-35"
        ){

          return (

            womanAge >= 26 &&
            womanAge <= 35

          );

        }


        if(
          age === "36-45"
        ){

          return (

            womanAge >= 36 &&
            womanAge <= 45

          );

        }


        if(
          age === "46+"
        ){

          return (
            womanAge >= 46
          );

        }


        return true;

      }

    );


  renderWomen(
    filtered
  );

}



document
  .getElementById(
    "cityFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById(
    "ageFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );



/* ==================================================
   START
================================================== */

Promise.all([

  loadWomen(),

  loadJoinContact()

]);

</script>
