<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分·相遇</title>

<meta
  name="description"
  content="认真认识一个人，从一次相遇开始。"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

html,
body{
  min-height:100%;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  color:#f3e9ed;

  line-height:1.6;

  overflow-x:hidden;

  background:

    radial-gradient(
      ellipse 75% 38% at 5% 8%,
      rgba(213,128,151,.16),
      transparent 70%
    ),

    radial-gradient(
      ellipse 70% 40% at 95% 22%,
      rgba(232,181,145,.12),
      transparent 70%
    ),

    radial-gradient(
      ellipse 80% 55% at 50% 58%,
      rgba(108,55,76,.15),
      transparent 75%
    ),

    radial-gradient(
      ellipse 70% 40% at 15% 90%,
      rgba(194,105,136,.12),
      transparent 72%
    ),

    linear-gradient(
      180deg,
      #171014 0%,
      #21151b 32%,
      #291923 65%,
      #21141b 100%
    );

  background-attachment:fixed;

}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================================================
   HEADER
========================================================= */

.site-header{

  height:72px;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  padding:0 6%;

  position:sticky;

  top:0;

  z-index:100;

  color:#fff;

  background:

    linear-gradient(
      90deg,
      rgba(23,15,20,.97),
      rgba(48,28,36,.94)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.15);

  backdrop-filter:blur(16px);

}

.brand{

  font-size:22px;

  font-weight:700;

  letter-spacing:2px;

  color:#fff;

}

.brand span{

  color:#df9faf;

  margin:0 4px;

}


/* =========================================================
   HERO
========================================================= */

.hero{

  min-height:610px;

  display:flex;

  align-items:center;

  position:relative;

  z-index:2;

  padding:90px 8%;

  overflow:hidden;

  color:#fff;

  background-image:

    linear-gradient(
      90deg,
      rgba(20,13,17,.92) 0%,
      rgba(28,18,22,.74) 38%,
      rgba(30,20,24,.48) 70%,
      rgba(20,14,18,.34) 100%
    ),

    url(
      "https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png"
    );

  background-size:cover;

  background-position:center;

}


/* Hero 底部自然衔接 */

.hero{

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      #000 0%,
      #000 90%,
      rgba(0,0,0,.96) 96%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to bottom,
      #000 0%,
      #000 90%,
      rgba(0,0,0,.96) 96%,
      transparent 100%
    );

}


.hero > div{

  max-width:720px;

  position:relative;

  z-index:5;

}

.eyebrow{

  font-size:12px;

  letter-spacing:5px;

  color:#e8a8b8;

  margin-bottom:20px;

  font-weight:600;

}

.hero h1{

  font-size:
    clamp(40px,6vw,76px);

  line-height:1.16;

  font-weight:600;

  letter-spacing:1px;

  margin-bottom:26px;

  text-shadow:
    0 4px 25px
    rgba(0,0,0,.28);

}

.hero p:not(.eyebrow){

  color:
    rgba(255,255,255,.84);

  font-size:17px;

  max-width:550px;

  line-height:1.9;

}

.hero-label{

  margin-top:35px;

  display:flex;

  align-items:center;

  gap:12px;

  color:
    rgba(255,255,255,.62);

  font-size:13px;

}

.hero-label::before{

  content:"";

  width:34px;

  height:1px;

  background:#d99cac;

}


/* =========================================================
   CONTENT
========================================================= */

.content-section{

  position:relative;

  z-index:2;

  overflow:visible;

  padding-top:1px;

  background:transparent;

}


/* =========================================================
   CONTENT TOP TRANSITION
========================================================= */

.content-section::before{

  content:"";

  position:absolute;

  left:0;

  right:0;

  top:-90px;

  height:90px;

  pointer-events:none;

  z-index:0;

  background:

    linear-gradient(
      to bottom,
      transparent,
      rgba(33,21,27,.65)
    );

}


/* =========================================================
   PROFILES AREA
========================================================= */

.profiles-area{

  width:100%;

  position:relative;

  z-index:30;

  isolation:isolate;

  overflow:hidden;

  padding-bottom:70px;

  background:

    radial-gradient(
      ellipse 70% 38% at 8% 12%,
      rgba(213,128,151,.17),
      transparent 70%
    ),

    radial-gradient(
      ellipse 65% 40% at 92% 20%,
      rgba(232,181,145,.13),
      transparent 70%
    ),

    radial-gradient(
      ellipse 75% 55% at 50% 52%,
      rgba(108,55,76,.13),
      transparent 75%
    ),

    linear-gradient(
      180deg,
      #21151b 0%,
      #261821 45%,
      #21141b 100%
    );

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  width:88%;

  max-width:1400px;

  margin:35px auto 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  flex-wrap:wrap;

  position:relative;

  z-index:5;

}

.section-title{

  color:#fff;

}

.section-title small{

  display:block;

  font-size:11px;

  letter-spacing:4px;

  color:#e0a0b2;

  margin-bottom:4px;

}

.section-title h2{

  font-size:27px;

  font-weight:600;

  color:#fff;

}

.filters{

  display:flex;

  gap:10px;

}

.filters select{

  appearance:none;

  border:
    1px solid
    rgba(235,185,197,.22);

  background:
    rgba(42,25,32,.72);

  padding:
    11px 40px 11px 15px;

  border-radius:10px;

  color:#f8e9ee;

  cursor:pointer;

  outline:none;

  box-shadow:

    0 8px 28px
    rgba(0,0,0,.14),

    inset 0 1px 0
    rgba(255,255,255,.06);

  backdrop-filter:blur(14px);

}

.filters select:focus{

  border-color:
    rgba(214,154,170,.75);

}


/* =========================================================
   GRID
========================================================= */

.women-grid{

  width:88%;

  max-width:1400px;

  margin:0 auto;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:24px;

  position:relative;

  z-index:6;

}


/* =========================================================
   CARD
========================================================= */

.woman-card{

  position:relative;

  z-index:7;

  background:
    rgba(255,255,255,.94);

  border-radius:18px;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.88);

  transition:
    transform .35s ease,
    box-shadow .35s ease;

  cursor:pointer;

  color:#30272a;

  box-shadow:

    0 12px 40px
    rgba(0,0,0,.20),

    0 2px 8px
    rgba(0,0,0,.08);

  backdrop-filter:blur(10px);

  isolation:isolate;

}

.woman-card:hover{

  transform:
    translateY(-7px);

  box-shadow:

    0 25px 65px
    rgba(0,0,0,.28),

    0 4px 15px
    rgba(0,0,0,.12);

}


/* =========================================================
   IMAGE
========================================================= */

.woman-image{

  width:100%;

  aspect-ratio:3 / 4;

  background:#eee5e8;

  overflow:hidden;

  position:relative;

}

.woman-image::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:2;

  background:
    linear-gradient(
      to bottom,
      transparent 48%,
      rgba(30,20,24,.16)
    );

}

.woman-image::before{

  content:"♥";

  position:absolute;

  right:12px;

  top:12px;

  z-index:3;

  width:32px;

  height:32px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  color:rgba(255,255,255,.92);

  background:
    rgba(60,30,42,.24);

  backdrop-filter:
    blur(5px);

  font-size:14px;

  opacity:.85;

}

.woman-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:
    transform .6s ease;

}

.woman-card:hover
.woman-image img{

  transform:
    scale(1.045);

}


/* =========================================================
   INFO
========================================================= */

.woman-info{

  padding:
    18px 18px 20px;

  position:relative;

  z-index:3;

  background:
    rgba(255,255,255,.94);

}

.woman-info h2{

  font-size:20px;

  font-weight:600;

  color:#332a2d;

  margin-bottom:5px;

}

.city{

  color:#b77b8b;

  font-size:13px;

  margin-bottom:7px;

}

.woman-info p{

  color:#827579;

  font-size:13px;

}

.description{

  margin-top:8px;

  line-height:1.7;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;

}


/* =========================================================
   MORE CARD
========================================================= */

.more-card{

  position:relative;

  z-index:7;

  min-height:400px;

  overflow:hidden;

  border-radius:18px;

  cursor:pointer;

  background:#281c21;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.22);

  isolation:isolate;

}

.more-card-bg{

  position:absolute;

  inset:0;

  z-index:0;

  background-image:

    linear-gradient(
      rgba(30,17,22,.20),
      rgba(27,16,21,.86)
    ),

    url(
      "https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png"
    );

  background-size:cover;

  background-position:center;

  transition:
    transform .6s ease;

}

.more-card:hover
.more-card-bg{

  transform:
    scale(1.05);

}

.more-card-content{

  position:relative;

  z-index:2;

  min-height:400px;

  padding:30px;

  display:flex;

  flex-direction:column;

  justify-content:flex-end;

  color:#fff;

}

.more-card-content h2{

  font-size:26px;

  line-height:1.3;

  margin-bottom:12px;

}

.more-card-content p{

  color:
    rgba(255,255,255,.82);

  font-size:14px;

  line-height:1.8;

  margin-bottom:20px;

}

.join-button{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  padding:13px;

  background:#fff;

  color:#33282c;

  border-radius:10px;

  font-weight:600;

  transition:.25s ease;

}

.more-card:hover
.join-button{

  background:#f3dce2;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

  color:
    rgba(255,255,255,.70);

  position:relative;

  z-index:6;

}


/* =========================================================
   ROMANTIC BANNER
========================================================= */

.romantic-banner{

  width:88%;

  max-width:1400px;

  min-height:235px;

  margin:0 auto;

  position:relative;

  z-index:30;

  overflow:hidden;

  border-radius:25px;

  border:
    1px solid
    rgba(255,255,255,.14);

  background:

    linear-gradient(
      115deg,
      rgba(35,20,27,.96),
      rgba(72,40,50,.94),
      rgba(48,28,35,.97)
    );

  box-shadow:

    0 28px 75px
    rgba(0,0,0,.23),

    inset 0 1px 0
    rgba(255,255,255,.10);

  isolation:isolate;

}


/* =========================================================
   BANNER CONTENT
========================================================= */

.romantic-banner-content{

  min-height:235px;

  position:relative;

  z-index:5;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  text-align:center;

  padding:30px;

}

.romantic-mini{

  font-size:10px;

  letter-spacing:6px;

  color:#e8bd9f;

  margin-bottom:8px;

  opacity:.9;

}

.romantic-banner h2{

  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-weight:400;

  font-size:
    clamp(28px,4vw,47px);

  letter-spacing:2px;

  line-height:1.25;

  text-shadow:
    0 5px 30px
    rgba(0,0,0,.35);

}

.romantic-banner h2 span{

  color:#e6aabd;

}

.romantic-subtitle{

  margin-top:10px;

  color:
    rgba(255,255,255,.73);

  font-size:14px;

  letter-spacing:2px;

}

.romantic-line{

  width:100px;

  height:1px;

  margin-top:19px;

  position:relative;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(230,176,145,.85),
      transparent
    );

}

.romantic-heart{

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  color:#e6a8ba;

  font-size:14px;

  background:#4c2b35;

  padding:0 8px;

}


/* =========================================================
   BANNER CORNERS
========================================================= */

.banner-corner{

  position:absolute;

  width:70px;

  height:70px;

  border-color:
    rgba(233,185,160,.32);

  border-style:solid;

  z-index:4;

}

.banner-corner.left-top{
  left:18px;
  top:18px;
  border-width:1px 0 0 1px;
  border-radius:15px 0 0 0;
}

.banner-corner.right-top{
  right:18px;
  top:18px;
  border-width:1px 1px 0 0;
  border-radius:0 15px 0 0;
}

.banner-corner.left-bottom{
  left:18px;
  bottom:18px;
  border-width:0 0 1px 1px;
  border-radius:0 0 0 15px;
}

.banner-corner.right-bottom{
  right:18px;
  bottom:18px;
  border-width:0 1px 1px 0;
  border-radius:0 0 15px 0;
}


/* =========================================================
   FOOTER
========================================================= */

footer{

  position:relative;

  z-index:2;

  overflow:hidden;

  isolation:isolate;

  text-align:center;

  padding:
    70px 20px 75px;

  color:
    rgba(255,255,255,.68);

  font-size:13px;

  background:

    linear-gradient(
      180deg,
      #21151b 0%,
      #24171e 50%,
      #1b1217 100%
    );

  border-top:
    1px solid
    rgba(255,255,255,.06);

}

footer span{

  position:relative;

  z-index:2;

}


/* =========================================================
   GALLERY
========================================================= */

.gallery-modal{

  position:fixed;

  inset:0;

  z-index:1000;

  background:
    rgba(15,10,13,.96);

  display:none;

  align-items:center;

  justify-content:center;

}

.gallery-modal.show{

  display:flex;

}

.gallery-container{

  width:100%;

  height:100%;

  display:flex;

  flex-direction:column;

  position:relative;

}

.gallery-header{

  height:65px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 20px;

  color:#fff;

  flex-shrink:0;

}

.gallery-title{

  font-size:17px;

  font-weight:600;

}

.gallery-close{

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

  color:#fff;

  font-size:25px;

  cursor:pointer;

}

.gallery-body{

  flex:1;

  min-height:0;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  overflow:hidden;

}

.gallery-track{

  width:100%;

  height:100%;

  display:flex;

  overflow-x:auto;

  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;

}

.gallery-track::-webkit-scrollbar{
  display:none;
}

.gallery-slide{

  min-width:100%;

  height:100%;

  scroll-snap-align:center;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:10px 70px;

}

.gallery-slide img{

  max-width:100%;

  max-height:100%;

  object-fit:contain;

  border-radius:6px;

  user-select:none;

  -webkit-user-drag:none;

}

.gallery-slide video{

  max-width:100%;

  max-height:100%;

  width:auto;

  height:auto;

  background:#000;

  border-radius:6px;

}

.gallery-arrow{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:48px;

  height:48px;

  border:0;

  border-radius:50%;

  background:
    rgba(255,255,255,.13);

  color:#fff;

  font-size:30px;

  cursor:pointer;

  z-index:5;

}

.gallery-prev{
  left:15px;
}

.gallery-next{
  right:15px;
}

.gallery-counter{

  height:55px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#aaa;

  font-size:13px;

}


/* =========================================================
   JOIN MODAL
========================================================= */

.join-modal{

  position:fixed;

  inset:0;

  z-index:1100;

  background:
    rgba(15,8,12,.68);

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  backdrop-filter:
    blur(8px);

}

.join-modal.show{
  display:flex;
}

.join-box{

  width:100%;

  max-width:410px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #fdf7f8
    );

  border-radius:20px;

  padding:32px;

  position:relative;

  text-align:center;

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.25);

}

.join-box h2{

  font-size:27px;

  margin-bottom:8px;

  color:#33272b;

}

.join-box p{

  color:#8b7b80;

  font-size:14px;

  margin-bottom:25px;

}

.join-close{

  position:absolute;

  top:12px;

  right:12px;

  width:35px;

  height:35px;

  border:0;

  border-radius:50%;

  background:#f1e8ea;

  color:#66565b;

  font-size:20px;

  cursor:pointer;

}

.join-contact{

  display:flex;

  flex-direction:column;

  gap:10px;

}

.join-contact a{

  display:flex;

  align-items:center;

  justify-content:center;

  padding:13px;

  border-radius:10px;

  font-weight:600;

  transition:.25s ease;

}

.join-contact a:hover{
  transform:translateY(-2px);
}

.join-whatsapp{
  background:#e7f6ec;
  color:#168743;
}

.join-telegram{
  background:#e7f1f9;
  color:#2480c5;
}

.no-contact{
  color:#999;
  font-size:13px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

  .women-grid{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}


@media(max-width:700px){

  .site-header{
    height:62px;
    padding:0 20px;
  }

  .brand{
    font-size:19px;
  }


  .hero{

    min-height:590px;

    padding:65px 25px;

    background-position:
      62% center;

    -webkit-mask-image:
      linear-gradient(
        to bottom,
        #000 0%,
        #000 91%,
        transparent 100%
      );

    mask-image:
      linear-gradient(
        to bottom,
        #000 0%,
        #000 91%,
        transparent 100%
      );

  }

  .hero h1{
    font-size:40px;
  }

  .hero p:not(.eyebrow){
    font-size:15px;
    line-height:1.8;
  }


  .profiles-area{

    padding-bottom:55px;

  }


  .toolbar{

    width:
      calc(100% - 30px);

    margin-top:30px;

    align-items:flex-start;

    flex-direction:column;

  }

  .section-title h2{
    font-size:23px;
  }


  .filters{
    width:100%;
  }

  .filters select{
    flex:1;
    width:50%;
  }


  .women-grid{

    width:
      calc(100% - 30px);

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:12px;

  }


  .woman-info{
    padding:13px;
  }

  .woman-info h2{
    font-size:17px;
  }

  .woman-info p{
    font-size:12px;
  }


  .more-card{
    min-height:360px;
  }

  .more-card-content{
    min-height:360px;
    padding:18px;
  }

  .more-card-content h2{
    font-size:20px;
  }

  .more-card-content p{
    font-size:12px;
  }


  .romantic-banner{

    width:
      calc(100% - 30px);

    min-height:210px;

    margin:
      0 auto;

    border-radius:20px;

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://yutraouosffjteivvlfx.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


const STORAGE_BUCKET =
  "women-photos";


let women = [];


let joinContact = {
  whatsapp:"",
  telegram:""
};


/* =========================================================
   BASIC
========================================================= */

document
  .getElementById("year")
  .textContent =
  new Date().getFullYear();


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   MEDIA
========================================================= */

function normalizeMedia(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){

    return value
      .flat(Infinity)
      .filter(Boolean)
      .map(v => String(v).trim())
      .filter(Boolean);

  }


  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){
      return [];
    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed
          .flat(Infinity)
          .filter(Boolean)
          .map(v => String(v).trim())
          .filter(Boolean);

      }

    }catch(e){}


    if(text.includes(",")){

      return text
        .split(",")
        .map(v => v.trim())
        .filter(Boolean);

    }


    return [text];

  }


  return [];

}


/* =========================================================
   STORAGE URL
========================================================= */

function getStorageUrl(path){

  if(!path){
    return "";
  }


  const value =
    String(path).trim();


  if(

    value.startsWith("http://") ||

    value.startsWith("https://") ||

    value.startsWith("data:")

  ){

    return value;

  }


  return (

    SUPABASE_URL +

    "/storage/v1/object/public/" +

    STORAGE_BUCKET +

    "/" +

    value.replace(/^\/+/,"")

  );

}


/* =========================================================
   PHOTOS
========================================================= */

function getPhotos(woman){

  let photos = [];


  if(woman.image_url){

    photos.push(
      woman.image_url
    );

  }


  photos =
    photos.concat(
      normalizeMedia(
        woman.photos
      )
    );


  return [

    ...new Set(

      photos
        .filter(Boolean)
        .map(getStorageUrl)

    )

  ];

}


/* =========================================================
   VIDEOS
========================================================= */

function getVideos(woman){

  return [

    ...new Set(

      normalizeMedia(
        woman.videos
      )
      .filter(Boolean)
      .map(getStorageUrl)

    )

  ];

}


/* =========================================================
   LOAD WOMEN
========================================================= */

async function loadWomen(){

  const grid =
    document.getElementById(
      "womenGrid"
    );


  try{

    const url =

      SUPABASE_URL +

      "/rest/v1/women" +

      "?select=*" +

      "&is_published=eq.true" +

      "&order=created_at.desc";


    const response =
      await fetch(
        url,
        {
          headers:{
            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(
        text
      );

    }


    women =
      JSON.parse(text) || [];


    createCityFilter();

    renderWomen(women);


  }catch(error){

    console.error(error);


    grid.innerHTML = `

      <div class="loading">
        暂时无法加载资料。
      </div>

    `;

  }

}


/* =========================================================
   CITY FILTER
========================================================= */

function createCityFilter(){

  const select =
    document.getElementById(
      "cityFilter"
    );


  const cities = [

    ...new Set(

      women
        .map(w => w.city)
        .filter(Boolean)

    )

  ];


  select.innerHTML = `

    <option value="">
      全部城市
    </option>

  `;


  cities.forEach(city => {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      city;

    option.textContent =
      city;


    select.appendChild(
      option
    );

  });

}


/* =========================================================
   RENDER WOMEN
========================================================= */

function renderWomen(list){

  const grid =
    document.getElementById(
      "womenGrid"
    );


  grid.innerHTML = "";


  list.forEach(woman => {

    const photos =
      getPhotos(woman);


    const cover =

      photos[0] ||

      "data:image/svg+xml;charset=UTF-8," +

      encodeURIComponent(`

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="600"
          height="800"
        >

          <rect
            width="600"
            height="800"
            fill="#eee6e8"
          />

          <text
            x="300"
            y="400"
            text-anchor="middle"
            font-size="28"
            fill="#999"
          >
            暂无照片
          </text>

        </svg>

      `);


    const card =
      document.createElement(
        "article"
      );


    card.className =
      "woman-card";


    card.innerHTML = `

      <div class="woman-image">

        <img
          src="${escapeHtml(cover)}"
          alt="${escapeHtml(
            woman.name || "女士"
          )}"
          loading="lazy"
        >

      </div>


      <div class="woman-info">

        <h2>

          ${escapeHtml(
            woman.name ||
            "未填写姓名"
          )}

          ${
            woman.age
              ? " · " +
                escapeHtml(woman.age) +
                "岁"
              : ""
          }

        </h2>


        ${
          woman.city
            ? `
              <p class="city">
                ${escapeHtml(woman.city)}
              </p>
            `
            : ""
        }


        ${
          woman.occupation
            ? `
              <p>
                ${escapeHtml(
                  woman.occupation
                )}
              </p>
            `
            : ""
        }


        ${
          woman.description
            ? `
              <p class="description">
                ${escapeHtml(
                  woman.description
                )}
              </p>
            `
            : ""
        }

      </div>

    `;


    card.addEventListener(
      "click",
      () => openGallery(woman)
    );


    grid.appendChild(card);

  });


  /* =====================================================
     MORE CARD
  ===================================================== */

  const moreCard =
    document.createElement(
      "article"
    );


  moreCard.className =
    "more-card";


  moreCard.innerHTML = `

    <div class="more-card-bg"></div>

    <div class="more-card-content">

      <h2>
        更多女士正在加入中
      </h2>

      <p>
        如果你也希望认识更多优秀的人，
        或希望申请加入我们的资料展示，
        欢迎联系我们。
      </p>

      <div class="join-button">
        申请加入
      </div>

    </div>

  `;


  moreCard.addEventListener(
    "click",
    openJoinModal
  );


  grid.appendChild(
    moreCard
  );

}


/* =========================================================
   GALLERY
========================================================= */

let galleryMedia = [];

let galleryIndex = 0;


function openGallery(woman){

  const photos =
    getPhotos(woman);

  const videos =
    getVideos(woman);


  galleryMedia = [];


  photos.forEach(url => {

    galleryMedia.push({
      type:"image",
      url
    });

  });


  videos.forEach(url => {

    galleryMedia.push({
      type:"video",
      url
    });

  });


  if(!galleryMedia.length){
    return;
  }


  galleryIndex = 0;


  document
    .getElementById("galleryTitle")
    .textContent =
    woman.name ||
    "女士资料";


  renderGallery();


  document
    .getElementById("galleryModal")
    .classList.add("show");


  document.body.style.overflow =
    "hidden";

}


/* =========================================================
   RENDER GALLERY
========================================================= */

function renderGallery(){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.innerHTML = "";


  galleryMedia.forEach(media => {

    const slide =
      document.createElement(
        "div"
      );


    slide.className =
      "gallery-slide";


    if(media.type === "image"){

      slide.innerHTML = `

        <img
          src="${escapeHtml(media.url)}"
          draggable="false"
        >

      `;

    }else{

      slide.innerHTML = `

        <video
          controls
          playsinline
          preload="metadata"
        >

          <source
            src="${escapeHtml(media.url)}"
          >

        </video>

      `;

    }


    track.appendChild(slide);

  });


  updateGalleryCounter();


  requestAnimationFrame(() => {

    track.scrollLeft =
      track.clientWidth *
      galleryIndex;

  });

}


/* =========================================================
   GALLERY COUNTER
========================================================= */

function updateGalleryCounter(){

  const counter =
    document.getElementById(
      "galleryCounter"
    );


  if(galleryMedia.length){

    counter.textContent =

      `${galleryIndex + 1} / ${galleryMedia.length} · 左右滑动查看`;

  }

}


/* =========================================================
   GALLERY GO TO
========================================================= */

function galleryGoTo(index){

  if(!galleryMedia.length){
    return;
  }


  if(index < 0){

    index =
      galleryMedia.length - 1;

  }


  if(index >= galleryMedia.length){

    index = 0;

  }


  galleryIndex =
    index;


  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.scrollTo({

    left:
      track.clientWidth *
      galleryIndex,

    behavior:"smooth"

  });


  updateGalleryCounter();

}


/* =========================================================
   GALLERY SCROLL
========================================================= */

document
  .getElementById("galleryTrack")
  .addEventListener(
    "scroll",
    function(){

      const width =
        this.clientWidth;


      if(!width){
        return;
      }


      const index =
        Math.round(
          this.scrollLeft /
          width
        );


      if(index !== galleryIndex){

        galleryIndex =
          index;

        updateGalleryCounter();

      }

    }
  );


/* =========================================================
   GALLERY BUTTONS
========================================================= */

document
  .getElementById("galleryPrev")
  .addEventListener(
    "click",
    () =>
      galleryGoTo(
        galleryIndex - 1
      )
  );


document
  .getElementById("galleryNext")
  .addEventListener(
    "click",
    () =>
      galleryGoTo(
        galleryIndex + 1
      )
  );


document
  .getElementById("galleryClose")
  .addEventListener(
    "click",
    closeGallery
  );


function closeGallery(){

  document
    .getElementById("galleryModal")
    .classList.remove("show");


  document.body.style.overflow =
    "";


  document
    .querySelectorAll(
      "#galleryTrack video"
    )
    .forEach(
      video => video.pause()
    );

}


/* =========================================================
   JOIN CONTACT
========================================================= */

async function loadJoinContact(){

  try{

    const url =

      SUPABASE_URL +

      "/rest/v1/site_settings" +

      "?select=whatsapp,telegram" +

      "&setting_key=eq.join_contact" +

      "&limit=1";


    const response =
      await fetch(
        url,
        {
          headers:{
            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    if(data.length){

      joinContact =
        data[0];

    }


  }catch(error){

    console.error(
      "联系方式加载失败:",
      error
    );

  }

}


/* =========================================================
   WHATSAPP
========================================================= */

function makeWhatsAppUrl(value){

  const number =
    String(value || "")
      .replace(/[^\d]/g,"");


  if(!number){
    return "";
  }


  return (
    "https://wa.me/" +
    number
  );

}


/* =========================================================
   TELEGRAM
========================================================= */

function makeTelegramUrl(value){

  let username =
    String(value || "")
      .trim();


  if(!username){
    return "";
  }


  if(

    username.startsWith(
      "https://t.me/"
    )

    ||

    username.startsWith(
      "http://t.me/"
    )

  ){

    return username;

  }


  username =
    username.replace(
      /^@/,
      ""
    );


  return (
    "https://t.me/" +
    username
  );

}


/* =========================================================
   JOIN MODAL
========================================================= */

function openJoinModal(){

  const box =
    document.getElementById(
      "joinContacts"
    );


  box.innerHTML = "";


  const whatsappUrl =
    makeWhatsAppUrl(
      joinContact.whatsapp
    );


  const telegramUrl =
    makeTelegramUrl(
      joinContact.telegram
    );


  if(whatsappUrl){

    const a =
      document.createElement(
        "a"
      );


    a.href =
      whatsappUrl;

    a.target =
      "_blank";

    a.rel =
      "noopener";

    a.className =
      "join-whatsapp";

    a.textContent =
      "WhatsApp 联系我们";


    box.appendChild(a);

  }


  if(telegramUrl){

    const a =
      document.createElement(
        "a"
      );


    a.href =
      telegramUrl;

    a.target =
      "_blank";

    a.rel =
      "noopener";

    a.className =
      "join-telegram";

    a.textContent =
      "Telegram 联系我们";


    box.appendChild(a);

  }


  if(
    !whatsappUrl &&
    !telegramUrl
  ){

    box.innerHTML = `

      <div class="no-contact">
        暂无联系方式，请稍后再试。
      </div>

    `;

  }


  document
    .getElementById("joinModal")
    .classList.add("show");

}


/* =========================================================
   CLOSE JOIN MODAL
========================================================= */

function closeJoinModal(){

  document
    .getElementById("joinModal")
    .classList.remove("show");

}


document
  .getElementById("joinClose")
  .addEventListener(
    "click",
    closeJoinModal
  );


document
  .getElementById("joinModal")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){

        closeJoinModal();

      }

    }
  );


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){

      closeGallery();

      closeJoinModal();

    }


    if(

      document
        .getElementById("galleryModal")
        .classList
        .contains("show")

    ){

      if(event.key === "ArrowLeft"){

        galleryGoTo(
          galleryIndex - 1
        );

      }


      if(event.key === "ArrowRight"){

        galleryGoTo(
          galleryIndex + 1
        );

      }

    }

  }
);


/* =========================================================
   FILTER
========================================================= */

function filterWomen(){

  const city =
    document
      .getElementById("cityFilter")
      .value;


  const age =
    document
      .getElementById("ageFilter")
      .value;


  const filtered =
    women.filter(woman => {

      if(
        city &&
        woman.city !== city
      ){

        return false;

      }


      const womanAge =
        Number(woman.age);


      if(age === "18-25"){

        return (
          womanAge >= 18 &&
          womanAge <= 25
        );

      }


      if(age === "26-35"){

        return (
          womanAge >= 26 &&
          womanAge <= 35
        );

      }


      if(age === "36-45"){

        return (
          womanAge >= 36 &&
          womanAge <= 45
        );

      }


      if(age === "46+"){

        return womanAge >= 46;

      }


      return true;

    });


  renderWomen(filtered);

}


/* =========================================================
   FILTER EVENTS
========================================================= */

document
  .getElementById("cityFilter")
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById("ageFilter")
  .addEventListener(
    "change",
    filterWomen
  );


/* =========================================================
   START
========================================================= */

Promise.all([

  loadWomen(),

  loadJoinContact()

]);

</script>
