<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Supabase 测试</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body style="
font-family:Arial,sans-serif;
padding:30px;
">

<h1>Supabase 数据库测试</h1>

<div id="result">
正在连接 Supabase……
</div>

<script>

const SUPABASE_URL =
"https://yutraouosffjteivvlfx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9kM95KpOX6WPwcXowvPbWQ_s0_YJUEA";


const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function testDatabase() {

const result =
document.getElementById("result");


try {

const response =
await client
.from("women")
.select("*");


if (response.error) {

result.innerHTML = `

<h2 style="color:red;">
数据库连接失败
</h2>

<p>
${response.error.message}
</p>

<pre>
${JSON.stringify(
response.error,
null,
2
)}
</pre>

`;

return;

}


const data =
response.data;


if (!data || data.length === 0) {

result.innerHTML = `

<h2 style="color:orange;">
数据库连接成功
</h2>

<p>
但是 women 表目前没有数据。
</p>

`;

return;

}


result.innerHTML = `

<h2 style="color:green;">
✅ Supabase 连接成功
</h2>

<p>
成功读取 ${data.length} 条女士资料。
</p>

<pre style="
white-space:pre-wrap;
word-break:break-word;
background:#f5f5f5;
padding:20px;
border-radius:10px;
">
${JSON.stringify(
data,
null,
2
)}
</pre>

`;

}

catch(error) {

result.innerHTML = `

<h2 style="color:red;">
发生错误
</h2>

<pre style="
white-space:pre-wrap;
word-break:break-word;
">
${error.message || error}
</pre>

`;

}

}


testDatabase();

</script>

</body>

</html>
