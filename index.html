<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分·相遇</title>

<meta
  name="description"
  content="认真认识一个人，从一次相遇开始。"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  color:#30272a;

  line-height:1.6;

  overflow-x:hidden;

  background:
    linear-gradient(
      180deg,
      #f7f1f3 0%,
      #f5e9ed 48%,
      #f2e3e8 100%
    );

}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================================================
   全站动态 CANVAS
   ★ 注意：
   Canvas 低于资料卡区域
========================================================= */

#romanceCanvas{

  position:fixed;

  inset:0;

  width:100vw;

  height:100vh;

  /*
    全站特效层
    高于普通页面背景
    低于 profiles-area
  */
  z-index:20;

  pointer-events:none;

  opacity:.95;

}


/* =========================================================
   全站动态光晕
   最底层背景
========================================================= */

.romance-glow{

  position:fixed;

  inset:0;

  z-index:0;

  pointer-events:none;

  overflow:hidden;

  background:

    radial-gradient(
      circle at 8% 12%,
      rgba(222,139,162,.16),
      transparent 25%
    ),

    radial-gradient(
      circle at 91% 17%,
      rgba(240,193,151,.15),
      transparent 25%
    ),

    radial-gradient(
      circle at 8% 70%,
      rgba(205,126,151,.12),
      transparent 28%
    ),

    radial-gradient(
      circle at 92% 78%,
      rgba(235,181,145,.12),
      transparent 27%
    );

}


.romance-glow::before{

  content:"";

  position:absolute;

  width:620px;

  height:620px;

  left:-260px;

  top:20%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(222,130,157,.22),
      rgba(222,130,157,.06) 42%,
      transparent 72%
    );

  filter:blur(45px);

  animation:
    globalGlowOne 14s ease-in-out infinite;

}


.romance-glow::after{

  content:"";

  position:absolute;

  width:650px;

  height:650px;

  right:-280px;

  top:48%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(239,190,145,.20),
      rgba(239,190,145,.05) 45%,
      transparent 73%
    );

  filter:blur(50px);

  animation:
    globalGlowTwo 18s ease-in-out infinite;

}


@keyframes globalGlowOne{

  0%,
  100%{
    transform:
      translate3d(0,0,0)
      scale(.85);
    opacity:.45;
  }

  50%{
    transform:
      translate3d(260px,100px,0)
      scale(1.25);
    opacity:1;
  }

}


@keyframes globalGlowTwo{

  0%,
  100%{
    transform:
      translate3d(0,0,0)
      scale(.9);
    opacity:.4;
  }

  50%{
    transform:
      translate3d(-230px,-130px,0)
      scale(1.25);
    opacity:1;
  }

}


/* =========================================================
   HEADER
========================================================= */

.site-header{

  height:72px;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  padding:0 6%;

  position:sticky;

  top:0;

  z-index:100;

  color:#fff;

  background:
    linear-gradient(
      90deg,
      rgba(27,18,22,.98),
      rgba(52,31,38,.96)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 5px 25px
    rgba(0,0,0,.15);

}

.brand{

  font-size:22px;

  font-weight:700;

  letter-spacing:2px;

  color:#fff;

}

.brand span{

  color:#df9faf;

  margin:0 4px;

}


/* =========================================================
   HERO
========================================================= */

.hero{

  min-height:610px;

  display:flex;

  align-items:center;

  position:relative;

  z-index:2;

  padding:90px 8%;

  overflow:hidden;

  color:#fff;

  background-image:

    linear-gradient(
      90deg,
      rgba(20,13,17,.90) 0%,
      rgba(28,18,22,.72) 38%,
      rgba(30,20,24,.44) 70%,
      rgba(20,14,18,.28) 100%
    ),

    url(
      "https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png"
    );

  background-size:cover;

  background-position:center;

  isolation:isolate;

}


.hero::before{

  content:"";

  position:absolute;

  width:600px;

  height:600px;

  left:-250px;

  bottom:-300px;

  border-radius:50%;

  background:
    rgba(213,128,151,.22);

  filter:blur(105px);

  animation:
    heroGlow 12s ease-in-out infinite;

}


.hero::after{

  content:"";

  position:absolute;

  width:480px;

  height:480px;

  right:-180px;

  top:-190px;

  border-radius:50%;

  background:
    rgba(239,179,155,.17);

  filter:blur(100px);

  animation:
    heroGlow 15s ease-in-out infinite reverse;

}


@keyframes heroGlow{

  0%,
  100%{
    transform:scale(.88);
    opacity:.4;
  }

  50%{
    transform:scale(1.28);
    opacity:1;
  }

}


.hero > div{

  max-width:720px;

  position:relative;

  z-index:5;

}

.eyebrow{

  font-size:12px;

  letter-spacing:5px;

  color:#e8a8b8;

  margin-bottom:20px;

  font-weight:600;

}

.hero h1{

  font-size:
    clamp(40px,6vw,76px);

  line-height:1.16;

  font-weight:600;

  letter-spacing:1px;

  margin-bottom:26px;

  text-shadow:
    0 4px 25px
    rgba(0,0,0,.28);

}

.hero p:not(.eyebrow){

  color:
    rgba(255,255,255,.84);

  font-size:17px;

  max-width:550px;

  line-height:1.9;

}

.hero-label{

  margin-top:35px;

  display:flex;

  align-items:center;

  gap:12px;

  color:
    rgba(255,255,255,.62);

  font-size:13px;

}

.hero-label::before{

  content:"";

  width:34px;

  height:1px;

  background:#d99cac;

}


/* =========================================================
   CONTENT
========================================================= */

.content-section{

  position:relative;

  z-index:2;

  /*
    ★ 从 hidden 改为 visible
    避免父层裁切资料卡区域
  */
  overflow:visible;

  padding-top:1px;

  background:

    radial-gradient(
      circle at 5% 10%,
      rgba(218,143,164,.18),
      transparent 30%
    ),

    radial-gradient(
      circle at 95% 30%,
      rgba(229,181,149,.16),
      transparent 31%
    ),

    radial-gradient(
      circle at 50% 82%,
      rgba(205,132,155,.12),
      transparent 35%
    ),

    linear-gradient(
      180deg,
      rgba(249,243,245,.80),
      rgba(246,235,239,.72),
      rgba(240,221,228,.78)
    );

}


/* =========================================================
   ★★★★★
   资料卡区域
   ★★★★★

   这里是本次修改的核心。

   Canvas：
   z-index:20

   profiles-area：
   z-index:30

   所以 Canvas 永远无法覆盖资料卡区域。

   资料卡区域内部：

   背景       z-index:0
   氛围       z-index:1
   装饰       z-index:2
   Toolbar    z-index:5
   Grid       z-index:6
   Card       z-index:7
========================================================= */

.profiles-area{

  width:100%;

  position:relative;

  /*
    ★★★★★
    整个资料卡区域提升到 Canvas 上方
  */
  z-index:30;

  /*
    独立层叠上下文
  */
  isolation:isolate;

  overflow:hidden;

  padding-bottom:70px;

  /*
    ★ 直接给整个区域主题背景
    防止资料卡之间出现白色空洞
  */
  background:

    radial-gradient(
      ellipse at 8% 12%,
      rgba(225,150,174,.30),
      transparent 30%
    ),

    radial-gradient(
      ellipse at 92% 22%,
      rgba(240,194,157,.27),
      transparent 31%
    ),

    radial-gradient(
      ellipse at 18% 65%,
      rgba(215,137,163,.22),
      transparent 34%
    ),

    radial-gradient(
      ellipse at 82% 76%,
      rgba(237,181,150,.22),
      transparent 35%
    ),

    linear-gradient(
      180deg,
      #faf4f6 0%,
      #f7e9ee 30%,
      #f3e1e7 65%,
      #eed9e1 100%
    );

}


/* =========================================================
   资料卡区域主题背景
   第一层
========================================================= */

.profiles-area::before{

  content:"";

  position:absolute;

  inset:0;

  z-index:0;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse 45% 35% at 12% 18%,
      rgba(221,137,163,.28),
      transparent 70%
    ),

    radial-gradient(
      ellipse 50% 40% at 88% 20%,
      rgba(239,188,151,.25),
      transparent 72%
    ),

    radial-gradient(
      ellipse 55% 45% at 50% 58%,
      rgba(255,255,255,.62),
      transparent 72%
    ),

    radial-gradient(
      ellipse 48% 38% at 15% 88%,
      rgba(211,128,156,.24),
      transparent 72%
    ),

    radial-gradient(
      ellipse 50% 42% at 88% 88%,
      rgba(232,175,145,.23),
      transparent 72%
    );

}


/* =========================================================
   资料卡区域梦幻光晕
   第二层
========================================================= */

.profiles-area::after{

  content:"";

  position:absolute;

  inset:-10%;

  z-index:1;

  pointer-events:none;

  background:

    radial-gradient(
      circle at 20% 20%,
      rgba(255,255,255,.72),
      transparent 15%
    ),

    radial-gradient(
      circle at 80% 18%,
      rgba(255,226,218,.62),
      transparent 18%
    ),

    radial-gradient(
      circle at 50% 48%,
      rgba(255,255,255,.42),
      transparent 25%
    ),

    radial-gradient(
      circle at 30% 82%,
      rgba(255,219,229,.36),
      transparent 22%
    ),

    radial-gradient(
      circle at 76% 84%,
      rgba(255,224,202,.34),
      transparent 23%
    );

  filter:blur(28px);

  opacity:.9;

  animation:
    profileAmbient 15s ease-in-out infinite alternate;

}


@keyframes profileAmbient{

  0%{

    transform:
      translate3d(-1.5%,0,0)
      scale(1);

    opacity:.72;

  }

  50%{

    transform:
      translate3d(0,1%,0)
      scale(1.035);

    opacity:.92;

  }

  100%{

    transform:
      translate3d(1.5%,2%,0)
      scale(1.07);

    opacity:.78;

  }

}


/* =========================================================
   背景装饰花瓣
   第三层
========================================================= */

.profile-decoration{

  position:absolute;

  inset:0;

  z-index:2;

  pointer-events:none;

  overflow:hidden;

}


.profile-decoration span{

  position:absolute;

  display:block;

  width:120px;

  height:170px;

  border-radius:
    100% 0 100% 0;

  background:

    linear-gradient(
      135deg,
      rgba(226,153,176,.22),
      rgba(247,190,198,.10),
      transparent
    );

  filter:blur(1px);

  opacity:.5;

  animation:
    decorationFloat 12s ease-in-out infinite;

}


.profile-decoration span:nth-child(1){

  left:-35px;

  top:9%;

  animation-delay:-2s;

}


.profile-decoration span:nth-child(2){

  right:-45px;

  top:25%;

  transform:rotate(130deg);

  animation-delay:-6s;

}


.profile-decoration span:nth-child(3){

  left:8%;

  bottom:2%;

  transform:rotate(210deg);

  animation-delay:-9s;

}


.profile-decoration span:nth-child(4){

  right:12%;

  bottom:8%;

  transform:rotate(60deg);

  animation-delay:-4s;

}


@keyframes decorationFloat{

  0%,
  100%{

    transform:
      translate3d(0,0,0)
      rotate(25deg);

    opacity:.32;

  }

  50%{

    transform:
      translate3d(30px,-35px,0)
      rotate(48deg);

    opacity:.72;

  }

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  width:88%;

  max-width:1400px;

  margin:35px auto 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  flex-wrap:wrap;

  position:relative;

  /*
    高于资料卡背景
  */
  z-index:5;

}

.section-title{

  color:#392c30;

}

.section-title small{

  display:block;

  font-size:11px;

  letter-spacing:4px;

  color:#b97889;

  margin-bottom:4px;

}

.section-title h2{

  font-size:27px;

  font-weight:600;

}

.filters{

  display:flex;

  gap:10px;

}

.filters select{

  appearance:none;

  border:
    1px solid
    #dfcbd2;

  background:
    rgba(255,255,255,.90);

  padding:
    11px 40px 11px 15px;

  border-radius:10px;

  color:#4b4043;

  cursor:pointer;

  outline:none;

  box-shadow:
    0 5px 20px
    rgba(72,42,50,.06);

}

.filters select:focus{

  border-color:#c58a9a;

}


/* =========================================================
   GRID
========================================================= */

.women-grid{

  width:88%;

  max-width:1400px;

  margin:0 auto;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:24px;

  position:relative;

  /*
    资料卡内容层
  */
  z-index:6;

}


/* =========================================================
   CARD
========================================================= */

.woman-card{

  position:relative;

  /*
    ★ 卡片本身最高层
  */
  z-index:7;

  background:
    rgba(255,255,255,.94);

  border-radius:18px;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.88);

  transition:
    transform .35s ease,
    box-shadow .35s ease;

  cursor:pointer;

  box-shadow:

    0 12px 40px
    rgba(73,40,51,.12),

    0 2px 8px
    rgba(73,40,51,.05);

  backdrop-filter:
    blur(10px);

  /*
    卡片自己成为独立层
    防止内部出现异常穿透
  */
  isolation:isolate;

}


.woman-card:hover{

  transform:
    translateY(-7px);

  box-shadow:

    0 25px 65px
    rgba(73,40,51,.18),

    0 4px 15px
    rgba(73,40,51,.08);

}


/* =========================================================
   IMAGE
========================================================= */

.woman-image{

  width:100%;

  aspect-ratio:3 / 4;

  background:#eee5e8;

  overflow:hidden;

  position:relative;

}

.woman-image::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:2;

  background:
    linear-gradient(
      to bottom,
      transparent 48%,
      rgba(30,20,24,.16)
    );

}

.woman-image::before{

  content:"♥";

  position:absolute;

  right:12px;

  top:12px;

  z-index:3;

  width:32px;

  height:32px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  color:rgba(255,255,255,.92);

  background:
    rgba(60,30,42,.24);

  backdrop-filter:
    blur(5px);

  font-size:14px;

  opacity:.85;

}


.woman-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:
    transform .6s ease;

}

.woman-card:hover
.woman-image img{

  transform:
    scale(1.045);

}


/* =========================================================
   INFO
========================================================= */

.woman-info{

  padding:
    18px 18px 20px;

  position:relative;

  z-index:3;

  background:
    rgba(255,255,255,.94);

}

.woman-info h2{

  font-size:20px;

  font-weight:600;

  color:#332a2d;

  margin-bottom:5px;

}

.city{

  color:#b77b8b;

  font-size:13px;

  margin-bottom:7px;

}

.woman-info p{

  color:#827579;

  font-size:13px;

}

.description{

  margin-top:8px;

  line-height:1.7;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;

}


/* =========================================================
   MORE CARD
========================================================= */

.more-card{

  position:relative;

  /*
    和资料卡保持同一最高层
  */
  z-index:7;

  min-height:100%;

  overflow:hidden;

  border-radius:18px;

  cursor:pointer;

  background:#281c21;

  min-height:400px;

  box-shadow:
    0 15px 45px
    rgba(58,34,42,.16);

  isolation:isolate;

}

.more-card-bg{

  position:absolute;

  inset:0;

  z-index:0;

  background-image:

    linear-gradient(
      rgba(30,17,22,.20),
      rgba(27,16,21,.86)
    ),

    url(
      "https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png"
    );

  background-size:cover;

  background-position:center;

  transition:
    transform .6s ease;

}

.more-card:hover
.more-card-bg{

  transform:
    scale(1.05);

}

.more-card-content{

  position:relative;

  z-index:2;

  min-height:100%;

  padding:30px;

  display:flex;

  flex-direction:column;

  justify-content:flex-end;

  color:#fff;

}

.more-card-content h2{

  font-size:26px;

  line-height:1.3;

  margin-bottom:12px;

}

.more-card-content p{

  color:
    rgba(255,255,255,.82);

  font-size:14px;

  line-height:1.8;

  margin-bottom:20px;

}

.join-button{

  display:flex;

  align-items:center;

  justify-content:center;

  width:100%;

  padding:13px;

  background:#fff;

  color:#33282c;

  border-radius:10px;

  font-weight:600;

  transition:.25s ease;

}

.more-card:hover
.join-button{

  background:#f3dce2;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

  grid-column:1 / -1;

  text-align:center;

  padding:80px 20px;

  color:#9a898e;

  position:relative;

  z-index:6;

}


/* =========================================================
   ROMANTIC BANNER
========================================================= */

.romantic-banner{

  width:88%;

  max-width:1400px;

  min-height:235px;

  margin:55px auto 70px;

  position:relative;

  /*
    Banner 也位于 Canvas 上方
  */
  z-index:30;

  overflow:hidden;

  border-radius:25px;

  border:
    1px solid
    rgba(255,255,255,.24);

  background:

    linear-gradient(
      115deg,
      rgba(36,20,27,.97),
      rgba(75,42,51,.94),
      rgba(50,29,35,.96)
    );

  box-shadow:

    0 28px 75px
    rgba(57,31,40,.22),

    inset 0 1px 0
    rgba(255,255,255,.12);

  isolation:isolate;

}


.romantic-banner::before{

  content:"";

  position:absolute;

  width:520px;

  height:520px;

  left:-200px;

  top:-290px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      rgba(225,144,164,.42),
      rgba(225,144,164,.06) 50%,
      transparent 72%
    );

  filter:blur(18px);

  animation:
    bannerLight 10s ease-in-out infinite;

}


.romantic-banner::after{

  content:"";

  position:absolute;

  width:540px;

  height:540px;

  right:-240px;

  bottom:-350px;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      rgba(232,190,146,.38),
      rgba(232,190,146,.05) 50%,
      transparent 73%
    );

  filter:blur(18px);

  animation:
    bannerLightTwo 13s ease-in-out infinite;

}


@keyframes bannerLight{

  0%,
  100%{
    transform:
      translate3d(0,0,0)
      scale(.9);
    opacity:.5;
  }

  50%{
    transform:
      translate3d(180px,100px,0)
      scale(1.25);
    opacity:1;
  }

}


@keyframes bannerLightTwo{

  0%,
  100%{
    transform:
      translate3d(0,0,0)
      scale(1);
    opacity:.45;
  }

  50%{
    transform:
      translate3d(-150px,-100px,0)
      scale(1.22);
    opacity:.95;
  }

}


.romantic-banner-content{

  min-height:235px;

  position:relative;

  z-index:5;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  text-align:center;

  padding:30px;

}


.romantic-mini{

  font-size:10px;

  letter-spacing:6px;

  color:#e8bd9f;

  margin-bottom:8px;

  opacity:.9;

}


.romantic-banner h2{

  color:#fff;

  font-family:
    Georgia,

<script>

/* =========================================================
   ROMANTIC CANVAS
   樱花 + 爱心 + 香槟 + 星芒

   ★ Canvas 仍然是全站特效
   ★ 但是 profiles-area 的 z-index:30
   ★ 所以不会盖住资料卡
========================================================= */

const romanceCanvas =
  document.getElementById("romanceCanvas");

const romanceCtx =
  romanceCanvas.getContext("2d");

let romanceParticles = [];

let romanceWidth = 0;

let romanceHeight = 0;

let romanceDpr =
  Math.min(
    window.devicePixelRatio || 1,
    2
  );


function resizeRomanceCanvas(){

  romanceWidth =
    window.innerWidth;

  romanceHeight =
    window.innerHeight;

  romanceDpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  romanceCanvas.width =
    romanceWidth * romanceDpr;

  romanceCanvas.height =
    romanceHeight * romanceDpr;

  romanceCanvas.style.width =
    romanceWidth + "px";

  romanceCanvas.style.height =
    romanceHeight + "px";

  romanceCtx.setTransform(
    romanceDpr,
    0,
    0,
    romanceDpr,
    0,
    0
  );

}


resizeRomanceCanvas();


window.addEventListener(
  "resize",
  resizeRomanceCanvas
);


/* =========================================================
   PARTICLE
========================================================= */

class RomanceParticle{

  constructor(){

    this.reset(true);

  }


  reset(initial){

    this.type =
      this.randomType();

    this.x =
      Math.random() *
      romanceWidth;

    this.y =

      initial

        ?

      Math.random() *
      romanceHeight

        :

      -40;


    this.size =

      this.type === "petal"

        ?

      5 +
      Math.random() * 8

        :

      this.type === "heart"

        ?

      5 +
      Math.random() * 8

        :

      this.type === "star"

        ?

      2 +
      Math.random() * 4

        :

      1 +
      Math.random() * 3;


    this.speedY =

      this.type === "petal"

        ?

      .25 +
      Math.random() * .65

        :

      this.type === "heart"

        ?

      .12 +
      Math.random() * .35

        :

      .08 +
      Math.random() * .30;


    this.speedX =
      -.25 +
      Math.random() * .5;


    this.rotation =
      Math.random() *
      Math.PI *
      2;


    this.rotationSpeed =
      -.012 +
      Math.random() * .024;


    this.wave =
      Math.random() *
      Math.PI *
      2;


    this.waveSpeed =
      .008 +
      Math.random() * .018;


    this.opacity =
      .14 +
      Math.random() * .52;


    this.life =
      Math.random() *
      Math.PI *
      2;


    this.lifeSpeed =
      .008 +
      Math.random() * .018;

  }


  randomType(){

    const value =
      Math.random();


    /*
      43% 樱花
      20% 爱心
      20% 香槟
      17% 星芒
    */

    if(value < .43){
      return "petal";
    }

    if(value < .63){
      return "heart";
    }

    if(value < .83){
      return "champagne";
    }

    return "star";

  }


  update(){

    this.y +=
      this.speedY;

    this.wave +=
      this.waveSpeed;

    this.x +=

      this.speedX +

      Math.sin(
        this.wave
      ) * .22;

    this.rotation +=
      this.rotationSpeed;

    this.life +=
      this.lifeSpeed;


    if(
      this.y >
      romanceHeight + 50
    ){

      this.reset(false);

    }


    if(
      this.x <
      -50
    ){

      this.x =
        romanceWidth + 20;

    }


    if(
      this.x >
      romanceWidth + 50
    ){

      this.x =
        -20;

    }

  }


  draw(){

    const ctx =
      romanceCtx;


    const pulse =
      .68 +
      Math.sin(
        this.life
      ) * .32;


    ctx.save();

    ctx.translate(
      this.x,
      this.y
    );

    ctx.rotate(
      this.rotation
    );

    ctx.globalAlpha =
      this.opacity * pulse;


    /* =====================================================
       樱花
    ===================================================== */

    if(
      this.type === "petal"
    ){

      ctx.beginPath();

      ctx.moveTo(
        0,
        -this.size
      );

      ctx.bezierCurveTo(
        this.size * 1.4,
        -this.size * .7,
        this.size * 1.25,
        this.size * .9,
        0,
        this.size
      );

      ctx.bezierCurveTo(
        -this.size * 1.25,
        this.size * .9,
        -this.size * 1.4,
        -this.size * .7,
        0,
        -this.size
      );

      ctx.closePath();


      const gradient =
        ctx.createLinearGradient(
          0,
          -this.size,
          0,
          this.size
        );


      gradient.addColorStop(
        0,
        "rgba(255,225,233,.95)"
      );

      gradient.addColorStop(
        .5,
        "rgba(232,153,176,.72)"
      );

      gradient.addColorStop(
        1,
        "rgba(194,111,138,.34)"
      );


      ctx.fillStyle =
        gradient;

      ctx.fill();

    }


    /* =====================================================
       爱心
    ===================================================== */

    else if(
      this.type === "heart"
    ){

      const s =
        this.size;


      ctx.beginPath();

      ctx.moveTo(
        0,
        s * .9
      );

      ctx.bezierCurveTo(
        -s * 1.7,
        -s * .1,
        -s * .9,
        -s * 1.5,
        0,
        -s * .65
      );

      ctx.bezierCurveTo(
        s * .9,
        -s * 1.5,
        s * 1.7,
        -s * .1,
        0,
        s * .9
      );

      ctx.closePath();


      ctx.fillStyle =
        "rgba(224,137,163,.70)";

      ctx.shadowBlur =
        16;

      ctx.shadowColor =
        "rgba(227,148,173,.72)";

      ctx.fill();

    }


    /* =====================================================
       香槟光点
    ===================================================== */

    else if(
      this.type === "champagne"
    ){

      const radius =
        this.size * 4;


      const gradient =
        ctx.createRadialGradient(
          0,
          0,
          0,
          0,
          0,
          radius
        );


      gradient.addColorStop(
        0,
        "rgba(255,232,192,1)"
      );

      gradient.addColorStop(
        .25,
        "rgba(245,201,155,.70)"
      );

      gradient.addColorStop(
        1,
        "rgba(245,201,155,0)"
      );


      ctx.fillStyle =
        gradient;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    /* =====================================================
       星芒
    ===================================================== */

    else{

      const s =
        this.size * 3;


      ctx.shadowBlur =
        12;

      ctx.shadowColor =
        "rgba(255,224,184,.75)";


      ctx.fillStyle =
        "rgba(255,231,196,.92)";


      ctx.beginPath();

      ctx.moveTo(
        0,
        -s * 2.2
      );

      ctx.quadraticCurveTo(
        s * .35,
        -s * .45,
        s * 2.2,
        0
      );

      ctx.quadraticCurveTo(
        s * .35,
        s * .45,
        0,
        s * 2.2
      );

      ctx.quadraticCurveTo(
        -s * .35,
        s * .45,
        -s * 2.2,
        0
      );

      ctx.quadraticCurveTo(
        -s * .35,
        -s * .45,
        0,
        -s * 2.2
      );

      ctx.closePath();

      ctx.fill();

    }


    ctx.restore();

  }

}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   MEDIA
========================================================= */

function normalizeMedia(value){

  if(!value){
    return [];
  }


  if(Array.isArray(value)){

    return value
      .flat(Infinity)
      .filter(Boolean)
      .map(v => String(v).trim())
      .filter(Boolean);

  }


  if(typeof value === "string"){

    const text =
      value.trim();


    if(!text){
      return [];
    }


    try{

      const parsed =
        JSON.parse(text);


      if(Array.isArray(parsed)){

        return parsed
          .flat(Infinity)
          .filter(Boolean)
          .map(v => String(v).trim())
          .filter(Boolean);

      }

    }catch(e){}


    if(text.includes(",")){

      return text
        .split(",")
        .map(v => v.trim())
        .filter(Boolean);

    }


    return [text];

  }


  return [];

}


/* =========================================================
   STORAGE URL
========================================================= */

function getStorageUrl(path){

  if(!path){
    return "";
  }


  const value =
    String(path).trim();


  if(

    value.startsWith("http://") ||

    value.startsWith("https://") ||

    value.startsWith("data:")

  ){

    return value;

  }


  return (

    SUPABASE_URL +

    "/storage/v1/object/public/" +

    STORAGE_BUCKET +

    "/" +

    value.replace(/^\/+/,"")

  );

}


/* =========================================================
   PHOTOS
========================================================= */

function getPhotos(woman){

  let photos = [];


  if(woman.image_url){

    photos.push(
      woman.image_url
    );

  }


  photos =
    photos.concat(
      normalizeMedia(
        woman.photos
      )
    );


  return [

    ...new Set(

      photos
        .filter(Boolean)
        .map(getStorageUrl)

    )

  ];

}


/* =========================================================
   VIDEOS
========================================================= */

function getVideos(woman){

  return [

    ...new Set(

      normalizeMedia(
        woman.videos
      )
      .filter(Boolean)
      .map(getStorageUrl)

    )

  ];

}

let galleryMedia = [];

function openGallery(woman){

/* =========================================================
   RENDER GALLERY
========================================================= */

function renderGallery(){

  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.innerHTML = "";


  galleryMedia.forEach(media => {

    const slide =
      document.createElement(
        "div"
      );


    slide.className =
      "gallery-slide";


    if(media.type === "image"){

      slide.innerHTML = `

        <img
          src="${escapeHtml(media.url)}"
          draggable="false"
        >

      `;

    }else{

      slide.innerHTML = `

        <video
          controls
          playsinline
          preload="metadata"
        >

          <source
            src="${escapeHtml(media.url)}"
          >

        </video>

      `;

    }


    track.appendChild(slide);

  });


  updateGalleryCounter();


  requestAnimationFrame(() => {

    track.scrollLeft =
      track.clientWidth *
      galleryIndex;

  });

}


/* =========================================================
   GALLERY COUNTER
========================================================= */

function updateGalleryCounter(){

  const counter =
    document.getElementById(
      "galleryCounter"
    );


  if(galleryMedia.length){

    counter.textContent =

      `${galleryIndex + 1} / ${galleryMedia.length} · 左右滑动查看`;

  }

}


/* =========================================================
   GALLERY GO TO
========================================================= */

function galleryGoTo(index){

  if(!galleryMedia.length){
    return;
  }


  if(index < 0){

    index =
      galleryMedia.length - 1;

  }


  if(index >= galleryMedia.length){

    index = 0;

  }


  galleryIndex =
    index;


  const track =
    document.getElementById(
      "galleryTrack"
    );


  track.scrollTo({

    left:
      track.clientWidth *
      galleryIndex,

    behavior:"smooth"

  });


  updateGalleryCounter();

}


/* =========================================================
   GALLERY SCROLL
========================================================= */

document
  .getElementById("galleryTrack")
  .addEventListener(
    "scroll",
    function(){

      const width =
        this.clientWidth;


      if(!width){
        return;
      }


      const index =
        Math.round(
          this.scrollLeft /
          width
        );


      if(index !== galleryIndex){

        galleryIndex =
          index;

        updateGalleryCounter();

      }

    }
  );


/* =========================================================
   GALLERY BUTTONS
========================================================= */

document

      galleryGoTo(
        galleryIndex - 1
      )
  );

/* =========================================================
   WHATSAPP
========================================================= */

function makeWhatsAppUrl(value){

  const number =
    String(value || "")
      .replace(/[^\d]/g,"");


  if(!number){
    return "";
  }


  return (
    "https://wa.me/" +
    number
  );

}


/* =========================================================
   TELEGRAM
========================================================= */

function makeTelegramUrl(value){

  let username =
    String(value || "")
      .trim();


  if(!username){
    return "";
  }


  if(

    username.startsWith(
      "https://t.me/"
    )

    ||

    username.startsWith(
      "http://t.me/"
    )

  ){

    return username;

  }


  username =
    username.replace(
      /^@/,
      ""
    );


  return (
    "https://t.me/" +
    username
  );

}

/* =========================================================
   FILTER
========================================================= */

function filterWomen(){

  const city =
    document
      .getElementById("cityFilter")
      .value;


  const age =
    document
      .getElementById("ageFilter")
      .value;


  const filtered =
    women.filter(woman => {

      if(
        city &&
        woman.city !== city
      ){

        return false;

      }


      const womanAge =
        Number(woman.age);


      if(age === "18-25"){

        return (
          womanAge >= 18 &&
          womanAge <= 25
        );

      }


      if(age === "26-35"){

        return (
          womanAge >= 26 &&
          womanAge <= 35
        );

      }


      if(age === "36-45"){

        return (
          womanAge >= 36 &&
          womanAge <= 45
        );

      }


      if(age === "46+"){

        return womanAge >= 46;

      }


      return true;

    });


  renderWomen(filtered);

}
