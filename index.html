<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>缘分·相遇</title>

<meta
  name="description"
  content="认真认识一个人，从一次相遇开始。"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    Arial,
    sans-serif;

  color:#30272a;
  background:#f6eef1;
  line-height:1.6;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   全页面背景
========================================================= */

.page-background{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 8% 18%,
      rgba(218,133,157,.18),
      transparent 24%
    ),
    radial-gradient(
      circle at 92% 22%,
      rgba(235,184,145,.16),
      transparent 25%
    ),
    radial-gradient(
      circle at 50% 58%,
      rgba(204,130,153,.09),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      #f8f2f4 0%,
      #f5ecef 52%,
      #f1e4e9 100%
    );
}


/* =========================================================
   动态背景光
========================================================= */

.page-background::before,
.page-background::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  filter:blur(70px);
}

.page-background::before{
  width:520px;
  height:520px;
  left:-220px;
  top:22%;

  background:
    radial-gradient(
      circle,
      rgba(221,126,154,.22),
      transparent 70%
    );

  animation:
    backgroundGlowOne 14s ease-in-out infinite;
}

.page-background::after{
  width:560px;
  height:560px;
  right:-260px;
  top:48%;

  background:
    radial-gradient(
      circle,
      rgba(233,184,143,.20),
      transparent 70%
    );

  animation:
    backgroundGlowTwo 17s ease-in-out infinite;
}

@keyframes backgroundGlowOne{

  0%,100%{
    transform:translate3d(0,0,0) scale(.85);
    opacity:.45;
  }

  50%{
    transform:translate3d(180px,90px,0) scale(1.2);
    opacity:1;
  }
}

@keyframes backgroundGlowTwo{

  0%,100%{
    transform:translate3d(0,0,0) scale(.9);
    opacity:.4;
  }

  50%{
    transform:translate3d(-170px,-110px,0) scale(1.22);
    opacity:1;
  }
}


/* =========================================================
   全页面动态粒子
   注意：
   Canvas 在卡片下面
   卡片永远在 Canvas 上面
========================================================= */

#romanceCanvas{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  z-index:5;

  pointer-events:none;

  display:block;

  opacity:1;
}


/* =========================================================
   HEADER
========================================================= */

.site-header{
  height:72px;

  position:sticky;
  top:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 6%;

  color:#fff;

  background:
    linear-gradient(
      90deg,
      rgba(28,17,22,.98),
      rgba(57,32,40,.97)
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 6px 28px
    rgba(0,0,0,.16);
}

.brand{
  font-size:22px;
  font-weight:700;
  letter-spacing:3px;
  color:#fff;
}

.brand span{
  color:#df9faf;
  margin:0 5px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:610px;

  position:relative;
  z-index:10;

  display:flex;
  align-items:center;

  padding:90px 8%;

  overflow:hidden;

  color:#fff;

  background-image:
    linear-gradient(
      90deg,
      rgba(20,13,17,.88) 0%,
      rgba(28,18,22,.72) 38%,
      rgba(30,20,24,.44) 70%,
      rgba(20,14,18,.25) 100%
    ),
    url("https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png");

  background-size:cover;
  background-position:center;

  isolation:isolate;
}

.hero::before{
  content:"";

  position:absolute;

  width:520px;
  height:520px;

  left:-220px;
  bottom:-280px;

  border-radius:50%;

  background:
    rgba(216,126,151,.22);

  filter:blur(100px);

  animation:
    heroGlow 12s ease-in-out infinite;
}

.hero::after{
  content:"";

  position:absolute;

  width:450px;
  height:450px;

  right:-190px;
  top:-190px;

  border-radius:50%;

  background:
    rgba(239,181,153,.17);

  filter:blur(95px);

  animation:
    heroGlow 15s ease-in-out infinite reverse;
}

@keyframes heroGlow{

  0%,100%{
    transform:scale(.9);
    opacity:.4;
  }

  50%{
    transform:scale(1.25);
    opacity:1;
  }
}

.hero-content{
  max-width:720px;
  position:relative;
  z-index:10;
}

.eyebrow{
  margin-bottom:20px;

  color:#e9aaba;

  font-size:12px;
  font-weight:600;
  letter-spacing:5px;
}

.hero h1{
  margin-bottom:26px;

  font-size:
    clamp(40px,6vw,76px);

  line-height:1.16;
  font-weight:600;
  letter-spacing:1px;

  text-shadow:
    0 5px 28px
    rgba(0,0,0,.30);
}

.hero-description{
  max-width:550px;

  color:
    rgba(255,255,255,.85);

  font-size:17px;
  line-height:1.9;
}

.hero-label{
  display:flex;
  align-items:center;
  gap:12px;

  margin-top:35px;

  color:
    rgba(255,255,255,.65);

  font-size:13px;
}

.hero-label::before{
  content:"";

  width:34px;
  height:1px;

  background:#d99cac;
}


/* =========================================================
   内容区域
========================================================= */

.content-section{
  position:relative;
  z-index:10;

  overflow:hidden;

  padding:
    55px 0 95px;

  background:
    radial-gradient(
      ellipse at 10% 5%,
      rgba(215,147,166,.18),
      transparent 30%
    ),
    radial-gradient(
      ellipse at 90% 25%,
      rgba(228,181,153,.16),
      transparent 30%
    ),
    radial-gradient(
      ellipse at 50% 65%,
      rgba(213,135,160,.11),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      rgba(248,242,244,.94),
      rgba(246,237,240,.90) 55%,
      rgba(239,225,231,.96)
    );
}


/* =========================================================
   资料区域恋爱背景装饰
   这层在 Canvas 上面、卡片下面
========================================================= */

.profiles-area{
  position:relative;
  z-index:10;
  overflow:hidden;

  padding:
    5px 0 25px;
}

.profiles-area::before{
  content:"";

  position:absolute;

  width:720px;
  height:720px;

  left:-300px;
  top:5%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(224,143,166,.17),
      rgba(224,143,166,.05) 45%,
      transparent 72%
    );

  filter:blur(35px);

  animation:
    profileGlowOne 15s ease-in-out infinite;

  pointer-events:none;
}

.profiles-area::after{
  content:"";

  position:absolute;

  width:650px;
  height:650px;

  right:-300px;
  top:38%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(232,184,143,.16),
      rgba(232,184,143,.04) 45%,
      transparent 72%
    );

  filter:blur(35px);

  animation:
    profileGlowTwo 18s ease-in-out infinite;

  pointer-events:none;
}

@keyframes profileGlowOne{

  0%,100%{
    transform:translate3d(0,0,0) scale(.9);
    opacity:.4;
  }

  50%{
    transform:translate3d(190px,80px,0) scale(1.18);
    opacity:1;
  }
}

@keyframes profileGlowTwo{

  0%,100%{
    transform:translate3d(0,0,0) scale(.9);
    opacity:.35;
  }

  50%{
    transform:translate3d(-170px,-100px,0) scale(1.2);
    opacity:1;
  }
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  width:88%;
  max-width:1400px;

  margin:0 auto 25px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
  flex-wrap:wrap;

  position:relative;
  z-index:20;
}

.section-title small{
  display:block;

  margin-bottom:4px;

  color:#b97889;

  font-size:11px;
  letter-spacing:4px;
}

.section-title h2{
  color:#392c30;

  font-size:27px;
  font-weight:600;
}

.filters{
  display:flex;
  gap:10px;
}

.filters select{
  appearance:none;

  min-width:130px;

  padding:
    11px 38px 11px 15px;

  border:
    1px solid
    #e0d0d5;

  border-radius:10px;

  outline:none;

  color:#4b4043;

  background:
    rgba(255,255,255,.88);

  box-shadow:
    0 6px 22px
    rgba(72,42,50,.06);

  cursor:pointer;
}

.filters select:focus{
  border-color:#c58a9a;
}


/* =========================================================
   WOMEN GRID
========================================================= */

.women-grid{
  width:88%;
  max-width:1400px;

  margin:
    0 auto;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:24px;

  position:relative;

  z-index:30;
}


/* =========================================================
   WOMAN CARD
   重点：
   z-index 高于 Canvas
========================================================= */

.woman-card{
  position:relative;

  z-index:40;

  overflow:hidden;

  border:
    1px solid
    rgba(219,201,205,.90);

  border-radius:16px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 10px 34px
    rgba(58,37,43,.09);

  cursor:pointer;

  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.woman-card:hover{
  transform:translateY(-6px);

  box-shadow:
    0 22px 52px
    rgba(63,38,47,.17);
}


/* =========================================================
   IMAGE
========================================================= */

.woman-image{
  width:100%;

  aspect-ratio:3 / 4;

  position:relative;

  overflow:hidden;

  background:#eee5e8;
}

.woman-image::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      transparent 50%,
      rgba(30,20,24,.13)
    );
}

.woman-image img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform .6s ease;
}

.woman-card:hover
.woman-image img{
  transform:scale(1.045);
}


/* =========================================================
   INFO
========================================================= */

.woman-info{
  position:relative;

  padding:
    18px 18px 20px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.98),
      rgba(253,247,249,.98)
    );
}

.woman-info h2{
  margin-bottom:5px;

  color:#332a2d;

  font-size:20px;
  font-weight:600;
}

.city{
  margin-bottom:7px;

  color:#b77b8b;

  font-size:13px;
}

.woman-info p{
  color:#827579;
  font-size:13px;
}

.description{
  margin-top:8px;

  line-height:1.7;

  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;

  overflow:hidden;
}


/* =========================================================
   MORE CARD
========================================================= */

.more-card{
  position:relative;

  z-index:40;

  min-height:100%;

  overflow:hidden;

  border-radius:16px;

  background:#281c21;

  box-shadow:
    0 10px 35px
    rgba(58,34,42,.15);

  cursor:pointer;
}

.more-card-bg{
  position:absolute;
  inset:0;

  background-image:
    linear-gradient(
      rgba(30,17,22,.22),
      rgba(27,16,21,.88)
    ),
    url("https://yutraouosffjteivvlfx.supabase.co/storage/v1/object/public/women-photos/12121.png");

  background-size:cover;
  background-position:center;

  transition:
    transform .6s ease;
}

.more-card:hover .more-card-bg{
  transform:scale(1.05);
}

.more-card-content{
  position:relative;
  z-index:2;

  min-height:100%;

  padding:30px;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  color:#fff;
}

.more-card-content h2{
  margin-bottom:12px;

  font-size:26px;
  line-height:1.3;
}

.more-card-content p{
  margin-bottom:20px;

  color:
    rgba(255,255,255,.82);

  font-size:14px;
  line-height:1.8;
}

.join-button{
  display:flex;
  align-items:center;
  justify-content:center;

  width:100%;

  padding:13px;

  border-radius:10px;

  color:#33282c;

  background:#fff;

  font-weight:600;

  transition:.25s ease;
}

.more-card:hover .join-button{
  background:#f3dce2;
}


/* =========================================================
   EMPTY / LOADING
========================================================= */

.loading{
  grid-column:1 / -1;

  padding:80px 20px;

  color:#9a898e;

  text-align:center;
}


/* =========================================================
   ROMANTIC BANNER
   移到资料卡下面
========================================================= */

.romantic-banner{
  width:88%;
  max-width:1400px;

  min-height:250px;

  margin:
    65px auto 0;

  position:relative;

  z-index:20;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-radius:24px;

  background:
    linear-gradient(
      115deg,
      rgba(36,20,27,.97),
      rgba(76,42,52,.94),
      rgba(48,28,35,.96)
    );

  box-shadow:
    0 25px 70px
    rgba(57,31,40,.20),
    inset 0 1px 0
    rgba(255,255,255,.10);

  isolation:isolate;
}

.romantic-banner::before{
  content:"";

  position:absolute;

  width:500px;
  height:500px;

  left:-190px;
  top:-280px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(225,144,164,.40),
      rgba(225,144,164,.05) 50%,
      transparent 72%
    );

  filter:blur(18px);

  animation:
    bannerGlowOne 10s ease-in-out infinite;
}

.romantic-banner::after{
  content:"";

  position:absolute;

  width:520px;
  height:520px;

  right:-230px;
  bottom:-340px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(232,190,146,.34),
      rgba(232,190,146,.05) 50%,
      transparent 73%
    );

  filter:blur(18px);

  animation:
    bannerGlowTwo 13s ease-in-out infinite;
}

@keyframes bannerGlowOne{

  0%,100%{
    transform:translate3d(0,0,0) scale(.9);
    opacity:.5;
  }

  50%{
    transform:translate3d(170px,90px,0) scale(1.25);
    opacity:1;
  }
}

@keyframes bannerGlowTwo{

  0%,100%{
    transform:translate3d(0,0,0) scale(1);
    opacity:.45;
  }

  50%{
    transform:translate3d(-150px,-90px,0) scale(1.2);
    opacity:.95;
  }
}

.romantic-banner-content{
  min-height:250px;

  position:relative;
  z-index:5;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  padding:30px;

  text-align:center;
}

.romantic-mini{
  margin-bottom:9px;

  color:#e8bd9f;

  font-size:10px;
  letter-spacing:6px;

  opacity:.9;
}

.romantic-banner h2{
  color:#fff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(28px,4vw,47px);

  font-weight:400;

  line-height:1.25;
  letter-spacing:2px;

  text-shadow:
    0 5px 30px
    rgba(0,0,0,.35);
}

.romantic-banner h2 span{
  color:#e6aabd;
}

.romantic-subtitle{
  margin-top:10px;

  color:
    rgba(255,255,255,.73);

  font-size:14px;
  letter-spacing:2px;
}

.romantic-line{
  width:100px;
  height:1px;

  position:relative;

  margin-top:19px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(230,176,145,.85),
      transparent
    );
}

.romantic-heart{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  padding:0 8px;

  color:#e6a8ba;

  font-size:14px;

  background:#4c2b35;
}


/* =========================================================
   BANNER 装饰角
========================================================= */

.banner-corner{
  position:absolute;

  width:70px;
  height:70px;

  z-index:4;

  border-color:
    rgba(233,185,160,.32);

  border-style:solid;
}

.banner-corner.left-top{
  left:18px;
  top:18px;

  border-width:1px 0 0 1px;

  border-radius:15px 0 0 0;
}

.banner-corner.right-top{
  right:18px;
  top:18px;

  border-width:1px 1px 0 0;

  border-radius:0 15px 0 0;
}

.banner-corner.left-bottom{
  left:18px;
  bottom:18px;

  border-width:0 0 1px 1px;

  border-radius:0 0 0 15px;
}

.banner-corner.right-bottom{
  right:18px;
  bottom:18px;

  border-width:0 1px 1px 0;

  border-radius:0 0 15px 0;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  position:relative;
  z-index:20;

  overflow:hidden;

  padding:
    70px 20px 75px;

  color:
    rgba(255,255,255,.68);

  font-size:13px;

  text-align:center;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(211,137,157,.25),
      transparent 32%
    ),
    radial-gradient(
      circle at 85% 70%,
      rgba(221,166,139,.20),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #24171c 0%,
      #352128 45%,
      #24171c 100%
    );

  border-top:
    1px solid
    rgba(255,255,255,.08);
}

footer::before,
footer::after{
  content:"";

  position:absolute;

  border-radius:50%;

  pointer-events:none;

  filter:blur(75px);
}

footer::before{
  width:380px;
  height:380px;

  left:-180px;
  bottom:-260px;

  background:
    rgba(212,132,153,.18);

  animation:
    footerGlow 11s ease-in-out infinite;
}

footer::after{
  width:320px;
  height:320px;

  right:-140px;
  top:-200px;

  background:
    rgba(224,174,145,.14);

  animation:
    footerGlow 15s ease-in-out infinite reverse;
}

@keyframes footerGlow{

  0%,100%{
    transform:scale(.85);
    opacity:.4;
  }

  50%{
    transform:scale(1.25);
    opacity:1;
  }
}

footer span{
  position:relative;
  z-index:2;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery-modal{
  position:fixed;
  inset:0;

  z-index:1000;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(15,10,13,.96);
}

.gallery-modal.show{
  display:flex;
}

.gallery-container{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  position:relative;
}

.gallery-header{
  height:65px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  color:#fff;
}

.gallery-title{
  font-size:17px;
  font-weight:600;
}

.gallery-close{
  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  color:#fff;

  background:
    rgba(255,255,255,.13);

  font-size:25px;

  cursor:pointer;
}

.gallery-body{
  flex:1;

  min-height:0;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.gallery-track{
  width:100%;
  height:100%;

  display:flex;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.gallery-track::-webkit-scrollbar{
  display:none;
}

.gallery-slide{
  min-width:100%;
  height:100%;

  padding:10px 70px;

  display:flex;
  align-items:center;
  justify-content:center;

  scroll-snap-align:center;
}

.gallery-slide img{
  max-width:100%;
  max-height:100%;

  object-fit:contain;

  border-radius:6px;

  user-select:none;

  -webkit-user-drag:none;
}

.gallery-slide video{
  max-width:100%;
  max-height:100%;

  width:auto;
  height:auto;

<script>

/* =========================================================
   ROMANCE PARTICLES
========================================================= */

const canvas =
  document.getElementById("romanceCanvas");

const ctx =
  canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;
let particles = [];

const prefersReducedMotion =
  window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas(){

  width =
    window.innerWidth;

  height =
    window.innerHeight;

  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    width * dpr;

  canvas.height =
    height * dpr;

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   PARTICLE
========================================================= */

class RomanceParticle{

  constructor(){

    this.reset(true);

  }


  reset(initial = false){

    const random =
      Math.random();

    if(random < .42){

      this.type = "petal";

    }else if(random < .62){

      this.type = "heart";

    }else if(random < .84){

      this.type = "bubble";

    }else{

      this.type = "star";

    }


    this.x =
      Math.random() * width;

    this.y =
      initial
        ? Math.random() * height
        : -40;


    if(this.type === "petal"){

      this.size =
        4 + Math.random() * 6;

      this.speedY =
        .35 + Math.random() * .65;

    }else if(this.type === "heart"){

      this.size =
        4 + Math.random() * 5;

      this.speedY =
        .20 + Math.random() * .40;

    }else if(this.type === "bubble"){

      this.size =
        1.5 + Math.random() * 2.5;

      this.speedY =
        .12 + Math.random() * .35;

    }else{

      this.size =
        2 + Math.random() * 2.2;

      this.speedY =
        .10 + Math.random() * .25;

    }


    this.speedX =
      -.22 + Math.random() * .44;


    this.rotation =
      Math.random() *
      Math.PI * 2;


    this.rotationSpeed =
      -.015 +
      Math.random() * .03;


    this.wave =
      Math.random() *
      Math.PI * 2;


    this.waveSpeed =
      .008 +
      Math.random() * .018;


    this.phase =
      Math.random() *
      Math.PI * 2;


    this.phaseSpeed =
      .018 +
      Math.random() * .035;


    this.opacity =
      .22 +
      Math.random() * .55;

  }


  update(){

    this.y +=
      this.speedY;

    this.wave +=
      this.waveSpeed;

    this.rotation +=
      this.rotationSpeed;

    this.phase +=
      this.phaseSpeed;


    this.x +=
      this.speedX +
      Math.sin(this.wave) * .25;


    if(
      this.y >
      height + 50
    ){

      this.reset(false);

    }


    if(
      this.x <
      -50
    ){

      this.x =
        width + 20;

    }


    if(
      this.x >
      width + 50
    ){

      this.x =
        -20;

    }

  }


  draw(){

    ctx.save();

    ctx.translate(
      this.x,
      this.y
    );

    ctx.rotate(
      this.rotation
    );


    /* 所有粒子闪烁 */

    const blink =
      .58 +
      Math.sin(this.phase) * .42;

    ctx.globalAlpha =
      this.opacity * blink;


    /* =====================================================
       樱花花瓣
    ===================================================== */

    if(
      this.type === "petal"
    ){

      const s =
        this.size;

      ctx.beginPath();

      ctx.moveTo(
        0,
        -s
      );

      ctx.bezierCurveTo(
        s * 1.5,
        -s * .7,
        s * 1.3,
        s * .9,
        0,
        s
      );

      ctx.bezierCurveTo(
        -s * 1.3,
        s * .9,
        -s * 1.5,
        -s * .7,
        0,
        -s
      );

      ctx.closePath();


      const gradient =
        ctx.createLinearGradient(
          0,
          -s,
          0,
          s
        );

      gradient.addColorStop(
        0,
        "rgba(255,224,232,.95)"
      );

      gradient.addColorStop(
        .55,
        "rgba(231,153,177,.72)"
      );

      gradient.addColorStop(
        1,
        "rgba(194,111,138,.38)"
      );

      ctx.fillStyle =
        gradient;

      ctx.fill();

    }


    /* =====================================================
       心形
    ===================================================== */

    else if(
      this.type === "heart"
    ){

      const s =
        this.size;

      ctx.beginPath();

      ctx.moveTo(
        0,
        s
      );

      ctx.bezierCurveTo(
        -s * 1.8,
        -s * .1,
        -s * .9,
        -s * 1.4,
        0,
        -s * .55
      );

      ctx.bezierCurveTo(
        s * .9,
        -s * 1.4,
        s * 1.8,
        -s * .1,
        0,
        s
      );

      ctx.closePath();

      ctx.fillStyle =
        "rgba(225,139,165,.72)";

      ctx.shadowBlur =
        12;

      ctx.shadowColor =
        "rgba(228,145,170,.70)";

      ctx.fill();

    }


    /* =====================================================
       香槟光点
    ===================================================== */

    else if(
      this.type === "bubble"
    ){

      const radius =
        this.size * 4;

      const gradient =
        ctx.createRadialGradient(
          0,
          0,
          0,
          0,
          0,
          radius
        );

      gradient.addColorStop(
        0,
        "rgba(255,230,190,.98)"
      );

      gradient.addColorStop(
        .25,
        "rgba(246,203,157,.72)"
      );

      gradient.addColorStop(
        1,
        "rgba(246,203,157,0)"
      );

      ctx.fillStyle =
        gradient;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    /* =====================================================
       小型星芒
       不再使用十字线
       改为四芒星 + 呼吸发光
    ===================================================== */

    else{

      const s =
        this.size;

      const breathing =
        .65 +
        Math.sin(this.phase * .75) * .35;

      ctx.globalAlpha =
        this.opacity *
        breathing;

      ctx.shadowBlur =
        10 + breathing * 12;

      ctx.shadowColor =
        "rgba(255,220,180,.95)";

      ctx.fillStyle =
        "rgba(255,230,194,.95)";


      /* 四芒星 */

      ctx.beginPath();

      ctx.moveTo(
        0,
        -s * 3.2
      );

      ctx.lineTo(
        s * .65,
        -s * .65
      );

      ctx.lineTo(
        s * 3.2,
        0
      );

      ctx.lineTo(
        s * .65,
        s * .65
      );

      ctx.lineTo(
        0,
        s * 3.2
      );

      ctx.lineTo(
        -s * .65,
        s * .65
      );

      ctx.lineTo(
        -s * 3.2,
        0
      );

      ctx.lineTo(
        -s * .65,
        -s * .65
      );

      ctx.closePath();

      ctx.fill();

    }


    ctx.restore();

  }

}


/* =========================================================
   创建粒子
========================================================= */

function createParticles(){

  particles = [];

  const mobile =
    window.innerWidth <= 700;

  const count =
    mobile
      ? 38
      : 82;

  for(
    let i = 0;
    i < count;
    i++
  ){

    particles.push(
      new RomanceParticle()
    );

  }

}

createParticles();

window.addEventListener(
  "resize",
  createParticles
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  particles.forEach(
    particle => {

      particle.update();
      particle.draw();

    }
  );

  requestAnimationFrame(
    animate
  );

}

if(!prefersReducedMotion){

  animate();

}


/* =========================================================

  "https://yutraouosffjteivvlfx.supabase.co";

const SUPABASE_KEY =

const STORAGE_BUCKET =
  "women-photos";

/* =========================================================
   BASIC
========================================================= */

document

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   MEDIA
========================================================= */

function normalizeMedia(value){

  if(!value){
    return [];
  }

  if(Array.isArray(value)){

    return value
      .flat(Infinity)
      .filter(Boolean)
      .map(v => String(v).trim())
      .filter(Boolean);

  }

  if(typeof value !== "string"){
    return [];
  }

  const text =
    value.trim();

  if(!text){
    return [];
  }

  try{

    const parsed =
      JSON.parse(text);

    if(Array.isArray(parsed)){

      return parsed
        .flat(Infinity)
        .filter(Boolean)
        .map(v => String(v).trim())
        .filter(Boolean);

    }

  }catch(e){}

  if(text.includes(",")){

    return text
      .split(",")
      .map(v => v.trim())
      .filter(Boolean);

  }

  return [text];

}


/* =========================================================
   STORAGE URL
========================================================= */

function getStorageUrl(path){

  if(!path){
    return "";
  }

  const value =
    String(path).trim();

  if(
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ){

    return value;

  }

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    STORAGE_BUCKET +
    "/" +
    value.replace(/^\/+/,"")
  );

}


/* =========================================================
   PHOTOS
========================================================= */

function getPhotos(woman){

  const photos = [];

  if(woman.image_url){
    photos.push(woman.image_url);
  }

  photos.push(
    ...normalizeMedia(woman.photos)
  );

  return [
    ...new Set(
      photos
        .filter(Boolean)
        .map(getStorageUrl)
    )
  ];

}


/* =========================================================
   VIDEOS
========================================================= */

function getVideos(woman){

  return [
    ...new Set(
      normalizeMedia(woman.videos)
        .filter(Boolean)
        .map(getStorageUrl)
    )
  ];

}


/* =========================================================
   LOAD WOMEN
========================================================= */

async function loadWomen(){

  const grid =
    document.getElementById(
      "womenGrid"

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/women" +
      "?select=*" +
      "&is_published=eq.true" +
      "&order=created_at.desc";

    const response =
      await fetch(
        url,
        {
          headers:{
            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );

    const text =
      await response.text();

    if(!response.ok){
      throw new Error(text);
    }

    women =
      JSON.parse(text) || [];

    createCityFilter();

    renderWomen(women);

  }catch(error){

    console.error(
      "资料加载失败:",
      error
    );

    grid.innerHTML = `
      <div class="loading">
        暂时无法加载资料。

}

function createCityFilter(){

      option.value =
        city;

      option.textContent =
        city;

      select.appendChild(
        option
      );

    }
  );

}

/* =========================================================
   GALLERY
========================================================= */

let galleryMedia = [];
let galleryIndex = 0;


function openGallery(woman){

  const photos =
    getPhotos(woman);

  const videos =
    getVideos(woman);

  galleryMedia = [
    ...photos.map(url => ({
      type:"image",
      url
    })),

    ...videos.map(url => ({
      type:"video",
      url
    }))
  ];

  if(!galleryMedia.length){
    return;
  }

  galleryIndex = 0;

  document
    .getElementById(
      "galleryTitle"
    )
    .textContent =
    woman.name ||
    "女士资料";

  renderGallery();

  document
    .getElementById(
      "galleryModal"
    )
    .classList.add("show");

  document.body.style.overflow =
    "hidden";

}


function renderGallery(){

  const track =
    document.getElementById(
      "galleryTrack"
    );

  track.innerHTML = "";

  galleryMedia.forEach(
    media => {

      const slide =
        document.createElement(
          "div"
        );

      slide.className =
        "gallery-slide";

      if(
        media.type === "image"
      ){

        slide.innerHTML = `
          <img
            src="${escapeHtml(
              media.url
            )}"
            draggable="false"
            alt=""
          >
        `;

      }else{

        slide.innerHTML = `
          <video
            controls
            playsinline
            preload="metadata"
          >
            <source
              src="${escapeHtml(
                media.url
              )}"
            >
          </video>
        `;

      }

      track.appendChild(slide);

    }
  );

  updateGalleryCounter();

  requestAnimationFrame(
    () => {

      track.scrollLeft =
        track.clientWidth *
        galleryIndex;

    }
  );

}


function updateGalleryCounter(){

  const counter =
    document.getElementById(
      "galleryCounter"
    );

  if(galleryMedia.length){

    counter.textContent =
      `${galleryIndex + 1} / ${galleryMedia.length} · 左右滑动查看`;

  }

}


function galleryGoTo(index){

  if(!galleryMedia.length){
    return;
  }

  if(index < 0){
    index =
      galleryMedia.length - 1;
  }

  if(
    index >=
    galleryMedia.length
  ){
    index = 0;
  }

  galleryIndex =
    index;

  const track =
    document.getElementById(
      "galleryTrack"
    );

  track.scrollTo({
    left:
      track.clientWidth *
      galleryIndex,

    behavior:"smooth"
  });

  updateGalleryCounter();

}


/* =========================================================
   GALLERY SCROLL
========================================================= */

document
  .getElementById(
    "galleryTrack"
  )
  .addEventListener(
    "scroll",
    function(){

      const track =
        this;

      const width =
        track.clientWidth;

      if(!width){
        return;
      }

      const index =
        Math.round(
          track.scrollLeft /
          width
        );

      if(
        index !==
        galleryIndex
      ){

        galleryIndex =
          index;

        updateGalleryCounter();

      }

    }
  );


document
  .getElementById(
    "galleryPrev"
  )
  .addEventListener(
    "click",
    () =>
      galleryGoTo(
        galleryIndex - 1
      )
  );


document
  .getElementById(
    "galleryNext"
  )
  .addEventListener(
    "click",
    () =>
      galleryGoTo(
        galleryIndex + 1
      )
  );


document
  .getElementById(
    "galleryClose"
  )
  .addEventListener(
    "click",
    closeGallery
  );


function closeGallery(){

  document
    .getElementById(
      "galleryModal"
    )
    .classList.remove("show");

  document.body.style.overflow = "";

  document
    .querySelectorAll(
      "#galleryTrack video"
    )
    .forEach(
      video => video.pause()
    );

}


/* =========================================================
   CONTACT
========================================================= */

async function loadJoinContact(){

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/site_settings" +
      "?select=whatsapp,telegram" +
      "&setting_key=eq.join_contact" +
      "&limit=1";

    const response =
      await fetch(
        url,
        {
          headers:{
            apikey:
              SUPABASE_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );

    if(!response.ok){
      throw new Error(
        await response.text()
      );
    }

    const data =
      await response.json();

    if(data.length){
      joinContact =
        data[0];
    }

  }catch(error){

    console.error(
      "联系方式加载失败:",
      error
    );

  }

}


/* =========================================================
   WHATSAPP URL
========================================================= */

function makeWhatsAppUrl(value){

  const number =
    String(value || "")
      .replace(/[^\d]/g,"");

  if(!number){
    return "";
  }

  return (
    "https://wa.me/" +
    number
  );

}


/* =========================================================
   TELEGRAM URL
========================================================= */

function makeTelegramUrl(value){

  let username =
    String(value || "").trim();

  if(!username){
    return "";
  }

  if(
    username.startsWith(
      "https://t.me/"
    ) ||
    username.startsWith(
      "http://t.me/"
    )
  ){

    return username;

  }

  username =
    username.replace(
      /^@/,
      ""
    );

  return (
    "https://t.me/" +
    username
  );

}


/* =========================================================
   JOIN MODAL
========================================================= */

function openJoinModal(){

  const box =
    document.getElementById(
      "joinContacts"
    );

  box.innerHTML = "";

  const whatsappUrl =
    makeWhatsAppUrl(
      joinContact.whatsapp
    );

  const telegramUrl =
    makeTelegramUrl(
      joinContact.telegram
    );


  if(whatsappUrl){

    const link =
      document.createElement("a");

    link.href =
      whatsappUrl;

    link.target =
      "_blank";

    link.rel =
      "noopener noreferrer";

    link.className =
      "join-whatsapp";

    link.textContent =
      "WhatsApp 联系我们";

    box.appendChild(link);

  }


  if(telegramUrl){

    const link =
      document.createElement("a");

    link.href =
      telegramUrl;

    link.target =
      "_blank";

    link.rel =
      "noopener noreferrer";

    link.className =
      "join-telegram";

    link.textContent =
      "Telegram 联系我们";

    box.appendChild(link);

  }


  if(
    !whatsappUrl &&
    !telegramUrl
  ){

    box.innerHTML = `
      <div class="no-contact">
        暂无联系方式，请稍后再试。
      </div>
    `;

  }


  document
    .getElementById(
      "joinModal"
    )
    .classList.add("show");

}


function closeJoinModal(){

  document
    .getElementById(
      "joinModal"
    )
    .classList.remove("show");

}


document
  .getElementById(
    "joinClose"
  )
  .addEventListener(
    "click",
    closeJoinModal
  );


document
  .getElementById(
    "joinModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        closeJoinModal();

      }

    }
  );


/* =========================================================
   FILTER
========================================================= */

function filterWomen(){

  const city =
    document
      .getElementById(
        "cityFilter"
      )
      .value;

  const age =
    document
      .getElementById(
        "ageFilter"
      )
      .value;


  const filtered =
    women.filter(
      woman => {

        if(
          city &&
          woman.city !== city
        ){

          return false;

        }


        const womanAge =
          Number(woman.age);


        if(age === "18-25"){

          return (
            womanAge >= 18 &&
            womanAge <= 25
          );

        }


        if(age === "26-35"){

          return (
            womanAge >= 26 &&
            womanAge <= 35
          );

        }


        if(age === "36-45"){

          return (
            womanAge >= 36 &&
            womanAge <= 45
          );

        }


        if(age === "46+"){

          return (
            womanAge >= 46
          );

        }


        return true;

      }
    );


  renderWomen(filtered);

}


document
  .getElementById(
    "cityFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


document
  .getElementById(
    "ageFilter"
  )
  .addEventListener(
    "change",
    filterWomen
  );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeGallery();
      closeJoinModal();

    }


    const gallery =
      document.getElementById(
        "galleryModal"
      );

    if(
      gallery.classList.contains("show")
    ){

      if(
        event.key === "ArrowLeft"
      ){

        galleryGoTo(
          galleryIndex - 1
        );

      }

      if(
        event.key === "ArrowRight"
      ){

        galleryGoTo(
          galleryIndex + 1
        );

      }

    }

  }
);


/* =========================================================
   START
========================================================= */

Promise.all([
  loadWomen(),
  loadJoinContact()
]);

</script>
